syntax = "proto3";

package ardents.private.v1;

option go_package = "ardents/internal/network/privacy/wire;wire";

enum MessageClass {
  MESSAGE_CLASS_UNSPECIFIED = 0;
  DISCOVERY_RECORD = 1;
  BLOB_FETCH_REQUEST = 2;
  BLOB_FETCH_RESPONSE = 3;
  CAPABILITY_CONTROL = 4;
  BLOB_REPLICA_CONTROL = 5;
}

message PrivateMessageV1 {
  uint32 protocol_version = 1;
  MessageClass message_class = 2;
  bytes grant_id = 3;
  string sender_principal = 4;
  bytes sender_public_key = 5;
  uint32 payload_version = 6;
  bytes payload = 7;
  bytes signature = 8;
  bytes padding = 9;
}
