name: Verify relocated Endpoint platform checks
on:
  push:
    branches:
      - codex/verify-endpoint-platform-b8cd4f7b
permissions:
  contents: read
jobs:
  endpoint-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
      - name: Execute real platform pre-start and generation staging
        run: |
          set -euo pipefail
          test "$(ps -p 1 -o comm=)" = systemd
          test "$(systemctl --version | awk 'NR == 1 { print $2 }')" = 255
          test -r /sys/fs/cgroup/cgroup.controllers
          native_dir="$(sudo mktemp -d /ardents-native-platform.XXXXXX)"
          trap 'sudo rm -rf -- "$native_dir"' EXIT
          test "$(findmnt -T "$native_dir" -n -o FSTYPE)" = ext4
          test "$(findmnt -T /var/lib -n -o FSTYPE)" = ext4
          sudo env PATH="$PATH" TMPDIR="$native_dir" GOTOOLCHAIN=local GOENV=off GOFLAGS=-mod=readonly GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" sh -ec 'umask 022; exec go test -race -tags endpoint_platform_native ./tests/e2e/endpoint -run "^TestNativeEndpointPlatform(PrestartTrustTransfer|StagesGeneration)$" -count=1 -v -timeout=7m'
  endpoint-manager-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
      - name: Provision host tooling and check two real managers
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y systemd-container debootstrap
          test "$(ps -p 1 -o comm=)" = systemd
          test -r /sys/fs/cgroup/cgroup.controllers
          sudo env PATH="$PATH" GOTOOLCHAIN=local GOENV=off GOFLAGS=-mod=readonly GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" sh -ec 'umask 022; exec go test -race -tags endpoint_pair_native ./tests/e2e/endpoint -run "^TestNativeEndpointPlatformLedPair$" -count=1 -v -timeout=25m'
