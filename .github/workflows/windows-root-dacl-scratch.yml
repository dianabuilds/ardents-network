name: Temporary Windows root DACL verification
on:
  push:
    branches: [codex/948-resume]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: false
      - name: Verify Windows owner-only store roots and their consumers
        shell: pwsh
        run: |
          $env:GOTOOLCHAIN = 'local'
          $volume = Get-Volume -DriveLetter ([System.IO.Path]::GetPathRoot($env:TEMP).Substring(0, 1))
          if ($volume.FileSystem -ne 'NTFS') { throw 'Native test requires NTFS' }
          $original = Join-Path $env:GITHUB_WORKSPACE 'internal/durablefile/owner_root_windows.go'
          $source = Join-Path $env:RUNNER_TEMP 'owner-root-diagnostic.go'
          $text = [IO.File]::ReadAllText($original)
          $needle = @'
	if err := checkWindowsFileOwner(handle, owner); err != nil {
		return errors.Join(errors.New(refusal.RootDACL), err)
	}
'@
          if (-not $text.Contains($needle)) { throw 'owner-check control not found' }
          [IO.File]::WriteAllText($source, $text.Replace($needle, ''))
          $overlay = @{ Replace = @{ $original = $source }} | ConvertTo-Json
          $overlayPath = Join-Path $env:RUNNER_TEMP 'diagnostic-overlay.json'
          [IO.File]::WriteAllText($overlayPath, $overlay)
          go test -overlay $overlayPath -race ./internal/durablefile -run '^TestEnforceOwnerOnlyRoot(RefusesExternalHardLink|DoesNotPropagateToExistingDirectory|RefusesRedirectedEntry)$' -count=1 -v -timeout=8m
          exit $LASTEXITCODE
