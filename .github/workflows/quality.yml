name: Infrastructure unit policy verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform:
    name: Platform ${{ matrix.role }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: unit-policy
          - role: source
            tag: source_installed_native
            test: TestNativeSourceInstalledLifecycle
          - role: forwarding
            tag: forwarding_platform_native
            test: TestNativeForwardingPlatformInstalledLifecycle
          - role: join
            tag: join_platform_native
            test: TestNativeJoinPlatformInstalledLifecycle
          - role: descriptor
            tag: descriptor_platform_native
            test: TestNativeDescriptorPlatformInstalledLifecycle
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 80224dd171ddb4d098f9afc49e88bec1086f620b
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Verify exact Linux checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 80224dd171ddb4d098f9afc49e88bec1086f620b
          git show -s --format='candidate=%H tree=%T'
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          test "$(uname -m)" = x86_64
      - name: Run the maintained isolated unit-policy checks
        if: matrix.role == 'unit-policy'
        run: make platform-launch-unit
      - name: Verify genuine installed systemd lifecycle
        if: matrix.role != 'unit-policy'
        shell: bash
        env:
          NATIVE_TAG: ${{ matrix.tag }}
          NATIVE_TEST: ${{ matrix.test }}
        run: |
          set -euo pipefail
          test "$(systemctl --version | awk 'NR == 1 { print $2 }')" = 255
          test -r /sys/fs/cgroup/cgroup.controllers
          test "$(sudo -n id -u)" = 0
          native_dir=$(sudo -n mktemp -d /ardents-native-platform.XXXXXX)
          trap 'sudo -n rm -rf "$native_dir"' EXIT
          test "$(findmnt -T "$native_dir" -n -o FSTYPE)" = ext4
          test "$(findmnt -T /var/lib -n -o FSTYPE)" = ext4
          sudo -n env PATH="$PATH" TMPDIR="$native_dir" GOTOOLCHAIN=local GOENV=off GOFLAGS=-mod=readonly \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            sh -ec 'umask 022; exec go test -race -tags "$1" ./cmd/ardents-next -run "^$2$" -count=1 -v -timeout=7m' native "$NATIVE_TAG" "$NATIVE_TEST"
