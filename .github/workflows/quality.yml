name: quality
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-native-profile:
    strategy:
      fail-fast: false
      matrix:
        script: [run-native.sh, run-issuer-native.sh, run-descriptor-native.sh, run-introduction-native.sh, run-join-native.sh]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 54aba5ddc12e10e121874edcda7d36f178fae6f5
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Exercise the exact Node process profile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 54aba5ddc12e10e121874edcda7d36f178fae6f5
          git show -s --format='candidate=%H tree=%T'
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          case "$(systemctl show -p Version --value)" in 255.*) ;; *) exit 2 ;; esac
          test "$(findmnt -T /var/lib -n -o FSTYPE)" = ext4
          test -r /sys/fs/cgroup/cgroup.controllers
          native_dir=$(sudo -n mktemp -d /ardents-forwarding-e2e.XXXXXX)
          trap 'sudo -n rm -rf "$native_dir"' EXIT
          build_dir=$(mktemp -d "$RUNNER_TEMP/forwarding-build.XXXXXX")
          go build -trimpath -buildvcs=false -ldflags=-w -o "$build_dir/ardents" ./cmd/ardents-next
          go test -c -race -tags node_process_native -o "$build_dir/node-e2e.test" ./tests/e2e/node
          go test -c -race -tags node_process_native -o "$build_dir/node-command.test" ./cmd/ardents-next
          go test -c -race -tags node_process_native -o "$build_dir/node-owner.test" ./internal/node
          go test -c -race -tags node_process_native -o "$build_dir/node-resource.test" ./internal/processresource
          sudo -n install -m 0755 "$build_dir/ardents" "$build_dir/"*.test "$native_dir"
          digest() { result=$(sha256sum "$1"); printf '%s' "${result%% *}"; }
          sudo -n env TMPDIR="$native_dir" \
            ARDENTS_NODE_NATIVE_COMMAND="$native_dir/ardents" \
            ARDENTS_NODE_NATIVE_COMMAND_SHA256="$(digest "$build_dir/ardents")" \
            ARDENTS_NODE_NATIVE_TEST="$native_dir/node-command.test" \
            ARDENTS_NODE_NATIVE_TEST_SHA256="$(digest "$build_dir/node-command.test")" \
            ARDENTS_NODE_E2E_TEST="$native_dir/node-e2e.test" \
            ARDENTS_NODE_E2E_TEST_SHA256="$(digest "$build_dir/node-e2e.test")" \
            ARDENTS_NODE_OWNER_TEST="$native_dir/node-owner.test" \
            ARDENTS_NODE_OWNER_TEST_SHA256="$(digest "$build_dir/node-owner.test")" \
            ARDENTS_NODE_RESOURCE_TEST="$native_dir/node-resource.test" \
            ARDENTS_NODE_RESOURCE_TEST_SHA256="$(digest "$build_dir/node-resource.test")" \
            sh "scripts/node/${{ matrix.script }}" -timeout=3m
