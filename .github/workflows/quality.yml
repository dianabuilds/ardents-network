name: Endpoint Reader native verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact Reader candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: de47408e1d37d6244888f12f1c07077bcb95b800
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Exercise genuine cold and warm Reader
        shell: bash
        env:
          CANDIDATE: de47408e1d37d6244888f12f1c07077bcb95b800
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git show -s --format='candidate=%H tree=%T'
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          manager=$(systemctl show -p Version --value)
          case "$manager" in 255.*) ;; *) printf '%s\n' "$manager"; exit 2 ;; esac
          test "$(sudo -n id -u)" = 0
          test "$(findmnt -T /var/lib -n -o FSTYPE)" = ext4
          test -r /sys/fs/cgroup/cgroup.controllers
          sudo -n systemctl start polkit.service
          sudo -n systemctl is-active polkit.service
          if getent passwd ardents-endpoint >/dev/null; then
            exit 2
          fi
          probe_uid=
          for uid in $(seq 990 -1 100); do
            if ! getent passwd "$uid" >/dev/null && ! getent group "$uid" >/dev/null; then
              probe_uid=$uid
              break
            fi
          done
          test -n "$probe_uid"
          rule_parent=/usr/share/polkit-1/rules.d
          sudo -n namei -l "$rule_parent"
          test "$(sudo -n stat -c %u "$rule_parent")" = 0
          if ! sudo -n setpriv --reuid "$probe_uid" --regid "$probe_uid" --clear-groups test -x "$rule_parent"; then
            printf 'Endpoint fixture uid %s cannot traverse public rule directory\n' "$probe_uid"
            if command -v setfacl >/dev/null; then
              sudo -n setfacl -m "u:$probe_uid:--x" "$rule_parent"
            else
              sudo -n chmod o+x "$rule_parent"
            fi
          fi
          sudo -n setpriv --reuid "$probe_uid" --regid "$probe_uid" --clear-groups test -x "$rule_parent"
          read -r owner mode <<<"$(sudo -n stat -c '%u %a' "$rule_parent")"
          test "$owner" = 0
          (( (8#$mode & 022) == 0 ))
          native_dir=$(sudo -n mktemp -d /ardents-reader-native.XXXXXX)
          trap 'sudo -n rm -rf "$native_dir"' EXIT
          go_cache=$(go env GOCACHE)
          module_cache=$(go env GOMODCACHE)
          sudo -n env PATH="$PATH" GOTOOLCHAIN=local GOENV=off GOFLAGS=-mod=readonly \
            GOCACHE="$go_cache" GOMODCACHE="$module_cache" TMPDIR="$native_dir" \
            ARDENTS_LATENCY_REPO_ROOT="$PWD" \
            go test -tags endpoint_launch_native,text_worker_installed -v -count=1 -timeout=18m \
            ./cmd/ardents-next -run '^TestNativeEndpointColdWarmLatency$'
