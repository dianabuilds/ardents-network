name: quality
on: workflow_dispatch
permissions:
  contents: read
jobs:
  standalone-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANDIDATE: be52fbb2c44d77f765b54a5e7df98de4e6dded98
      CANDIDATE_TREE: 6a050f253ea08f7d4ef5f6dacf37bc28a4e62ff7
      GOCACHE: /tmp/ardents-network-quality/go-build
      GOMODCACHE: /tmp/ardents-network-quality/go-mod
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Install pinned quality tools
        run: make tools-install
      - name: Verify standalone make check on the same source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          time make check
