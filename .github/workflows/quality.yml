name: quality
on: workflow_dispatch
permissions:
  contents: read
jobs:
  source-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE: f2c81e845600b7a5a5498d2d74099b356bd8234e
      CANDIDATE_TREE: d097c5a5f69068936566c97e89d3d277f8d68b7c
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Verify original Source preparation and signing on ext4
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          git log -1 --format='Candidate %H tree %T'
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          test "$(uname -m)" = x86_64
          build_dir=$(mktemp -d "$RUNNER_TEMP/ardents-source-build.XXXXXX")
          native_dir=$(sudo -n mktemp -d /ardents-source-alias.XXXXXX)
          trap 'sudo -n rm -rf "$native_dir"; rm -rf "$build_dir"' EXIT
          test "$(findmnt -T "$native_dir" -n -o FSTYPE)" = ext4
          for parent in / "$native_dir"; do
            read -r uid mode <<<"$(sudo -n stat -c '%u %a' "$parent")"
            test "$uid" = 0
            (( (8#$mode & 022) == 0 ))
          done
          sudo -n chmod 0755 "$native_dir"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags=-w -o "$build_dir/ardents" ./cmd/ardents-next
          go test -race -trimpath -buildvcs=false -tags network_signing_native -c -o "$build_dir/preparation.test" ./cmd/ardents-next
          go test -race -trimpath -buildvcs=false -tags network_signing_native -c -o "$build_dir/release.test" ./internal/release/infrastructure/signing
          pin=$(sha256sum "$build_dir/ardents" | cut -d ' ' -f 1)
          sudo -n install -m 0555 "$build_dir/ardents" "$build_dir/preparation.test" "$build_dir/release.test" "$native_dir/"
          test "$(sudo -n sha256sum "$native_dir/ardents" | cut -d ' ' -f 1)" = "$pin"
          sudo -n env TMPDIR="$native_dir" ARDENTS_PREBUILT_NEXT="$native_dir/ardents" \
            "$native_dir/preparation.test" -test.run '^Test(NetworkSigning|SourcePreparationNative)' -test.count=1 -test.v -test.timeout=3m
          sudo -n env TMPDIR="$native_dir" \
            ARDENTS_INFRASTRUCTURE_RELEASE_PROGRAM="$native_dir/ardents" ARDENTS_INFRASTRUCTURE_RELEASE_PROGRAM_SHA256="$pin" \
            ARDENTS_SOURCE_NEXT_PROGRAM="$native_dir/ardents" ARDENTS_SOURCE_NEXT_PROGRAM_SHA256="$pin" \
            "$native_dir/release.test" -test.run '^TestSourcePreparationNativeInitialReleasePurposeAndKeyCustody$' -test.count=1 -test.v -test.timeout=3m
  platform-prestart:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE: f2c81e845600b7a5a5498d2d74099b356bd8234e
      CANDIDATE_TREE: d097c5a5f69068936566c97e89d3d277f8d68b7c
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Exercise Endpoint pre-start and generation staging
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          git log -1 --format='Candidate %H tree %T'
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          test "$(systemctl --version | awk 'NR == 1 {print $2}')" = 255
          test -r /sys/fs/cgroup/cgroup.controllers
          test "$(findmnt -T /var/lib -n -o FSTYPE)" = ext4
          native_dir=$(sudo -n mktemp -d /ardents-owner-platform.XXXXXX)
          trap 'sudo -n rm -rf "$native_dir"' EXIT
          test "$(findmnt -T "$native_dir" -n -o FSTYPE)" = ext4
          sudo -n env PATH="$PATH" TMPDIR="$native_dir" GOTOOLCHAIN=local GOENV=off GOFLAGS=-mod=readonly \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            go test -race -tags endpoint_platform_native ./cmd/ardents-next -run '^TestNativeEndpointPlatform(PrestartTrustTransfer|StagesGeneration)$' -count=1 -v -timeout=7m
