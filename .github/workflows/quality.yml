name: NET-32 exact native observation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            release: '22.04'
            systemd: 249
          - runner: ubuntu-24.04
            release: '24.04'
            systemd: 255
    env:
      CANDIDATE: 640cb433e6d3f87ed249b813540bd38a931693a9
      CANDIDATE_TREE: 9b2df31922ec2d384c18bf283d7f144490d38e23
      UBUNTU_RELEASE: ${{ matrix.release }}
      SYSTEMD_VERSION: ${{ matrix.systemd }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: false
      - name: Admit the native VM and prepare exact artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          git show -s --format='Candidate %H tree %T'
          . /etc/os-release
          test "$ID/$VERSION_ID" = "ubuntu/$UBUNTU_RELEASE"
          test "$(uname -m)" = x86_64
          test "$(cat /proc/1/comm)" = systemd
          test "$(systemctl --version | awk 'NR==1 {print $2}')" = "$SYSTEMD_VERSION"
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          test "$(findmnt -T /var/lib -n -o FSTYPE)" = ext4
          test "$(systemd-detect-virt --container)" = none
          test "$(sudo -n id -u)" = 0
          printf 'Ubuntu %s, %s, %s\n' "$VERSION_ID" "$(uname -m)" "$(systemctl --version | head -1)"
          go version
          if ! systemctl cat polkit.service >/dev/null 2>&1; then
            sudo -n apt-get -o Acquire::Retries=2 update -qq
            policy_package=polkitd
            if [ "$VERSION_ID" = 22.04 ]; then policy_package=policykit-1; fi
            sudo -n env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends "$policy_package"
          fi
          for directory in /usr/share /usr/share/polkit-1 /usr/share/polkit-1/rules.d; do
            test ! -L "$directory"
            test "$(stat -c '%u' "$directory")" = 0
            sudo -n chmod go-w "$directory"
          done
          sudo -n systemctl start polkit.service
          sudo -n busctl --system status org.freedesktop.systemd1 >/dev/null
          native_tmp=$(sudo -n mktemp -d /ardents-975-native.XXXXXX)
          printf 'NATIVE_TMPDIR=%s\n' "$native_tmp" >> "$GITHUB_ENV"
          out="$RUNNER_TEMP/ardents-975"
          install -d -m 0700 "$out"
          export CGO_ENABLED=0 GOTOOLCHAIN=local GOENV=off
          go test -c -tags endpoint_launch_native -trimpath -buildvcs=false -o "$out/resources.test" ./tests/e2e/endpoint
          go test -c -tags endpoint_launch_native -trimpath -buildvcs=false -o "$out/installed.test" ./tests/e2e/endpointinstalled
          go build -trimpath -buildvcs=false -o "$out/ardents-next" ./cmd/ardents-next
          (cd "$out"; sha256sum resources.test installed.test ardents-next | tee SHA256SUMS; sha256sum -c SHA256SUMS)
          printf 'NATIVE_GOCACHE=%s\nNATIVE_GOMODCACHE=%s\n' "$(go env GOCACHE)" "$(go env GOMODCACHE)" >> "$GITHUB_ENV"
      - name: Check Linux failure handling and independently compare native scope and units
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ardents-975"
          (cd tests/e2e/endpoint; "$out/resources.test" -test.v -test.run '^TestNET32' -test.count=1 -test.timeout=2m) | tee "$out/fixtures.log"
          (cd tests/e2e/endpoint; sudo -n "$out/resources.test" -test.v -test.run '^TestNativeNET32ResourceScopeAndUnits$' -test.count=1 -test.timeout=2m) | tee "$out/resources.log"
          grep -F -- '--- PASS: TestNativeNET32ResourceScopeAndUnits ' "$out/resources.log"
      - name: Measure the exact installed NET-32 idle component
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ardents-975"
          (cd tests/e2e/endpointinstalled; sudo -n env PATH="$PATH" GOENV=off GOTOOLCHAIN=local CGO_ENABLED=0 GOFLAGS=-buildvcs=false GOCACHE="$NATIVE_GOCACHE" GOMODCACHE="$NATIVE_GOMODCACHE" TMPDIR="$NATIVE_TMPDIR" ARDENTS_PREBUILT_NEXT="$out/ardents-next" "$out/installed.test" -test.v -test.run '^TestNativeEndpointPlatformLedIdle$' -test.count=1 -test.timeout=20m) | tee "$out/installed.log"
          grep -F -- '--- PASS: TestNativeEndpointPlatformLedIdle ' "$out/installed.log"
          (cd "$out"; sha256sum -c SHA256SUMS)
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Verify that native actors joined
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ! getent passwd ardents-endpoint
          if systemctl list-units --state=active,activating,deactivating,failed 'ardents-*' --no-legend --no-pager | grep -q ardents-; then
            systemctl list-units --state=active,activating,deactivating,failed 'ardents-*' --no-legend --no-pager
            exit 1
          fi
          if [ -n "${NATIVE_TMPDIR:-}" ]; then sudo -n rmdir -- "$NATIVE_TMPDIR"; fi
