name: Document worker Go tag equivalence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Linux tag selection and native descriptor admission
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b62ec5a5506217b5c4f59ca2dd6a7a79c33f0e86
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Compare the exact package and test source sets
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
          GOFLAGS: -mod=readonly
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b62ec5a5506217b5c4f59ca2dd6a7a79c33f0e86
          test "$(git rev-parse HEAD^)" = 4dc830d2141e8cb6cd536c75a99d34f8b3fa70a5
          git show -s --format='candidate=%H tree=%T'
          work=$(mktemp -d "$RUNNER_TEMP/document-selection.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          mkdir "$work/parent"
          git archive HEAD^ | tar -xf - -C "$work/parent"
          for lane in installed hostile escape; do
            (cd "$work/parent" && go list -deps -test -json -tags "text_worker_$lane" ./...) > "$work/old-$lane.json"
            go list -deps -test -json -tags "document_worker_$lane" ./... > "$work/new-$lane.json"
          done
          python3 - "$work" <<'PY'
          import json
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          fields = (
              "ImportPath", "ForTest", "Imports", "TestImports", "XTestImports",
              "GoFiles", "CgoFiles", "SFiles", "CFiles", "CXXFiles", "HFiles",
              "MFiles", "FFiles", "SysoFiles", "TestGoFiles", "XTestGoFiles",
              "EmbedFiles", "TestEmbedFiles", "XTestEmbedFiles",
          )

          def package_sources(path):
              raw = path.read_text()
              decoder = json.JSONDecoder()
              offset = 0
              packages = {}
              while raw[offset:].strip():
                  while raw[offset].isspace():
                      offset += 1
                  item, offset = decoder.raw_decode(raw, offset)
                  assert not item.get("Error") and not item.get("DepsErrors"), item.get("ImportPath")
                  key = item.get("ImportPath", ""), item.get("ForTest", "")
                  assert key not in packages, key
                  if item.get("Name") == "main" and key[0].endswith(".test") and not key[1]:
                      # Go emits the synthetic test driver's source in its build cache.
                      item["GoFiles"] = ["<generated-test-main>" if Path(name).is_absolute() else name
                                         for name in item.get("GoFiles", ())]
                  packages[key] = tuple(item.get(field) for field in fields)
              return packages

          for lane in ("installed", "hostile", "escape"):
              old = package_sources(work / f"old-{lane}.json")
              new = package_sources(work / f"new-{lane}.json")
              different = sorted(name for name in old.keys() | new.keys() if old.get(name) != new.get(name))
              assert not different, (lane, different)
              print(f"{lane}: identical source and import sets for {len(new)} resolve records")
          PY
      - name: Build the qualification variants
        shell: bash
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          build=$(mktemp -d "$RUNNER_TEMP/document-build.XXXXXX")
          make installed-tag-compile-check INSTALLED_TAG_COMPILE_ROOT="$build/installed"
          for lane in hostile escape; do
            go test -c -trimpath -buildvcs=false -tags "document_worker_$lane" -o "$build/$lane.test" ./internal/application/document
          done
          go test -c -trimpath -buildvcs=false -tags document_worker_installed -o "$build/descriptor-audit.test" ./internal/application/document
          echo "DOCUMENT_BUILD=$build" >> "$GITHUB_ENV"
      - name: Exercise native Document worker descriptor admission
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          test "$(uname -m)" = x86_64
          test "$(systemctl --version | awk 'NR == 1 { print $2 }')" = 255
          test -r /sys/fs/cgroup/cgroup.controllers
          suite='^TestVerifyWorkerDescriptors(ClosesManagerCgroupControl|RefusesForeignAuthority|IgnoresCloseOnExecForeign)$'
          discovered=$("$DOCUMENT_BUILD/descriptor-audit.test" -test.list="$suite" | grep '^TestVerifyWorkerDescriptors')
          test "$(printf '%s\n' "$discovered" | wc -l)" = 3
          sudo -n systemd-run --quiet --wait --pipe --collect --unit="ardents-document-descriptors-${GITHUB_RUN_ID}.service" \
            --property=CPUQuota=100% -- "$DOCUMENT_BUILD/descriptor-audit.test" "-test.run=$suite" -test.count=1 -test.v -test.timeout=2m
