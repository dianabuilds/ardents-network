name: Protected bundle source ownership verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Native ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [packaging]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 12884679cb4f20c016f4875e1371f52d4091c54a
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: matrix.profile == 'packaging'
        with:
          go-version: 1.27.4
          cache: true
      - name: Verify exact Linux checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 12884679cb4f20c016f4875e1371f52d4091c54a
          git show -s --format='candidate=%H tree=%T'
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          test "$(uname -m)" = x86_64
      - name: Exercise genuine protected bundle producer and checker
        if: matrix.profile == 'packaging'
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/protected-enrollment-binaries"
          make headless-build HEADLESS_ARTIFACT_ROOT="$artifacts"
          sh ./packaging/alpha-bundle/test.sh linux-amd64 "$artifacts/ardents-linux-amd64" "$artifacts/ardents-custody-linux-amd64"
          go test ./internal/enrollment -run '^TestPackagingConsumersPreserveArtifactAndProtectedInventory$' -count=1 -v
      - name: Query installed policy with original unprivileged subjects
        if: matrix.profile == 'stop-policy'
        shell: bash
        run: |
          set -euo pipefail
          command -v pkcheck
          test "$(systemctl --version | awk 'NR == 1 { print $2 }')" = 255
          if ! id ardents-endpoint >/dev/null 2>&1; then
            sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin ardents-endpoint
          fi
          rule=/usr/share/polkit-1/rules.d/50-ardents-text.rules
          test ! -e "$rule"
          trap 'sudo -n rm -f "$rule"' EXIT
          sudo -n install -o root -g root -m 0644 packaging/document-worker/50-ardents-text.rules "$rule"
          sudo -n systemctl restart polkit.service
          systemctl is-active polkit.service
          dpkg-query -W systemd polkitd libpolkit-agent-1-0 libpolkit-gobject-1-0 libduktape207 libglib2.0-0t64 libpam-systemd sgml-base xml-core
          uname -r
          systemctl --version
          sha256sum "$rule"
          sudo -n make text-worker-policy-check
