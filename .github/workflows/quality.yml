name: quality
on: workflow_dispatch
permissions:
  contents: read
env:
  CANDIDATE: f8e0ba0a1aacae009d0cedeaba8f28488c49296f
  CANDIDATE_TREE: 2051599d743931187b5c03eb092fe5dbbf819b86
jobs:
  linux-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Exercise the real command and its Publication owners
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          git log -1 --format='Candidate %H tree %T'
          go test -race ./internal/publication/durable ./internal/publication/instance -count=1 -timeout=3m
          go test -race ./cmd/ardents-next -run '^TestPublicationCompiled(RootPreparation|InstancePublicExchange)$' -count=1 -v -timeout=3m
  windows-public-history:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Exercise actual portable history preparation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:CANDIDATE) { throw 'candidate mismatch' }
          if ((git rev-parse 'HEAD^{tree}') -ne $env:CANDIDATE_TREE) { throw 'tree mismatch' }
          git log -1 --format='Candidate %H tree %T'
          $bin = Join-Path $env:RUNNER_TEMP 'ardents-publication.exe'
          $root = Join-Path $env:RUNNER_TEMP ('publication-' + [guid]::NewGuid())
          go build -trimpath -buildvcs=false -o $bin ./cmd/ardents-next
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          $actual = & $bin publication prepare-root $root ('01' * 32) ('02' * 32)
          if ($LASTEXITCODE -ne 0 -or $actual -ne '{"outcome":"publication-root-prepared","floor":0}') { throw "create: $actual" }
          Write-Output $actual
          $floor = Join-Path $root 'floor'
          [IO.File]::WriteAllText($floor, "18446744073709551615`n", [Text.Encoding]::ASCII)
          $actual = & $bin publication prepare-root $root ('01' * 32) ('02' * 32)
          if ($LASTEXITCODE -ne 0 -or $actual -ne '{"outcome":"publication-root-prepared","floor":18446744073709551615}') { throw "reopen: $actual" }
          Write-Output $actual
