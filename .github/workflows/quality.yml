name: Node native profile verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target: [node-process-check, node-issuer-check, node-descriptor-check, node-introduction-check, node-join-check]
    steps:
      - name: Check out exact Node CLI candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ac5d36ed41724de74385dfb0a4c7478b6af4c9fa
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Run registered native profile
        shell: bash
        env:
          NODE_PROFILE: ${{ matrix.target }}
          NODE_CANDIDATE: ac5d36ed41724de74385dfb0a4c7478b6af4c9fa
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NODE_CANDIDATE"
          git show -s --format='candidate=%H tree=%T'
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          manager=$(systemctl show -p Version --value)
          case "$manager" in 255.*) ;; *) printf '%s\n' "$manager"; exit 2 ;; esac
          printf '%s %s, systemd %s, CPU %s\n' "$ID" "$VERSION_ID" "$manager" "$(nproc)"
          awk '/^MemTotal:/ {print}' /proc/meminfo
          test "$(sudo -n id -u)" = 0
          test -r /sys/fs/cgroup/cgroup.controllers
          build_dir=$(mktemp -d "$RUNNER_TEMP/ardents-node-build.XXXXXX")
          native_dir=$(sudo -n mktemp -d /opt/ardents-node-native.XXXXXX)
          trap 'sudo -n rm -rf "$native_dir"; rm -rf "$build_dir"' EXIT
          test "$(findmnt -T "$native_dir" -n -o FSTYPE)" = ext4
          sudo -n chmod 0755 "$native_dir"
          sudo -n install -d -m 0755 "$native_dir/tmp"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags=-w -o "$build_dir/ardents" ./cmd/ardents-next
          go test -race -trimpath -buildvcs=false -tags node_process_native -c -o "$build_dir/node.test" ./cmd/ardents-next
          go test -race -trimpath -buildvcs=false -tags node_process_native -c -o "$build_dir/resource.test" ./internal/processresource
          ordinary_pin=$(sha256sum "$build_dir/ardents" | cut -d ' ' -f 1)
          command_test_pin=$(sha256sum "$build_dir/node.test" | cut -d ' ' -f 1)
          resource_test_pin=$(sha256sum "$build_dir/resource.test" | cut -d ' ' -f 1)
          printf 'command=%s\ncommand-test=%s\nresource-test=%s\n' "$ordinary_pin" "$command_test_pin" "$resource_test_pin"
          sudo -n install -m 0555 "$build_dir/ardents" "$build_dir/node.test" "$build_dir/resource.test" "$native_dir/"
          sudo -n env PATH="$PATH" TMPDIR="$native_dir/tmp" \
            ARDENTS_NODE_NATIVE_COMMAND="$native_dir/ardents" ARDENTS_NODE_NATIVE_COMMAND_SHA256="$ordinary_pin" \
            ARDENTS_NODE_NATIVE_TEST="$native_dir/node.test" ARDENTS_NODE_NATIVE_TEST_SHA256="$command_test_pin" \
            ARDENTS_NODE_RESOURCE_TEST="$native_dir/resource.test" ARDENTS_NODE_RESOURCE_TEST_SHA256="$resource_test_pin" \
            make "$NODE_PROFILE"
