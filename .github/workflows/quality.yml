name: quality
on: workflow_dispatch
permissions:
  contents: read
jobs:
  network-signing-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CANDIDATE: 80e115345e3fcb0b34e668eddf95a0236c6a7924
      CANDIDATE_TREE: a34790638c105d5584884b0073546d2981f94d9f
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Run the registered native Network signing profile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          test "$(uname -m)" = x86_64
          root=$(sudo -n mktemp -d /ardents-network-keys.XXXXXX)
          trap 'sudo -n rm -rf "$root"' EXIT
          test "$(findmnt -T "$root" -n -o FSTYPE)" = ext4
          sudo -n chmod 0755 "$root"
          sudo -n install -m 0700 -d "$root/private"
          sudo -n install -m 0755 -d "$root/public"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags=-w -o "$RUNNER_TEMP/ardents" ./cmd/ardents-next
          pin=$(sha256sum "$RUNNER_TEMP/ardents" | cut -d ' ' -f 1)
          sudo -n install -m 0555 "$RUNNER_TEMP/ardents" "$root/ardents"
          test "$(sudo -n sha256sum "$root/ardents" | cut -d ' ' -f 1)" = "$pin"
          sudo -n env PATH="$PATH" GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" GOTOOLCHAIN=local \
            TMPDIR="$root/private" ARDENTS_PREBUILT_NEXT="$root/ardents" \
            ARDENTS_INFRASTRUCTURE_PROVISION_PROGRAM="$root/ardents" ARDENTS_INFRASTRUCTURE_PROVISION_PROGRAM_SHA256="$pin" \
            ARDENTS_INFRASTRUCTURE_RELEASE_PROGRAM="$root/ardents" ARDENTS_INFRASTRUCTURE_RELEASE_PROGRAM_SHA256="$pin" \
            ARDENTS_SOURCE_STATE_FIXTURE_PARENT="$root/public" \
            sh -ec 'umask 077; exec make network-signing-check'
