name: quality
on: workflow_dispatch
permissions:
  contents: read
jobs:
  admission-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE: 66e2a991087b90e7449c02d9c53f238a27613576
      CANDIDATE_TREE: be007a573ecf5d50ea84db280d2f9b52adf1660c
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Run registered native profile on the exact candidate
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          git log -1 --format='Candidate %H tree %T'
          go version
          nproc
          free -h
          df -T .
          gcc --version | head -1
          go mod download
          make admission-check
