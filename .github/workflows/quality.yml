name: quality
on: workflow_dispatch
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CANDIDATE: e507a017f678899cd0465f56edf12aff2ff8a3ee
      CANDIDATE_TREE: 9ca6aedd463e19ead29938a32f2e465af0bb3301
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Run the original Source profile
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          git log -1 --format='Candidate %H tree %T'
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          manager=$(systemctl show -p Version --value)
          case "$manager" in 255.*) ;; *) printf '%s\n' "$manager"; exit 2 ;; esac
          test -r /sys/fs/cgroup/cgroup.controllers
          build_dir=$(mktemp -d "$RUNNER_TEMP/ardents-node-build.XXXXXX")
          node_dir=$(sudo -n mktemp -d /opt/ardents-node-native.XXXXXX)
          trap 'sudo -n rm -rf "$node_dir"; rm -rf "$build_dir"' EXIT
          test "$(findmnt -T "$node_dir" -n -o FSTYPE)" = ext4
          sudo -n chmod 0755 "$node_dir"
          sudo -n install -d -m 0755 "$node_dir/tmp"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags=-w -o "$build_dir/ardents" ./cmd/ardents-next
          go test -race -trimpath -buildvcs=false -tags node_process_native -c -o "$build_dir/node.test" ./cmd/ardents-next
          go test -race -trimpath -buildvcs=false -tags node_process_native -c -o "$build_dir/resource.test" ./internal/processresource
          ordinary_pin=$(sha256sum "$build_dir/ardents" | cut -d ' ' -f 1)
          command_test_pin=$(sha256sum "$build_dir/node.test" | cut -d ' ' -f 1)
          resource_test_pin=$(sha256sum "$build_dir/resource.test" | cut -d ' ' -f 1)
          printf 'command=%s\ncommand-test=%s\nresource-test=%s\n' "$ordinary_pin" "$command_test_pin" "$resource_test_pin"
          sudo -n install -m 0555 "$build_dir/ardents" "$build_dir/node.test" "$build_dir/resource.test" "$node_dir/"
          sudo -n env PATH="$PATH" TMPDIR="$node_dir/tmp" \
            ARDENTS_NODE_NATIVE_COMMAND="$node_dir/ardents" ARDENTS_NODE_NATIVE_COMMAND_SHA256="$ordinary_pin" \
            ARDENTS_NODE_NATIVE_TEST="$node_dir/node.test" ARDENTS_NODE_NATIVE_TEST_SHA256="$command_test_pin" \
            ARDENTS_NODE_RESOURCE_TEST="$node_dir/resource.test" ARDENTS_NODE_RESOURCE_TEST_SHA256="$resource_test_pin" \
            sh -ec 'umask 077; exec make source-process-check'
  endpoint-platform-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e507a017f678899cd0465f56edf12aff2ff8a3ee
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Verify exact Linux checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e507a017f678899cd0465f56edf12aff2ff8a3ee
          git show -s --format='candidate=%H tree=%T'
          test "$(git rev-parse 'HEAD^{tree}')" = 9ca6aedd463e19ead29938a32f2e465af0bb3301
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          test "$(uname -m)" = x86_64
      - name: Run Endpoint pre-start and generation staging
        shell: bash
        env:
          NATIVE_TAG: endpoint_platform_native
          NATIVE_TEST: TestNativeEndpointPlatform(PrestartTrustTransfer|StagesGeneration)
        run: |
          set -euo pipefail
          test "$(systemctl --version | awk 'NR == 1 { print $2 }')" = 255
          test -r /sys/fs/cgroup/cgroup.controllers
          test "$(sudo -n id -u)" = 0
          native_dir=$(sudo -n mktemp -d /ardents-native-platform.XXXXXX)
          trap 'sudo -n rm -rf "$native_dir"' EXIT
          test "$(findmnt -T "$native_dir" -n -o FSTYPE)" = ext4
          test "$(findmnt -T /var/lib -n -o FSTYPE)" = ext4
          sudo -n env PATH="$PATH" TMPDIR="$native_dir" GOTOOLCHAIN=local GOENV=off GOFLAGS=-mod=readonly \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            sh -ec 'umask 022; exec go test -race -tags "$1" ./cmd/ardents-next -run "^$2$" -count=1 -v -timeout=7m' native "$NATIVE_TAG" "$NATIVE_TEST"
