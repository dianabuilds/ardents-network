name: quality
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forwarding-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 3430cbf5a55d39ca800ebb256859732e57dcc78a
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Exercise the original Forwarding process through the e2e profile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3430cbf5a55d39ca800ebb256859732e57dcc78a
          git show -s --format='candidate=%H tree=%T'
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          case "$(systemctl show -p Version --value)" in 255.*) ;; *) exit 2 ;; esac
          test "$(findmnt -T /var/lib -n -o FSTYPE)" = ext4
          test -r /sys/fs/cgroup/cgroup.controllers
          native_dir=$(sudo -n mktemp -d /ardents-forwarding-e2e.XXXXXX)
          trap 'sudo -n rm -rf "$native_dir"' EXIT
          build_dir=$(mktemp -d "$RUNNER_TEMP/forwarding-build.XXXXXX")
          go build -trimpath -buildvcs=false -ldflags=-w -o "$build_dir/ardents" ./cmd/ardents-next
          go test -c -race -tags node_process_native -o "$build_dir/node-e2e.test" ./tests/e2e/node
          sudo -n install -m 0755 "$build_dir/ardents" "$build_dir/node-e2e.test" "$native_dir"
          command_digest=$(sha256sum "$build_dir/ardents")
          test_digest=$(sha256sum "$build_dir/node-e2e.test")
          sudo -n env TMPDIR="$native_dir" ARDENTS_NODE_NATIVE_COMMAND="$native_dir/ardents" \
            ARDENTS_NODE_NATIVE_COMMAND_SHA256="${command_digest%% *}" \
            NATIVE_E2E_DIGEST="${test_digest%% *}" bash -c '
              set -euo pipefail
              actual=$(sha256sum "$TMPDIR/node-e2e.test")
              test "${actual%% *}" = "$NATIVE_E2E_DIGEST"
              "$TMPDIR/node-e2e.test" -test.list="^TestNativeForwardingRetainedLifecycle$" | grep -Fx TestNativeForwardingRetainedLifecycle
              "$TMPDIR/node-e2e.test" -test.v -test.run="^TestNativeForwardingRetainedLifecycle$" -test.timeout=3m
            '
