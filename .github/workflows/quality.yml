name: Ardents 973 exact Ubuntu invocation evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Ubuntu 24.04 systemd, installed and held borrower
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: dc4f4f7f6d741dd4c499ec7a43e5d8404069f6b4
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: false
      - name: Admit original native host and artifacts
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          test "$(uname -m)" = x86_64
          test "$(cat /proc/1/comm)" = systemd
          test "$(systemd-detect-virt --container)" = none
          test "$(systemctl --version | awk 'NR==1 {print $2}')" = 255
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          test "$(findmnt -T /var/lib -n -o FSTYPE)" = ext4
          test "$(findmnt -T / -n -o FSTYPE)" = ext4
          test "$(sudo -n id -u)" = 0
          test -r /proc/pressure/cpu && test -r /proc/pressure/memory
          sudo -n busctl --system status org.freedesktop.systemd1 >/dev/null
          for account in ardents-node ardents-source; do
            if getent passwd "$account" >/dev/null; then exit 1; fi
          done
          native_dir=$(sudo -n mktemp -d /ardents-973-native.XXXXXX)
          printf 'NATIVE_TMPDIR=%s\n' "$native_dir" >> "$GITHUB_ENV"
          printf 'Host: %s %s, arch=%s, virtualization=%s, %s, kernel=%s\n' \
            "$ID" "$VERSION_ID" "$(uname -m)" "$(systemd-detect-virt)" "$(systemctl --version | head -1)" "$(uname -r)"
      - name: Build artifacts from exact source
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOENV: off
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = dc4f4f7f6d741dd4c499ec7a43e5d8404069f6b4
          test "$(git rev-parse HEAD^{tree})" = ba11e6966a89ebd871ad4f57076f93dec0c9549c
          git show -s --format='Candidate %H tree %T'
          go version
          out="$RUNNER_TEMP/artifacts973"
          mkdir -m 0700 "$out"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags=-w -o "$out/ardents-next" ./cmd/ardents-next
          CGO_ENABLED=0 go test -c -buildvcs=false -tags source_installed_native,forwarding_platform_native,join_platform_native,descriptor_platform_native -o "$out/installed.test" ./tests/e2e/nodeinstalled
          CGO_ENABLED=1 go test -c -race -buildvcs=false -tags node_process_native -o "$out/owner.test" ./internal/domain/node/runtime
          CGO_ENABLED=1 go test -c -race -buildvcs=false -tags node_process_native -o "$out/process.test" ./tests/e2e/node
          (cd "$out"; sha256sum ardents-next installed.test owner.test process.test > SHA256SUMS; cat SHA256SUMS; sha256sum -c SHA256SUMS)
          printf 'NATIVE_GOCACHE=%s\nNATIVE_GOMODCACHE=%s\n' "$(go env GOCACHE)" "$(go env GOMODCACHE)" >> "$GITHUB_ENV"
      - name: Run exact native cases serially
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/artifacts973"
          root="$PWD"
          results="$out/results.tsv"
          digest=$(awk '$2 == "ardents-next" {print $1}' "$out/SHA256SUMS")
          run() {
            local suite="$1" binary="$2" name="$3" timeout="$4" result=PASS code=0
            local log="$out/$name.log"
            local -a environment=(PATH="$PATH" GOENV=off GOTOOLCHAIN=local CGO_ENABLED=0 GOFLAGS=-buildvcs=false
              GOCACHE="$NATIVE_GOCACHE" GOMODCACHE="$NATIVE_GOMODCACHE" TMPDIR="$NATIVE_TMPDIR"
              ARDENTS_PREBUILT_NEXT="$out/ardents-next" ARDENTS_NODE_NATIVE_COMMAND="$out/ardents-next" ARDENTS_NODE_NATIVE_COMMAND_SHA256="$digest")
            if ! (cd "$root/$suite"; sudo -n env "${environment[@]}" "$out/$binary" -test.list "^$name$") |
              grep -Fx "$name" >/dev/null; then
              printf 'INVALID\t%s\tmissing test discovery\n' "$name" | tee -a "$results"
              return
            fi
            (cd "$root/$suite"; sudo -n env "${environment[@]}" "$out/$binary" -test.v "-test.run=^$name$" "-test.timeout=$timeout") >"$log" 2>&1 || code=$?
            if [ "$code" -ne 0 ] || ! grep -Fq -- "--- PASS: $name (" "$log" || grep -Fq -- '--- SKIP:' "$log"; then
              result=FAIL
            fi
            local observed
            observed=$(grep -F -m1 -- "--- $result: $name (" "$log" || true)
            printf '%s\t%s\t%s\n' "$result" "$name" "${observed:-exit=$code}" | tee -a "$results"
            if [ "$result" != PASS ]; then
              tail -65 "$log"
            fi
          }
          run tests/e2e/nodeinstalled installed.test TestInstalledInvocationRequiresOriginalCompleteTerminal 1m
          run tests/e2e/nodeinstalled installed.test TestNativeSourceInstalledLifecycle 10m
          run tests/e2e/nodeinstalled installed.test TestNativeForwardingPlatformInstalledLifecycle 10m
          run tests/e2e/nodeinstalled installed.test TestNativeJoinPlatformInstalledLifecycle 10m
          run tests/e2e/nodeinstalled installed.test TestNativeDescriptorPlatformInstalledLifecycle 10m
          run internal/domain/node/runtime owner.test TestNativeDescriptorOriginalAuthorityAndJoinTCP 3m
          run tests/e2e/node process.test TestNativeJoinDuplexAndReopenTCP 3m
          (cd "$out"; sha256sum -c SHA256SUMS)
          test "$(git rev-parse HEAD)" = dc4f4f7f6d741dd4c499ec7a43e5d8404069f6b4
          test -z "$(git status --porcelain --untracked-files=no)"
          echo '## Native invocation evidence' >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$results" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          test "$(wc -l < "$results")" -eq 7
          test "$(grep -c '^PASS' "$results")" -eq 7
      - name: Confirm original native resources joined
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for account in ardents-node ardents-source; do
            if getent passwd "$account" >/dev/null; then printf 'Residual account: %s\n' "$account"; exit 1; fi
          done
          if systemctl list-units --state=active,activating,deactivating,failed 'ardents-*' --no-legend --no-pager | grep -q ardents-; then
            systemctl list-units --state=active,activating,deactivating,failed 'ardents-*' --no-legend --no-pager
            exit 1
          fi
          if [ -n "${NATIVE_TMPDIR:-}" ]; then sudo -n rmdir -- "$NATIVE_TMPDIR"; fi
          echo 'No residual Ardents accounts or active/failed units observed.'
