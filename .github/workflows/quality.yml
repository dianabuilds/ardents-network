name: Endpoint v5 to v6 and delivery proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 48cdbb58ccf4395638cecf7c5ed26d3a372ecba4
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 32fd2b8b9b81dc369a47c8fdd6bf0f59ce8b9168
          path: predecessor
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
          cache-dependency-path: candidate/go.sum
      - name: Build the exact enrolled predecessor and successor consumers
        working-directory: candidate
        shell: bash
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 48cdbb58ccf4395638cecf7c5ed26d3a372ecba4
          test "$(git -C ../predecessor rev-parse HEAD)" = 32fd2b8b9b81dc369a47c8fdd6bf0f59ce8b9168
          git show -s --format='candidate=%H tree=%T'
          mkdir -m 0700 "$RUNNER_TEMP/v5-artifacts"
          (cd ../predecessor
            go build -trimpath -buildvcs=false -ldflags=-w -o "$RUNNER_TEMP/v5-artifacts/ardents-linux-amd64" ./cmd/ardents-next
            go build -trimpath -buildvcs=false -ldflags=-w -o "$RUNNER_TEMP/v5-artifacts/ardents-custody-linux-amd64" ./cmd/ardents-custody)
          sha256sum "$RUNNER_TEMP/v5-artifacts/"*
          go build -trimpath -buildvcs=false -ldflags=-w -o "$RUNNER_TEMP/ardents-v6" ./cmd/ardents-next
          go test -c -tags endpoint_launch_native,endpoint_enrollment_migration_native -o "$RUNNER_TEMP/v6-migration.test" ./cmd/ardents-next
      - name: Exercise the native installed predecessor transition
        working-directory: candidate
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          test "$(uname -m)" = x86_64
          test "$(systemctl --version | awk 'NR == 1 { print $2 }')" = 255
          test -r /sys/fs/cgroup/cgroup.controllers
          test "$(findmnt -T /var/lib -n -o FSTYPE)" = ext4
          ! getent passwd ardents-endpoint
          for directory in /usr/share /usr/share/polkit-1 /usr/share/polkit-1/rules.d; do
            test ! -L "$directory"
            test "$(stat -c '%u' "$directory")" = 0
            sudo -n chmod go-w "$directory"
          done
          sudo -n systemctl start polkit.service
          native_dir=$(sudo -n mktemp -d /ardents-v6-native.XXXXXX)
          trap 'sudo -n rmdir "$native_dir"' EXIT
          cd cmd/ardents-next
          sudo -n env PATH="$PATH" GOTOOLCHAIN=local CGO_ENABLED=0 GOENV=off \
            GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" TMPDIR="$native_dir" \
            ARDENTS_PREBUILT_NEXT="$RUNNER_TEMP/ardents-v6" ARDENTS_ENROLLMENT_V5_ARTIFACTS="$RUNNER_TEMP/v5-artifacts" \
            "$RUNNER_TEMP/v6-migration.test" -test.run '^TestNativeEndpointEnrollmentV5ToV6$' -test.timeout=6m -test.v
      - name: Validate the released archive, offline process and Debian package
        working-directory: candidate
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          make headless-check
          sudo -n env PATH="$PATH" GOTOOLCHAIN=local GOENV=off \
            GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" \
            go test -tags packagee2e ./tests/e2e/endpoint -run '^TestUbuntuDebInstallsOnlyProgramAndStaticEnrollmentBytes$' -count=1 -v
