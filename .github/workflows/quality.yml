name: Ardents 1011 retained State installed verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Isolated Ubuntu 24.04 VM, exact installed scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: d78871340b23eece17534802d64c7763481b4f5f
          path: candidate
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: false
      - name: Admit and provision the disposable VM
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          test "$(uname -m)" = x86_64
          test "$(cat /proc/1/comm)" = systemd
          test "$(systemd-detect-virt --container)" = none
          test "$(systemctl --version | awk 'NR==1 {print $2}')" = 255
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          test "$(findmnt -T /var/lib -n -o FSTYPE)" = ext4
          test "$(findmnt -T / -n -o FSTYPE)" = ext4
          test "$(sudo -n id -u)" = 0
          printf 'Host: %s %s, arch=%s, virtualization=%s, %s, kernel=%s\n' \
            "$ID" "$VERSION_ID" "$(uname -m)" "$(systemd-detect-virt)" "$(systemctl --version | head -1)" "$(uname -r)"
          for account in ardents-node ardents-source ardents-endpoint; do
            if getent passwd "$account" >/dev/null; then exit 1; fi
          done
          sudo -n apt-get -o Acquire::Retries=2 update -qq
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends systemd-container debootstrap
          for directory in /usr/share /usr/share/polkit-1 /usr/share/polkit-1/rules.d; do
            test ! -L "$directory"
            test "$(stat -c '%u' "$directory")" = 0
            sudo -n chmod go-w "$directory"
          done
          sudo -n systemctl start polkit.service systemd-machined.service
          sudo -n busctl --system status org.freedesktop.systemd1 >/dev/null
          native_dir=$(sudo -n mktemp -d /ardents-1011-native.XXXXXX)
          printf 'NATIVE_TMPDIR=%s\n' "$native_dir" >> "$GITHUB_ENV"
      - name: Build pinned test and fixture inputs
        shell: bash
        working-directory: candidate
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
          GOENV: off
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d78871340b23eece17534802d64c7763481b4f5f
          test "$(git rev-parse HEAD^{tree})" = 57ab64d1f1732659181c62a10eaa64366c508fad
          git show -s --format='Candidate %H tree %T'
          go version
          mkdir -m 0700 "$RUNNER_TEMP/artifacts1011"
          out="$RUNNER_TEMP/artifacts1011"
          go build -trimpath -buildvcs=false -ldflags=-w -o "$out/ardents-next" ./cmd/ardents-next
          go test -c -buildvcs=false -tags source_installed_native,forwarding_platform_native,join_platform_native,descriptor_platform_native -o "$out/node.test" ./tests/e2e/nodeinstalled
          go test -c -buildvcs=false -tags endpoint_launch_native,endpoint_pair_native,document_worker_installed -o "$out/endpoint.test" ./tests/e2e/endpointinstalled
          go test -c -buildvcs=false -tags endpoint_pair_native,document_worker_installed -o "$out/journey.test" ./internal/domain/endpoint
          CGO_ENABLED=1 go test -c -race -buildvcs=false -tags network_signing_native -o "$out/state-inspection.test" ./internal/domain/network/state
          (cd "$out"; sha256sum ardents-next node.test endpoint.test journey.test state-inspection.test > SHA256SUMS; cat SHA256SUMS; sha256sum -c SHA256SUMS)
          printf 'NATIVE_GOCACHE=%s\nNATIVE_GOMODCACHE=%s\n' "$(go env GOCACHE)" "$(go env GOMODCACHE)" >> "$GITHUB_ENV"
      - name: Run nine installed and inspection checks serially
        shell: bash
        working-directory: candidate
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
          GOENV: off
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/artifacts1011"
          root="$PWD"
          results="$out/results.tsv"
          run() {
            local suite="$1" binary="$2" name="$3" timeout="$4" result=PASS code=0
            local log="$out/$name.log"
            local -a environment=(PATH="$PATH" GOENV=off GOTOOLCHAIN=local CGO_ENABLED=0 GOFLAGS=-buildvcs=false
              GOCACHE="$NATIVE_GOCACHE" GOMODCACHE="$NATIVE_GOMODCACHE" TMPDIR="$NATIVE_TMPDIR"
              ARDENTS_PREBUILT_NEXT="$out/ardents-next")
            if ! (cd "$root/$suite"; sudo -n env "${environment[@]}" "$out/$binary" -test.list "^$name$") |
              grep -Fx "$name" >/dev/null; then
              printf 'INVALID\t%s\tmissing test discovery\n' "$name" | tee -a "$results"
              return
            fi
            (cd "$root/$suite"; sudo -n env "${environment[@]}" "$out/$binary" -test.v "-test.run=^$name$" "-test.timeout=$timeout") >"$log" 2>&1 || code=$?
            if [ "$code" -ne 0 ] || ! grep -Fq -- "--- PASS: $name (" "$log" || grep -Fq -- '--- SKIP:' "$log"; then
              result=FAIL
            fi
            local observed
            observed=$(grep -F -m1 -- "--- $result: $name (" "$log" || true)
            printf '%s\t%s\t%s\n' "$result" "$name" "${observed:-exit=$code}" | tee -a "$results"
            if [ "$result" != PASS ]; then
              tail -45 "$log"
            fi
          }
          run internal/domain/network/state state-inspection.test TestSourceInspectionNativeStaleMirrorRefusesWithoutRepair 3m
          run tests/e2e/nodeinstalled node.test TestNativeSourceInstalledLifecycle 10m
          run tests/e2e/nodeinstalled node.test TestNativeForwardingPlatformInstalledLifecycle 10m
          run tests/e2e/nodeinstalled node.test TestNativeJoinPlatformInstalledLifecycle 10m
          run tests/e2e/nodeinstalled node.test TestNativeDescriptorPlatformInstalledLifecycle 10m
          run tests/e2e/endpointinstalled endpoint.test TestNativeEndpointPlatformLedLaunch 10m
          run tests/e2e/endpointinstalled endpoint.test TestNativeEndpointPlatformLedLaunchRefusals 10m
          run tests/e2e/endpointinstalled endpoint.test TestNativeEndpointPlatformLedPair 25m
          run internal/domain/endpoint journey.test TestNativeEndpointPlatformLedJourney 25m
          (cd "$out"; sha256sum -c SHA256SUMS)
          test "$(git rev-parse HEAD)" = d78871340b23eece17534802d64c7763481b4f5f
          test -z "$(git status --porcelain --untracked-files=no)"
          echo '## Exact installed outcomes' >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$results" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          test "$(wc -l < "$results")" -eq 9
          test "$(grep -c '^PASS' "$results")" -eq 9
      - name: Confirm installed actors joined before VM disposal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for account in ardents-node ardents-source ardents-endpoint; do
            if getent passwd "$account" >/dev/null; then printf 'Residual account: %s\n' "$account"; exit 1; fi
          done
          if systemctl list-units --state=active,activating,deactivating,failed 'ardents-*' --no-legend --no-pager | grep -q ardents-; then
            systemctl list-units --state=active,activating,deactivating,failed 'ardents-*' --no-legend --no-pager
            exit 1
          fi
          machinectl list --no-legend --no-pager | awk '$1 ~ /^ardpair/ {print; found=1} END {exit found ? 1 : 0}'
          if [ -n "${NATIVE_TMPDIR:-}" ]; then sudo -n rmdir -- "$NATIVE_TMPDIR"; fi
          echo 'No residual Ardents accounts, active/failed units or guest managers observed.'
