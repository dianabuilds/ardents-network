name: quality
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network-artifacts-and-intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 1c49ec9484d47055fc094135512459c49377d0c1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1c49ec9484d47055fc094135512459c49377d0c1
          test "$(findmnt -T / -n -o FSTYPE)" = ext4
          build_dir=$(mktemp -d "$RUNNER_TEMP/network-build.XXXXXX")
          native_dir=$(sudo -n mktemp -d /ardents-network-e2e.XXXXXX)
          trap 'sudo -n rm -rf "$native_dir"' EXIT
          go build -trimpath -buildvcs=false -ldflags=-w -o "$build_dir/ardents" ./cmd/ardents-next
          go test -c -race -tags network_preparation_native,network_signing_native -o "$build_dir/network-command.test" ./cmd/ardents-next
          go test -c -race -tags network_signing_native -o "$build_dir/network-e2e.test" ./tests/e2e/node
          go test -c -race -o "$build_dir/output.test" ./internal/platform/artifacts
          sudo -n install -m 0755 "$build_dir/ardents" "$build_dir/"*.test "$native_dir"
          sudo -n env TMPDIR="$native_dir" ARDENTS_PREBUILT_NEXT="$native_dir/ardents" "$native_dir/network-command.test" -test.v -test.run='^TestNetwork(Preparation|Signing)' -test.timeout=5m
          sudo -n env TMPDIR="$native_dir" ARDENTS_PREBUILT_NEXT="$native_dir/ardents" "$native_dir/network-e2e.test" -test.v -test.run='^TestNetwork(CommandsAndAdmissionUseAuthenticatedRoots|InspectDoesNotInitializeMissingHistory|SigningNodeCertificateCommand)$' -test.timeout=3m
          sudo -n env TMPDIR="$native_dir" "$native_dir/output.test" -test.v -test.run='^TestWriteReportJoinsCanceledFullPipe$' -test.timeout=3m
