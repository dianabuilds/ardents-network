name: quality
on: workflow_dispatch
permissions:
  contents: read
jobs:
  race-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1]
    env:
      CANDIDATE: 7785d5a6b67f63e963f322ec3a42aeddd8532366
      CANDIDATE_TREE: 4331fd09821cb113abd0d7bc44682aee65d09454
      SHARD: ${{ matrix.index }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Measure one strictly serial race shard on its own runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test "$(id -u)" -ne 0
          awk 'NF {print $1}' tests/profiles/deterministic-packages.txt tests/profiles/deterministic-linux-packages.txt > "$RUNNER_TEMP/inventory"
          test "$(sort "$RUNNER_TEMP/inventory" | uniq -d | wc -l)" -eq 0
          total=$(wc -l < "$RUNNER_TEMP/inventory")
          half=$(( (total + 1) / 2 ))
          awk -v half="$half" -v root="$RUNNER_TEMP" '{ print >> (root "/shard-" (NR > half ? 1 : 0)) }' "$RUNNER_TEMP/inventory"
          cat "$RUNNER_TEMP/shard-0" "$RUNNER_TEMP/shard-1" | cmp - "$RUNNER_TEMP/inventory"
          mapfile -t packages < "$RUNNER_TEMP/shard-$SHARD"
          test "${#packages[@]}" -gt 0
          export GOENV=off GOTOOLCHAIN=local GOFLAGS=-mod=readonly
          export GOCACHE=/tmp/ardents-network-quality/go-build GOMODCACHE=/tmp/ardents-network-quality/go-mod
          printf 'shard=%s packages=%s at=%s\n' "$SHARD" "${#packages[@]}" "$(date -u +%FT%TZ)"
          umask 077
          time go test -p 1 "${packages[@]}" -short -race -shuffle=on -count=1 -timeout=15m
