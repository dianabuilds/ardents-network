name: Shared Linux directory custody verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [network-preparation-check, network-signing-check, source-process-check]
    steps:
      - name: Check out exact directory custody candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bb6bdd45a08e5bc628ead0012f34f88b9baf447b
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Run registered native profile
        shell: bash
        env:
          CANDIDATE: bb6bdd45a08e5bc628ead0012f34f88b9baf447b
          PROFILE: ${{ matrix.profile }}
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git show -s --format='candidate=%H tree=%T'
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          test "$(uname -m)" = x86_64
          if [[ "$PROFILE" == network-preparation-check ]]; then
            test "$(id -u)" != 0
            native_dir=$(mktemp -d "$RUNNER_TEMP/ardents-unsigned-native.XXXXXX")
            trap 'rm -rf "$native_dir"' EXIT
            test "$(findmnt -T "$native_dir" -n -o FSTYPE)" = ext4
            test "$(stat -c '%u:%a' "$native_dir")" = "$(id -u):700"
            TMPDIR="$native_dir" make "$PROFILE"
            go test -race ./internal/platform/artifacts -run '^TestDirectoryChainPreservesOriginalPathAndAccessPolicy$' -count=1 -v
          elif [[ "$PROFILE" == source-process-check ]]; then
            systemctl --version | head -1
            test "$(systemctl --version | awk 'NR == 1 {print $2}')" = 255
            test -r /sys/fs/cgroup/cgroup.controllers
            native_dir=$(sudo -n mktemp -d /ardents-source-custody.XXXXXX)
            build_dir=$(mktemp -d "$RUNNER_TEMP/ardents-source-build.XXXXXX")
            trap 'sudo -n rm -rf "$native_dir"; rm -rf "$build_dir"' EXIT
            test "$(findmnt -T "$native_dir" -n -o FSTYPE)" = ext4
            CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags=-w -o "$build_dir/ardents" ./cmd/ardents-next
            go test -c -race -trimpath -buildvcs=false -tags node_process_native -o "$build_dir/source-command.test" ./cmd/ardents-next
            go test -c -race -trimpath -buildvcs=false -tags node_process_native -o "$build_dir/source-resource.test" ./internal/processresource
            program_pin=$(sha256sum "$build_dir/ardents" | cut -d ' ' -f 1)
            command_pin=$(sha256sum "$build_dir/source-command.test" | cut -d ' ' -f 1)
            resource_pin=$(sha256sum "$build_dir/source-resource.test" | cut -d ' ' -f 1)
            sudo -n install -m 0555 "$build_dir/ardents" "$build_dir/source-command.test" "$build_dir/source-resource.test" "$native_dir/"
            sudo -n env PATH="$PATH" TMPDIR="$native_dir" \
              ARDENTS_NODE_NATIVE_COMMAND="$native_dir/ardents" ARDENTS_NODE_NATIVE_COMMAND_SHA256="$program_pin" \
              ARDENTS_NODE_NATIVE_TEST="$native_dir/source-command.test" ARDENTS_NODE_NATIVE_TEST_SHA256="$command_pin" \
              ARDENTS_NODE_RESOURCE_TEST="$native_dir/source-resource.test" ARDENTS_NODE_RESOURCE_TEST_SHA256="$resource_pin" \
              flock "$native_dir/source-development.lock" sh -ec 'umask 077; exec make source-process-check'
          else
            test "$PROFILE" = network-signing-check
            test "$(sudo -n id -u)" = 0
            native_dir=$(sudo -n mktemp -d /ardents-root-native.XXXXXX)
            trap 'sudo -n rm -rf "$native_dir"' EXIT
            test "$(findmnt -T "$native_dir" -n -o FSTYPE)" = ext4
            for directory in / "$native_dir"; do
              read -r owner mode <<<"$(sudo -n stat -c '%u %a' "$directory")"
              test "$owner" = 0
              (( (8#$mode & 022) == 0 ))
            done
            build_dir=$(mktemp -d "$RUNNER_TEMP/ardents-signing-build.XXXXXX")
            trap 'sudo -n rm -rf "$native_dir"; rm -rf "$build_dir"' EXIT
            CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags=-w -o "$build_dir/ardents" ./cmd/ardents-next
            pin=$(sha256sum "$build_dir/ardents" | cut -d ' ' -f 1)
            sudo -n install -m 0555 "$build_dir/ardents" "$native_dir/ardents"
            printf '%s  %s\n' "$pin" "$native_dir/ardents" | sudo -n sha256sum -c
            real_go=$(command -v go)
            sudo -n install -d -m 0700 "$native_dir/tools"
            sudo -n tee "$native_dir/tools/go" >/dev/null <<'SHIM'
          #!/bin/sh
          set -eu
          for arg in "$@"; do
              if [ "$arg" = '^TestSourceInspectionNative' ]; then
                  umask 077
                  break
              fi
          done
          exec "$ARDENTS_NATIVE_GO" "$@"
          SHIM
            sudo -n chmod 0500 "$native_dir/tools/go"
            sudo -n env PATH="$native_dir/tools:$PATH" ARDENTS_NATIVE_GO="$real_go" \
              GOTOOLCHAIN=local GOENV=off GOFLAGS=-mod=readonly TMPDIR="$native_dir" \
              ARDENTS_INFRASTRUCTURE_PROVISION_PROGRAM="$native_dir/ardents" ARDENTS_INFRASTRUCTURE_PROVISION_PROGRAM_SHA256="$pin" \
              ARDENTS_INFRASTRUCTURE_RELEASE_PROGRAM="$native_dir/ardents" ARDENTS_INFRASTRUCTURE_RELEASE_PROGRAM_SHA256="$pin" \
              GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" \
              sh -ec 'umask 022; exec make "$1"' native "$PROFILE"
          fi
