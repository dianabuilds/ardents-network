name: Network artifact native verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [network-preparation-check, network-signing-check]
    steps:
      - name: Check out exact publication candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a7ed09f87775a625c5c79f36013401ff6e513bab
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Run registered native profile
        shell: bash
        env:
          CANDIDATE: a7ed09f87775a625c5c79f36013401ff6e513bab
          PROFILE: ${{ matrix.profile }}
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git show -s --format='candidate=%H tree=%T'
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          test "$(uname -m)" = x86_64
          if [[ "$PROFILE" == network-preparation-check ]]; then
            test "$(id -u)" != 0
            native_dir=$(mktemp -d "$RUNNER_TEMP/ardents-unsigned-native.XXXXXX")
            trap 'rm -rf "$native_dir"' EXIT
            test "$(findmnt -T "$native_dir" -n -o FSTYPE)" = ext4
            test "$(stat -c '%u:%a' "$native_dir")" = "$(id -u):700"
            TMPDIR="$native_dir" make "$PROFILE"
          else
            test "$PROFILE" = network-signing-check
            test "$(sudo -n id -u)" = 0
            native_dir=$(sudo -n mktemp -d /ardents-root-native.XXXXXX)
            trap 'sudo -n rm -rf "$native_dir"' EXIT
            test "$(findmnt -T "$native_dir" -n -o FSTYPE)" = ext4
            for directory in / "$native_dir"; do
              read -r owner mode <<<"$(sudo -n stat -c '%u %a' "$directory")"
              test "$owner" = 0
              (( (8#$mode & 022) == 0 ))
            done
            sudo -n env PATH="$PATH" GOTOOLCHAIN=local GOENV=off GOFLAGS=-mod=readonly \
              TMPDIR="$native_dir" GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" \
              make "$PROFILE"
          fi
