name: quality
on: workflow_dispatch
permissions:
  contents: read
jobs:
  hosting-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE: 312e4a1e22bcb9da00a033ec3aa969e577d64d40
      CANDIDATE_TREE: fc55efa698d82485877bfca6012fcba34b758648
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Run registered native profile on the exact candidate
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          git log -1 --format='Candidate %H tree %T'
          go version
          nproc
          free -h
          df -T .
          gcc --version | head -1
          go mod download
          make hosting-check
