name: Endpoint Reader native verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact Reader candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: dd79f2dcb2ad6a7f8441b3b44e33c413b7c6acab
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Exercise genuine cold and warm Reader
        shell: bash
        env:
          CANDIDATE: dd79f2dcb2ad6a7f8441b3b44e33c413b7c6acab
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git show -s --format='candidate=%H tree=%T'
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          manager=$(systemctl show -p Version --value)
          case "$manager" in 255.*) ;; *) printf '%s\n' "$manager"; exit 2 ;; esac
          test "$(sudo -n id -u)" = 0
          test "$(findmnt -T /var/lib -n -o FSTYPE)" = ext4
          test -r /sys/fs/cgroup/cgroup.controllers
          if getent passwd ardents-endpoint >/dev/null; then
            exit 2
          fi
          rule_parent=/usr/share/polkit-1/rules.d
          sudo -n namei -l "$rule_parent"
          for directory in /usr/share /usr/share/polkit-1 "$rule_parent"; do
            test "$(sudo -n stat -c %u "$directory")" = 0
            test ! -L "$directory"
            sudo -n chmod go-w "$directory"
            mode=$(sudo -n stat -c %a "$directory")
            (( (8#$mode & 022) == 0 ))
          done
          sudo -n namei -l "$rule_parent"
          sudo -n systemctl start polkit.service
          sudo -n systemctl is-active polkit.service
          native_dir=$(sudo -n mktemp -d /ardents-reader-native.XXXXXX)
          trap 'sudo -n rm -rf "$native_dir"' EXIT
          go_cache=$(go env GOCACHE)
          module_cache=$(go env GOMODCACHE)
          sudo -n env PATH="$PATH" GOTOOLCHAIN=local GOENV=off GOFLAGS=-mod=readonly \
            GOCACHE="$go_cache" GOMODCACHE="$module_cache" TMPDIR="$native_dir" \
            ARDENTS_LATENCY_REPO_ROOT="$PWD" \
            go test -tags endpoint_launch_native,text_worker_installed -v -count=1 -timeout=18m \
            ./cmd/ardents-next -run '^TestNativeEndpointColdWarmLatency$'
