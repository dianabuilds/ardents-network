name: Network artifact native verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [network-signing-check]
    steps:
      - name: Check out exact publication candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 68012152c875bbfbd249d881537037e91d069374
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Run registered native profile
        shell: bash
        env:
          CANDIDATE: 68012152c875bbfbd249d881537037e91d069374
          PROFILE: ${{ matrix.profile }}
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git show -s --format='candidate=%H tree=%T'
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          test "$(uname -m)" = x86_64
          if [[ "$PROFILE" == network-preparation-check ]]; then
            test "$(id -u)" != 0
            native_dir=$(mktemp -d "$RUNNER_TEMP/ardents-unsigned-native.XXXXXX")
            trap 'rm -rf "$native_dir"' EXIT
            test "$(findmnt -T "$native_dir" -n -o FSTYPE)" = ext4
            test "$(stat -c '%u:%a' "$native_dir")" = "$(id -u):700"
            TMPDIR="$native_dir" make "$PROFILE"
          else
            test "$PROFILE" = network-signing-check
            test "$(sudo -n id -u)" = 0
            native_dir=$(sudo -n mktemp -d /ardents-root-native.XXXXXX)
            trap 'sudo -n rm -rf "$native_dir"' EXIT
            test "$(findmnt -T "$native_dir" -n -o FSTYPE)" = ext4
            for directory in / "$native_dir"; do
              read -r owner mode <<<"$(sudo -n stat -c '%u %a' "$directory")"
              test "$owner" = 0
              (( (8#$mode & 022) == 0 ))
            done
            build_dir=$(mktemp -d "$RUNNER_TEMP/ardents-signing-build.XXXXXX")
            trap 'sudo -n rm -rf "$native_dir"; rm -rf "$build_dir"' EXIT
            CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags=-w -o "$build_dir/ardents" ./cmd/ardents-next
            pin=$(sha256sum "$build_dir/ardents" | cut -d ' ' -f 1)
            sudo -n install -m 0555 "$build_dir/ardents" "$native_dir/ardents"
            printf '%s  %s\n' "$pin" "$native_dir/ardents" | sudo -n sha256sum -c
            real_go=$(command -v go)
            sudo -n install -d -m 0700 "$native_dir/tools"
            sudo -n tee "$native_dir/tools/go" >/dev/null <<'SHIM'
          #!/bin/sh
          set -eu
          for arg in "$@"; do
              if [ "$arg" = '^TestSourceInspectionNative' ]; then
                  umask 077
                  break
              fi
          done
          exec "$ARDENTS_NATIVE_GO" "$@"
          SHIM
            sudo -n chmod 0500 "$native_dir/tools/go"
            sudo -n env PATH="$native_dir/tools:$PATH" ARDENTS_NATIVE_GO="$real_go" \
              GOTOOLCHAIN=local GOENV=off GOFLAGS=-mod=readonly TMPDIR="$native_dir" \
              ARDENTS_INFRASTRUCTURE_PROVISION_PROGRAM="$native_dir/ardents" ARDENTS_INFRASTRUCTURE_PROVISION_PROGRAM_SHA256="$pin" \
              ARDENTS_INFRASTRUCTURE_RELEASE_PROGRAM="$native_dir/ardents" ARDENTS_INFRASTRUCTURE_RELEASE_PROGRAM_SHA256="$pin" \
              GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" \
              sh -ec 'umask 022; exec make "$1"' native "$PROFILE"
          fi
