name: quality
on: workflow_dispatch
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CANDIDATE: 20883732fa692e7a1c17e689a62e45b4463f0369
      CANDIDATE_TREE: 00c6afbd835c925f11e9258cd76b02d400b3e069
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Run the original Source profile
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          git log -1 --format='Candidate %H tree %T'
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          manager=$(systemctl show -p Version --value)
          case "$manager" in 255.*) ;; *) printf '%s\n' "$manager"; exit 2 ;; esac
          test -r /sys/fs/cgroup/cgroup.controllers
          build_dir=$(mktemp -d "$RUNNER_TEMP/ardents-node-build.XXXXXX")
          node_dir=$(sudo -n mktemp -d /ardents-source-custody.XXXXXX)
          trap 'sudo -n rm -rf "$node_dir"; rm -rf "$build_dir"' EXIT
          test "$(findmnt -T "$node_dir" -n -o FSTYPE)" = ext4
          for parent in / "$node_dir"; do
            read -r uid mode <<<"$(sudo -n stat -c '%u %a' "$parent")"
            test "$uid" = 0
            (( (8#$mode & 022) == 0 ))
          done
          sudo -n chmod 0755 "$node_dir"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags=-w -o "$build_dir/ardents" ./cmd/ardents-next
          go test -race -trimpath -buildvcs=false -tags node_process_native -c -o "$build_dir/node.test" ./cmd/ardents-next
          go test -race -trimpath -buildvcs=false -tags node_process_native -c -o "$build_dir/resource.test" ./internal/processresource
          ordinary_pin=$(sha256sum "$build_dir/ardents" | cut -d ' ' -f 1)
          command_test_pin=$(sha256sum "$build_dir/node.test" | cut -d ' ' -f 1)
          resource_test_pin=$(sha256sum "$build_dir/resource.test" | cut -d ' ' -f 1)
          printf 'command=%s\ncommand-test=%s\nresource-test=%s\n' "$ordinary_pin" "$command_test_pin" "$resource_test_pin"
          sudo -n install -m 0555 "$build_dir/ardents" "$build_dir/node.test" "$build_dir/resource.test" "$node_dir/"
          sudo -n env PATH="$PATH" TMPDIR="$node_dir" \
            ARDENTS_NODE_NATIVE_COMMAND="$node_dir/ardents" ARDENTS_NODE_NATIVE_COMMAND_SHA256="$ordinary_pin" \
            ARDENTS_NODE_NATIVE_TEST="$node_dir/node.test" ARDENTS_NODE_NATIVE_TEST_SHA256="$command_test_pin" \
            ARDENTS_NODE_RESOURCE_TEST="$node_dir/resource.test" ARDENTS_NODE_RESOURCE_TEST_SHA256="$resource_test_pin" \
            sh -ec 'umask 077; exec make source-process-check'
  source-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE: 20883732fa692e7a1c17e689a62e45b4463f0369
      CANDIDATE_TREE: 00c6afbd835c925f11e9258cd76b02d400b3e069
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Verify offline Source preparation and its strict declaration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          git log -1 --format='Candidate %H tree %T'
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          test "$(uname -m)" = x86_64
          build_dir=$(mktemp -d "$RUNNER_TEMP/ardents-source-build.XXXXXX")
          native_dir=$(sudo -n mktemp -d /ardents-source-alias.XXXXXX)
          trap 'sudo -n rm -rf "$native_dir"; rm -rf "$build_dir"' EXIT
          test "$(findmnt -T "$native_dir" -n -o FSTYPE)" = ext4
          for parent in / "$native_dir"; do
            read -r uid mode <<<"$(sudo -n stat -c '%u %a' "$parent")"
            test "$uid" = 0
            (( (8#$mode & 022) == 0 ))
          done
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags=-w -o "$build_dir/ardents" ./cmd/ardents-next
          go test -race -trimpath -buildvcs=false -tags network_signing_native -c -o "$build_dir/preparation.test" ./cmd/ardents-next
          go test -race -trimpath -buildvcs=false -c -o "$build_dir/declaration.test" ./internal/endpoint
          pin=$(sha256sum "$build_dir/ardents" | cut -d ' ' -f 1)
          sudo -n install -m 0555 "$build_dir/ardents" "$build_dir/preparation.test" "$build_dir/declaration.test" "$native_dir/"
          test "$(sudo -n sha256sum "$native_dir/ardents" | cut -d ' ' -f 1)" = "$pin"
          sudo -n env TMPDIR="$native_dir" ARDENTS_PREBUILT_NEXT="$native_dir/ardents" \
            "$native_dir/preparation.test" -test.run '^TestSourcePreparationNative' -test.count=1 -test.v -test.timeout=3m
          sudo -n env TMPDIR="$native_dir" "$native_dir/declaration.test" -test.run '^TestSourcePreparationClosedDeclaration$' -test.count=1 -test.v -test.timeout=3m
