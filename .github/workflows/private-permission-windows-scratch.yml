name: Temporary Windows private Permission verification
on:
  push:
    branches: [codex/1040-private-permission-platforms]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: false
      - name: Verify original NTFS DACL and private output
        shell: pwsh
        run: |
          $env:GOTOOLCHAIN = 'local'
          go test -race ./internal/domain/custody ./internal/domain/custody/command -run '^(TestWindowsPrivatePermission|TestPrivatePermissionUnavailableBeforeVaultOrPrompt)' -count=1 -v -timeout=5m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Causal DACL controls in isolated source copies
        shell: pwsh
        run: |
          $env:GOTOOLCHAIN = 'local'
          $archive = Join-Path $env:RUNNER_TEMP 'permission-source.tar'
          git archive --format=tar --output=$archive HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($variant in @('inherit', 'bypass')) {
            $copy = Join-Path $env:RUNNER_TEMP ("permission-" + $variant)
            New-Item -ItemType Directory -Path $copy | Out-Null
            tar -xf $archive -C $copy
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $file = Join-Path $copy 'internal/domain/custody/private_permission_windows.go'
            $text = Get-Content -Raw $file
            if ($variant -eq 'inherit') {
              $old = 'attributes, windows.CREATE_NEW'
              $new = 'nil, windows.CREATE_NEW'
              $test = '^TestWindowsPrivatePermissionProtectedCreationAndRetry$'
              $expect = 'protected first delivery'
            } else {
              $old = "func checkPrivatePermissionProtection(file *os.File) error {`n"
              $new = $old + "`tif file != nil { return nil }`n"
              $test = '^TestWindowsPrivatePermissionRefusesExistingBroadDACL$'
              $expect = 'unsafe existing permission was accepted'
            }
            if (-not $text.Contains($old)) { throw "mutation marker absent: $variant" }
            [System.IO.File]::WriteAllText($file, $text.Replace($old, $new))
            Push-Location $copy
            $ErrorActionPreference = 'Continue'
            $log = Join-Path $env:RUNNER_TEMP ("permission-" + $variant + '.log')
            go test ./internal/domain/custody -run $test -count=1 -v -timeout=3m *> $log
            $status = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            Pop-Location
            Get-Content $log
            if ($status -eq 0 -or -not (Select-String -Quiet -Path $log -SimpleMatch $expect)) {
              throw "DACL mutation was not detected: $variant"
            }
          }
