name: live network

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-network-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build pinned impairment tooling image
        env:
          BASE_IMAGE: ubuntu@sha256:7b202b0e2e0028c6250f5fcf41d04df492d145a1654c6995a6553f0c1f6f1960
          GO_ARCHIVE_SHA256: 5c2c3b16caefa1d968a94c1daca04a7ca301a496d9b086e17ad77bb81393f053
        run: |
          set -euo pipefail
          docker pull "$BASE_IMAGE"
          mkdir -p "$RUNNER_TEMP/go-input" "$RUNNER_TEMP/tool-bundle"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/go-input/go1.26.6.linux-amd64.tar.gz" https://go.dev/dl/go1.26.6.linux-amd64.tar.gz
          printf '%s  %s\n' "$GO_ARCHIVE_SHA256" "$RUNNER_TEMP/go-input/go1.26.6.linux-amd64.tar.gz" | sha256sum --check
          bash scripts/prepare-carrier-tools.sh lab/carrier/tools.lock "$RUNNER_TEMP/tool-bundle"
          go run ./scripts/prepare-go-vendor.go "$RUNNER_TEMP/go-vendor"
          verification=$(go run ./cmd/carrier-lab tooling-verify --lock "$GITHUB_WORKSPACE/lab/carrier/tools.lock" --bundle "$RUNNER_TEMP/tool-bundle" --repository-root "$GITHUB_WORKSPACE")
          source_sha256=$(printf '%s\n' "$verification" | sed -n 's/^Qualification source SHA-256: //p')
          [[ ${#source_sha256} -eq 64 ]]
          docker build --no-cache --pull=false --network=none --build-context "go_archive=$RUNNER_TEMP/go-input" --build-context "go_vendor=$RUNNER_TEMP/go-vendor" --build-context "tool_bundle=$RUNNER_TEMP/tool-bundle" --build-arg "CARRIER_LAB_SOURCE_SHA256=$source_sha256" --target tooling --iidfile "$RUNNER_TEMP/tool-image.id" -f lab/carrier/Dockerfile .
          printf 'ARDENTS_LIVE_TOOL_IMAGE=%s\n' "$(cat "$RUNNER_TEMP/tool-image.id")" >> "$GITHUB_ENV"
      - name: Run live network test
        run: make live
