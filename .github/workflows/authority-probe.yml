name: temporary authority diagnosis
on:
  push:
    branches: [codex/diagnose-357-authority]
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.8
          cache: true
      - name: Repeat original CI wrapper in fresh processes with Source observations
        env:
          TEST_PACKAGE: github.com/dianabuilds/ardents-network/internal/endpoint
          TEST_RUN: ^(TestTextReadCancellationRejectsAdditionalCleanupFailure|TestTextReadResultJoinsContextLossBeforeLocalRequest)$
          TEST_RACE: "true"
        run: |
          for attempt in $(seq 1 60); do
            printf 'authority-probe fresh-process=%s\n' "$attempt"
            args=(-json -count=1 -timeout=5m -run "$TEST_RUN")
            if [[ "$TEST_RACE" == true ]]; then args+=(-race); fi
            test_log="$RUNNER_TEMP/authority-$attempt.json"
            set +e
            timeout --signal=QUIT --kill-after=10s 330s go test "${args[@]}" "$TEST_PACKAGE" | tee "$test_log"
            status=${PIPESTATUS[0]}
            set -e
            if (( status != 0 )); then exit "$status"; fi
          done
