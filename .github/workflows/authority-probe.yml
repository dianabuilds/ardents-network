name: temporary authority diagnosis
on:
  push:
    branches: [codex/diagnose-357-authority]
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.8
          cache: true
      - name: Repeat exact failed test owner in fresh processes with safe boundary observations
        env:
          GOFLAGS: -mod=readonly
        run: |
          for attempt in $(seq 1 20); do
            printf 'authority-probe fresh-process=%s\n' "$attempt"
            go test -json -race -count=1 -timeout=5m -run '^(TestTextReadCancellationRejectsAdditionalCleanupFailure|TestTextReadResultJoinsContextLossBeforeLocalRequest)$' ./internal/endpoint
          done
