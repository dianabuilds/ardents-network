name: Carrier Lab R-013

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carrier-lab-r013
  cancel-in-progress: false

jobs:
  qualification:
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false
      - name: Run repository quality gate
        run: |
          make tools-install
          make check
      - name: Prepare pinned external inputs
        env:
          BASE_IMAGE: ubuntu@sha256:7b202b0e2e0028c6250f5fcf41d04df492d145a1654c6995a6553f0c1f6f1960
          GO_ARCHIVE_SHA256: 5c2c3b16caefa1d968a94c1daca04a7ca301a496d9b086e17ad77bb81393f053
        run: |
          set -euo pipefail
          docker pull "$BASE_IMAGE"
          mkdir -p "$RUNNER_TEMP/go-input" "$RUNNER_TEMP/tool-bundle" "$RUNNER_TEMP/reference-inputs"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/go-input/go1.26.5.linux-amd64.tar.gz" https://go.dev/dl/go1.26.5.linux-amd64.tar.gz
          printf '%s  %s\n' "$GO_ARCHIVE_SHA256" "$RUNNER_TEMP/go-input/go1.26.5.linux-amd64.tar.gz" | sha256sum --check
          bash scripts/prepare-carrier-tools.sh lab/carrier/tools.lock "$RUNNER_TEMP/tool-bundle"
          bash scripts/prepare-carrier-reference.sh lab/carrier/reference.lock "$RUNNER_TEMP/reference-inputs"
          go run ./scripts/prepare-go-vendor.go "$RUNNER_TEMP/go-vendor"
      - name: Verify inputs and build each immutable image once
        run: |
          set -euo pipefail
          verification=$(go run ./cmd/carrier-lab tooling-verify --lock "$GITHUB_WORKSPACE/lab/carrier/tools.lock" --bundle "$RUNNER_TEMP/tool-bundle" --repository-root "$GITHUB_WORKSPACE")
          printf '%s\n' "$verification"
          source_sha256=$(printf '%s\n' "$verification" | sed -n 's/^Qualification source SHA-256: //p')
          [[ ${#source_sha256} -eq 64 ]]
          docker build --no-cache --pull=false --network=none --build-context "go_archive=$RUNNER_TEMP/go-input" --build-context "go_vendor=$RUNNER_TEMP/go-vendor" --build-context "tool_bundle=$RUNNER_TEMP/tool-bundle" --build-arg "CARRIER_LAB_SOURCE_SHA256=$source_sha256" --target tooling --iidfile "$RUNNER_TEMP/tool-image.id" -f lab/carrier/Dockerfile .
          docker build --pull=false --network=none --build-context "go_archive=$RUNNER_TEMP/go-input" --build-context "go_vendor=$RUNNER_TEMP/go-vendor" --build-context "tool_bundle=$RUNNER_TEMP/tool-bundle" --build-arg "CARRIER_LAB_SOURCE_SHA256=$source_sha256" --target application --iidfile "$RUNNER_TEMP/application-image.id" -f lab/carrier/Dockerfile .
      - name: Run frozen Direct, C-3, C-5/C2, negative, and Tor controls
        run: |
          set -euo pipefail
          run_id="r013-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          session_root="$RUNNER_TEMP/ardents-experiment-session.$run_id"
          mkdir -p "$session_root"
          evidence_directory="$session_root/ardents-experiment-evidence.$run_id"
          printf 'CARRIER_LAB_EVIDENCE=%s\n' "$evidence_directory" >> "$GITHUB_ENV"
          go run ./cmd/carrier-lab route-experiment \
            --repository-root "$GITHUB_WORKSPACE" \
            --session-root "$session_root" \
            --temp-root "$RUNNER_TEMP" \
            --run-id "$run_id" \
            --application-image "$(cat "$RUNNER_TEMP/application-image.id")" \
            --tool-image "$(cat "$RUNNER_TEMP/tool-image.id")" \
            --reference-directory "$RUNNER_TEMP/reference-inputs"
      - name: Validate completed evidence
        run: |
          python3 - "$CARRIER_LAB_EVIDENCE/experiment-verdict.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              verdict = json.load(source)
          if verdict["status"] != "completed" or verdict["decision"] not in {"advance", "redesign", "stop"}:
              raise SystemExit(f"invalid Carrier Lab result: {verdict}")
          with open(sys.argv[1].replace("experiment-verdict.json", "experiment.json"), encoding="utf-8") as source:
              experiment = json.load(source)
          direct = experiment.get("conditions", {}).get("direct", {})
          if (len(direct.get("setups", [])) != 20
                  or not all(sample.get("passed") for sample in direct["setups"])
                  or len(direct.get("streams", [])) != 6
                  or not all(sample.get("verified") and sample.get("bits_per_second", 0) > 0 for sample in direct["streams"])
                  or not direct.get("resources")
                  or not direct.get("cleanup_passed")):
              raise SystemExit("Direct baseline is operationally invalid; no technology verdict may be accepted")
          print(f"Carrier Lab decision: {verdict['decision']}")
          PY
      - name: Upload bounded experiment evidence
        if: always() && env.CARRIER_LAB_EVIDENCE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: carrier-lab-r013-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CARRIER_LAB_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30
