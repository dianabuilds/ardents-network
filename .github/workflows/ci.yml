name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional vX.Y.Z release candidate version
        required: false
        type: string
      durable_evidence_uri:
        description: Required with release_version; non-secret immutable destination/authority reference for supported-lifetime evidence
        required: false
        type: string
      native_install_contract:
        description: Required with release_version; explicit maintainer disposition of the executable native-install environment
        required: false
        default: unresolved
        type: choice
        options:
          - unresolved
          - privileged-systemd-container

permissions:
  actions: read
  contents: read
concurrency:
  group: >-
    ci-${{ github.workflow }}-${{
      inputs.release_version != '' &&
      format('qualification-{0}-{1}', github.sha, inputs.release_version) ||
      (startsWith(github.ref, 'refs/tags/v') && format('release-{0}', github.ref) || github.ref)
    }}
  # Version publication is recoverable but not atomic across both OCI images.
  # Never cancel release or qualification attempts; ordinary branch CI remains
  # replaceable. Attempt-qualified artifact names preserve rerun history.
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.release_version != '') }}

jobs:
  windows-interface:
    name: Windows orchestration contract
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Capture gate environment
        shell: pwsh
        run: ./tests/ci/capture-dr06-environment.ps1 -Gate windows-interface
      - name: Parse supported PowerShell surfaces
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tests/.artifacts/prerequisites/windows-interface | Out-Null
          $files = @('ardents.ps1') + @(Get-ChildItem scripts,tests -Recurse -Filter '*.ps1' | ForEach-Object FullName)
          foreach ($file in $files) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$null, [ref]$errors)
            if ($errors.Count) { throw "$file contains PowerShell syntax errors: $($errors.Message -join '; ')" }
          }
          ./ardents.ps1 help | Tee-Object tests/.artifacts/prerequisites/windows-interface/help.txt
          if ($LASTEXITCODE -ne 0) { throw "repository help contract failed" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-interface-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/.artifacts/prerequisites/windows-interface
          retention-days: 90
          if-no-files-found: error

  static:
    name: Format, vet, and scenario catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version-file: go.mod
          cache: true
      - name: Capture gate environment
        shell: pwsh
        run: ./tests/ci/capture-dr06-environment.ps1 -Gate static
      - name: Install pinned Application API generators
        shell: bash
        run: |
          set -euo pipefail
          protoc_version=33.4
          curl --fail --location --silent --show-error \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${protoc_version}/protoc-${protoc_version}-linux-x86_64.zip" \
            --output "$RUNNER_TEMP/protoc.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.9
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1
      - name: Canonical static gates
        shell: pwsh
        env:
          DR06_RELEASE_VERSION: ${{ inputs.release_version }}
          DR06_DURABLE_EVIDENCE_URI: ${{ inputs.durable_evidence_uri }}
          DR06_NATIVE_INSTALL_CONTRACT: ${{ inputs.native_install_contract }}
        run: |
          if ($env:DR06_RELEASE_VERSION) {
            if ($env:DR06_RELEASE_VERSION -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
              throw 'release_version must be an exact vX.Y.Z release-candidate identity'
            }
            if ([string]::IsNullOrWhiteSpace($env:DR06_DURABLE_EVIDENCE_URI)) {
              throw 'durable_evidence_uri is required for a DR-06 qualification dispatch'
            }
            if ($env:DR06_NATIVE_INSTALL_CONTRACT -ne 'privileged-systemd-container') {
              throw 'native_install_contract requires an explicit maintainer disposition'
            }
          }
          ./scripts/generate-api.ps1 -Check
          ./tests/check-format.ps1
          go vet ./...
          New-Item -ItemType Directory -Force tests/.artifacts/reports/catalog | Out-Null
          go test ./tests/tooling/testcatalog ./tests/tooling/audittrace ./tests/tooling/archaccept ./tests/tooling/capabilitycatalog ./tests/tooling/dr06contract -count=1
          go run ./tests/tooling/testcatalog -tags "integration e2e" ./tests/... | Tee-Object tests/.artifacts/reports/catalog/validation.json
          if ($LASTEXITCODE -ne 0) { throw "scenario catalog validation failed" }
          $catalogEntries = @(Get-Content -Raw tests/.artifacts/reports/catalog/validation.json | ConvertFrom-Json)
          if ($catalogEntries.Count -eq 0) { throw "scenario catalog validation returned no entries" }
          go run ./tests/tooling/capabilitycatalog -check | Tee-Object tests/.artifacts/reports/catalog/capabilities.txt
          if ($LASTEXITCODE -ne 0) { throw "capability catalogue validation failed" }
          go run ./tests/tooling/audittrace
          go run ./tests/tooling/dr06contract | Tee-Object tests/.artifacts/reports/catalog/dr06-contract.txt
          if ($LASTEXITCODE -ne 0) { throw "DR-06 workflow contract validation failed" }
          ./tests/ci/capture-dr06-environment-test.ps1
          ./tests/ci/create-dr06-evidence-index-test.ps1
          ./tests/ci/confirm-dr06-retention-test.ps1
          ./tests/ci/entrypoint-contract-gate-test.ps1
          ./tests/ci/release-source-identity-gate.ps1
          ./tests/ci/release-materials-policy-gate.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: catalog-validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/.artifacts/reports/catalog
          retention-days: 90
          if-no-files-found: error

  critical-lifecycle:
    name: Critical diff, race, and lifecycle contracts
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AUDIT_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version-file: go.mod
          cache: true
      - name: Capture gate environment
        shell: pwsh
        run: ./tests/ci/capture-dr06-environment.ps1 -Gate critical-lifecycle
      - name: Verify audit traceability and critical-file diff coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tests/.artifacts/prerequisites/critical-lifecycle | Out-Null
          $base = $env:AUDIT_DIFF_BASE
          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
            $base = git rev-parse HEAD^
            if ($LASTEXITCODE -ne 0) { throw "critical-file diff base is unavailable" }
          }
          go run ./tests/tooling/audittrace -base $base 2>&1 |
            Tee-Object tests/.artifacts/prerequisites/critical-lifecycle/audittrace.txt
          if ($LASTEXITCODE -ne 0) { throw "critical audit traceability failed" }
      - name: Run critical race and lifecycle contracts
        shell: pwsh
        run: |
          go test -race `
            ./internal/ingressproxy `
            ./internal/network/waku `
            ./internal/messaging/... `
            ./internal/content `
            ./internal/identity/access `
            ./internal/daemon `
            ./internal/workload/... `
            ./internal/transfer `
            ./internal/config `
            -count=1 2>&1 |
            Tee-Object tests/.artifacts/prerequisites/critical-lifecycle/race.txt
          if ($LASTEXITCODE -ne 0) { throw "critical race/lifecycle contracts failed" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: critical-lifecycle-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/.artifacts/prerequisites/critical-lifecycle
          retention-days: 90
          if-no-files-found: error

  fast:
    name: Fast Docker/Linux suite
    needs: [static, critical-lifecycle]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Capture gate environment
        shell: pwsh
        run: ./tests/ci/capture-dr06-environment.ps1 -Gate fast
      - shell: pwsh
        run: ./ardents.ps1 test fast -RebuildContainer -CoverageProfile tests/.artifacts/coverage/fast.out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fast-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/.artifacts/coverage
            tests/.artifacts/resources
            tests/.artifacts/dr06-environment/fast
          retention-days: 90
          if-no-files-found: error

  tagged:
    name: ${{ matrix.suite }} Docker/Linux suite
    needs: [static, critical-lifecycle]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [integration, e2e]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Capture gate environment
        shell: pwsh
        run: ./tests/ci/capture-dr06-environment.ps1 -Gate tagged-${{ matrix.suite }}
      - shell: pwsh
        run: ./ardents.ps1 test ${{ matrix.suite }} -ReportDir tests/.artifacts/reports/${{ matrix.suite }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.suite }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/.artifacts/reports/${{ matrix.suite }}
            tests/.artifacts/resources
            tests/.artifacts/dr06-environment/tagged-${{ matrix.suite }}
          retention-days: 90
          if-no-files-found: error

  focused-tagged:
    name: ${{ matrix.gate }} focused evidence
    needs: [static, critical-lifecycle]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: application-process
            suite: e2e
            domain: application-interface
            scenario: APP-001
          - gate: network-foundation
            suite: integration
            domain: network-foundation
            scenario: NFI-001
          - gate: workload-integration
            suite: integration
            domain: workload
            scenario: WKI-001
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Capture gate environment
        shell: pwsh
        run: ./tests/ci/capture-dr06-environment.ps1 -Gate ${{ matrix.gate }}
      - name: Canonical focused tagged selection
        shell: pwsh
        run: ./ardents.ps1 test ${{ matrix.suite }} -Domain ${{ matrix.domain }} -Scenario ${{ matrix.scenario }} -ReportDir tests/.artifacts/reports/${{ matrix.gate }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.gate }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/.artifacts/reports/${{ matrix.gate }}
            tests/.artifacts/resources
            tests/.artifacts/dr06-environment/${{ matrix.gate }}
          retention-days: 90
          if-no-files-found: error

  failure-contract:
    name: Deliberate failure evidence
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Capture gate environment
        shell: pwsh
        run: ./tests/ci/capture-dr06-environment.ps1 -Gate failure-contract
      - shell: pwsh
        run: ./tests/ci/verify-failure-evidence.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deliberate-failure-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/.artifacts/reports/ci-deliberate-failure
            tests/.artifacts/resources
            tests/.artifacts/dr06-environment/failure-contract
          retention-days: 90
          if-no-files-found: error

  security:
    name: Vulnerability reconciliation
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Capture gate environment
        shell: pwsh
        run: ./tests/ci/capture-dr06-environment.ps1 -Gate security
      - shell: pwsh
        run: ./tests/ci/security-gate.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/.artifacts/security
          retention-days: 90
          if-no-files-found: error

  deployment:
    name: Product-ready Docker cluster
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Capture gate environment
        shell: pwsh
        run: ./tests/ci/capture-dr06-environment.ps1 -Gate deployment
      - name: Canonical deployment gate
        shell: pwsh
        run: ./tests/ci/deployment-gate.ps1 -Build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/.artifacts/deployment
          retention-days: 90
          if-no-files-found: error

  native-install:
    name: Privileged systemd acceptance container
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Capture gate environment
        shell: pwsh
        run: ./tests/ci/capture-dr06-environment.ps1 -Gate native-install
      - name: Native install, upgrade, rollback, backup, restore, and uninstall gate
        shell: pwsh
        run: ./tests/ci/native-install-gate.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-install-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/.artifacts/native-install
          retention-days: 90
          if-no-files-found: error

  multinode:
    name: Segmented multi-node topology
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Capture gate environment
        shell: pwsh
        run: ./tests/ci/capture-dr06-environment.ps1 -Gate multinode
      - shell: pwsh
        run: ./tests/ci/multihost-gate.ps1 -BuildMode Always -ReportDir tests/.artifacts/reports/multihost
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: multihost-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/.artifacts/reports/multihost
          retention-days: 90
          if-no-files-found: error

  release-builds:
    name: Independent release build (${{ matrix.rebuild }})
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
    needs: [windows-interface, fast, tagged, focused-tagged, failure-contract, security, deployment, native-install, multinode]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        rebuild: [a, b]
    env:
      RELEASE_VERSION: ${{ inputs.release_version || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Capture release-build environment
        shell: pwsh
        run: ./tests/ci/capture-dr06-environment.ps1 -Gate release-build-${{ matrix.rebuild }}
      - name: Build in clean runner and disposable caches
        shell: pwsh
        run: |
          $buildError = $null
          try {
            ./ardents.ps1 package $env:RELEASE_VERSION -OutputDir dist/repro 2>&1 |
              Tee-Object tests/.artifacts/release-build-${{ matrix.rebuild }}/build.log
            if ($LASTEXITCODE -ne 0) { throw "release build ${{ matrix.rebuild }} failed" }
          } catch {
            $buildError = $_
          } finally {
            if (-not (Test-Path -LiteralPath dist/repro)) {
              New-Item -ItemType Directory -Force dist/repro | Out-Null
            }
            Copy-Item tests/.artifacts/release-build-${{ matrix.rebuild }} dist/repro/_dr06-evidence -Recurse
          }
          if ($null -ne $buildError) { throw $buildError }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-repro-${{ matrix.rebuild }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/repro
          retention-days: 90
          if-no-files-found: error

  release-candidate:
    name: Reproducible release candidate
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
    needs: release-builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.release_version || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-repro-a-${{ github.run_id }}-*
          path: dist/repro-a-attempts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-repro-b-${{ github.run_id }}-*
          path: dist/repro-b-attempts
      - name: Select latest retained release-build attempts
        shell: pwsh
        run: |
          foreach ($rebuild in 'a','b') {
            $attemptRoot = "dist/repro-$rebuild-attempts"
            $attempts = @(Get-ChildItem -LiteralPath $attemptRoot -Directory | ForEach-Object {
              if ($_.Name -notmatch '-([0-9]+)$') { throw "release-build artifact has no attempt identity: $($_.Name)" }
              [pscustomobject]@{ attempt = [int]$Matches[1]; directory = $_ }
            } | Sort-Object attempt)
            if ($attempts.Count -eq 0) { throw "release build $rebuild has no retained attempt" }
            $selected = $attempts[-1].directory
            $destination = "dist/repro-$rebuild"
            New-Item -ItemType Directory -Force $destination | Out-Null
            Copy-Item (Join-Path $selected.FullName '*') $destination -Recurse
            $gateEvidence = Join-Path $destination '_dr06-evidence'
            if (-not (Test-Path -LiteralPath $gateEvidence -PathType Container)) {
              throw "release build $rebuild has no DR-06 environment evidence"
            }
            Remove-Item -LiteralPath $gateEvidence -Recurse -Force
            Write-Host "release-build-$rebuild-attempt=$($attempts[-1].attempt)"
          }
      - name: Capture release-candidate environment
        shell: pwsh
        run: ./tests/ci/capture-dr06-environment.ps1 -Gate release-candidate
      - name: Compare and verify independent builds
        shell: pwsh
        run: |
          & {
            ./scripts/release/verify.ps1 -ArtifactDir dist/repro-a -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA -RequireClean
            ./scripts/release/verify.ps1 -ArtifactDir dist/repro-b -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA -RequireClean
            $filesA = @(Get-ChildItem -LiteralPath dist/repro-a -File | Sort-Object Name)
            $filesB = @(Get-ChildItem -LiteralPath dist/repro-b -File | Sort-Object Name)
            $difference = @(Compare-Object @($filesA.Name) @($filesB.Name))
            if ($difference.Count -ne 0) { throw "release build payload sets differ: $($difference | Out-String)" }
            foreach ($file in $filesA) {
              $hashA = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash
              $hashB = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path dist/repro-b $file.Name)).Hash
              if ($hashA -ne $hashB) { throw "release artifact is not reproducible: $($file.Name)" }
            }
            ./tests/ci/release-metadata-gate.ps1 -ArtifactDir dist/repro-a -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA
            ./tests/ci/release-images-gate.ps1 -ArtifactDir dist/repro-a -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA
            docker run --rm --mount type=bind,source=${PWD}/dist/repro-a,target=/release,readonly --mount type=bind,source=${PWD},target=/workspace,readonly docker.io/library/debian:bookworm-slim@sha256:63a496b5d3b99214b39f5ed70eb71a61e590a77979c79cbee4faf991f8c0783e /bin/sh /workspace/scripts/release/smoke.sh /release $env:RELEASE_VERSION $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "release smoke failed" }
          } 2>&1 | Tee-Object tests/.artifacts/release-candidate/verification.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ardents-${{ env.RELEASE_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/repro-a
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/.artifacts/release-candidate
          retention-days: 90
          if-no-files-found: error

  qualification-index:
    name: Commit-bound DR-06 evidence index
    if: ${{ always() && inputs.release_version != '' }}
    needs: [windows-interface, static, critical-lifecycle, fast, tagged, focused-tagged, failure-contract, security, deployment, native-install, multinode, release-builds, release-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        id: download-evidence
        continue-on-error: true
        with:
          pattern: '*-${{ github.run_id }}-*'
          path: tests/.artifacts/dr06-download
      - name: Exclude prior aggregate packets from retry input
        if: steps.download-evidence.outcome == 'success'
        shell: pwsh
        run: |
          Get-ChildItem tests/.artifacts/dr06-download -Directory -Filter 'dr06-qualification-index-*' |
            Remove-Item -Recurse -Force
      - name: Capture complete workflow attempt history
        id: capture-metadata
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $metadata = 'tests/.artifacts/dr06-job-metadata'
          New-Item -ItemType Directory -Force $metadata | Out-Null
          for ($attempt = 1; $attempt -le [int]$env:GITHUB_RUN_ATTEMPT; $attempt++) {
            $document = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/attempts/$attempt/jobs?per_page=100"
            if ($LASTEXITCODE -ne 0) { throw "workflow job metadata download failed for attempt $attempt" }
            $document | Set-Content -Encoding utf8 "$metadata/jobs-attempt-$attempt.json"
            if ($attempt -lt [int]$env:GITHUB_RUN_ATTEMPT) {
              gh run view $env:GITHUB_RUN_ID --attempt $attempt --log |
                Set-Content -Encoding utf8 "tests/.artifacts/dr06-download/workflow-attempt-$attempt.log"
              if ($LASTEXITCODE -ne 0) { throw "workflow log download failed for attempt $attempt" }
            }
          }
      - name: Create commit-bound evidence index
        id: create-index
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          DR06_DURABLE_EVIDENCE_URI: ${{ inputs.durable_evidence_uri }}
          DR06_NATIVE_INSTALL_CONTRACT: ${{ inputs.native_install_contract }}
        run: |
          New-Item -ItemType Directory -Force tests/.artifacts/dr06-download,tests/.artifacts/dr06-job-metadata | Out-Null
          try {
            ./tests/ci/create-dr06-evidence-index.ps1 `
              -EvidenceRoot tests/.artifacts/dr06-download `
              -JobMetadataRoot tests/.artifacts/dr06-job-metadata `
              -OutputPath tests/.artifacts/dr06-index/qualification-index.json `
              -ReleaseVersion $env:RELEASE_VERSION `
              -ExpectedCommit $env:GITHUB_SHA `
              -RunID $env:GITHUB_RUN_ID `
              -RunAttempt ([int]$env:GITHUB_RUN_ATTEMPT) `
              -DurableEvidenceURI $env:DR06_DURABLE_EVIDENCE_URI `
              -NativeInstallContract $env:DR06_NATIVE_INSTALL_CONTRACT
          } catch {
            New-Item -ItemType Directory -Force tests/.artifacts/dr06-index | Out-Null
            $_ | Out-String | Set-Content -Encoding utf8 tests/.artifacts/dr06-index/index-validation-error.txt
            throw
          } finally {
            if (Test-Path tests/.artifacts/dr06-job-metadata) {
              Copy-Item tests/.artifacts/dr06-job-metadata tests/.artifacts/dr06-index/job-metadata -Recurse -Force
            }
          }
      - name: Create rejected aggregate when qualification cannot pass
        if: ${{ always() && steps.create-index.outcome != 'success' }}
        shell: pwsh
        env:
          DR06_DURABLE_EVIDENCE_URI: ${{ inputs.durable_evidence_uri }}
          DR06_NATIVE_INSTALL_CONTRACT: ${{ inputs.native_install_contract }}
        run: |
          ./tests/ci/create-dr06-rejection-index.ps1 `
            -EvidenceRoot tests/.artifacts/dr06-download `
            -JobMetadataRoot tests/.artifacts/dr06-job-metadata `
            -OutputPath tests/.artifacts/dr06-index/qualification-index.json `
            -ReleaseVersion $env:RELEASE_VERSION `
            -ExpectedCommit $env:GITHUB_SHA `
            -RunID $env:GITHUB_RUN_ID `
            -RunAttempt ([int]$env:GITHUB_RUN_ATTEMPT) `
            -DurableEvidenceURI $env:DR06_DURABLE_EVIDENCE_URI `
            -NativeInstallContract $env:DR06_NATIVE_INSTALL_CONTRACT `
            -ValidationErrorPath tests/.artifacts/dr06-index/index-validation-error.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dr06-qualification-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/.artifacts/dr06-index
            tests/.artifacts/dr06-download
          retention-days: 90
          if-no-files-found: error
      - name: Keep rejected qualification runs failed
        if: ${{ always() && steps.create-index.outcome != 'success' }}
        shell: pwsh
        run: throw "DR-06 qualification rejected; inspect the retained aggregate index"

  publish-release:
    name: Publish signed release
    # DR-06 workflow_dispatch runs never publish, including a dispatch made
    # from a tag ref. The pre-existing push-tag release path remains separate.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ardents-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release
      - name: Verify downloaded release payload
        shell: pwsh
        run: ./scripts/release/verify.ps1 -ArtifactDir dist/release -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA -RequireClean
      - name: Attest release provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-checksums: dist/release/ARTIFACTS.sha256
      - name: Attest release SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-checksums: dist/release/ARTIFACTS.sha256
          sbom-path: dist/release/sbom.cdx.json
      - name: Load release images
        shell: pwsh
        run: |
          docker load --input "dist/release/ardents-$env:RELEASE_VERSION-linux-amd64.docker.tar"
          if ($LASTEXITCODE -ne 0) { throw "node release image load failed" }
          docker load --input "dist/release/ardents-ingress-proxy-$env:RELEASE_VERSION-linux-amd64.docker.tar"
          if ($LASTEXITCODE -ne 0) { throw "ingress proxy release image load failed" }
      - name: Generate release node image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ardents/node:${{ env.RELEASE_VERSION }}
          format: cyclonedx-json
          output-file: dist/image-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate release ingress proxy image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ardents/ingress-proxy:${{ env.RELEASE_VERSION }}
          format: cyclonedx-json
          output-file: dist/ingress-proxy-image-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Publish versioned release images
        id: images
        shell: pwsh
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:GHCR_TOKEN | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if ($LASTEXITCODE -ne 0) { throw "GHCR login failed" }
          $candidate = "$env:GITHUB_SHA-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $statePath = "dist/image-publication-state.json"
          $state = [ordered]@{
            schema_version = 1
            version = $env:RELEASE_VERSION
            commit = $env:GITHUB_SHA
            images = [ordered]@{
              node = [ordered]@{ status = "pending" }
              ingress_proxy = [ordered]@{ status = "pending" }
            }
          }
          function Save-PublicationState {
            $state | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 -LiteralPath $statePath
          }
          Save-PublicationState
          try {
            $node = ./scripts/release/publish-image.ps1 -Mode Prepare `
            -LocalImage "ardents/node:$env:RELEASE_VERSION" `
            -RemoteImage "ghcr.io/${{ github.repository_owner }}/ardents-node" -Version $env:RELEASE_VERSION `
            -CandidateIdentity $candidate | ConvertFrom-Json
            $state.images.node = [ordered]@{
              status = "prepared"; name = $node.name; digest = $node.digest; candidate_tag = $node.candidate_tag
            }
            Save-PublicationState

            $proxy = ./scripts/release/publish-image.ps1 -Mode Prepare `
            -LocalImage "ardents/ingress-proxy:$env:RELEASE_VERSION" `
            -RemoteImage "ghcr.io/${{ github.repository_owner }}/ardents-ingress-proxy" -Version $env:RELEASE_VERSION `
            -CandidateIdentity $candidate | ConvertFrom-Json
            $state.images.ingress_proxy = [ordered]@{
              status = "prepared"; name = $proxy.name; digest = $proxy.digest; candidate_tag = $proxy.candidate_tag
            }
            Save-PublicationState

            ./scripts/release/publish-image.ps1 -Mode Promote -RemoteImage $node.name `
              -Version $env:RELEASE_VERSION -ExpectedDigest $node.digest | Out-Null
            $state.images.node.status = "published"
            Save-PublicationState
            ./scripts/release/publish-image.ps1 -Mode Promote -RemoteImage $proxy.name `
              -Version $env:RELEASE_VERSION -ExpectedDigest $proxy.digest | Out-Null
            $state.images.ingress_proxy.status = "published"
            Save-PublicationState

            "node_name=$($node.name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "node_digest=$($node.digest)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "proxy_name=$($proxy.name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "proxy_digest=$($proxy.digest)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } finally {
            Save-PublicationState
          }
      - name: Attest published node image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ${{ steps.images.outputs.node_name }}
          subject-digest: ${{ steps.images.outputs.node_digest }}
          push-to-registry: true
      - name: Attest published node image SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ${{ steps.images.outputs.node_name }}
          subject-digest: ${{ steps.images.outputs.node_digest }}
          sbom-path: dist/image-sbom.cdx.json
          push-to-registry: true
      - name: Attest published ingress proxy image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ${{ steps.images.outputs.proxy_name }}
          subject-digest: ${{ steps.images.outputs.proxy_digest }}
          push-to-registry: true
      - name: Attest published ingress proxy image SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ${{ steps.images.outputs.proxy_name }}
          subject-digest: ${{ steps.images.outputs.proxy_digest }}
          sbom-path: dist/ingress-proxy-image-sbom.cdx.json
          push-to-registry: true
      - name: Remove GHCR write credential
        if: always()
        shell: pwsh
        run: docker logout ghcr.io
      - name: Preserve image publication recovery state
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-publication-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/image-publication-state.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Create published image manifest
        shell: pwsh
        run: |
          $manifest = [ordered]@{
            schema_version = 1
            version = $env:RELEASE_VERSION
            commit = $env:GITHUB_SHA
            images = [ordered]@{
              node = [ordered]@{
                name = "${{ steps.images.outputs.node_name }}"
                digest = "${{ steps.images.outputs.node_digest }}"
              }
              ingress_proxy = [ordered]@{
                name = "${{ steps.images.outputs.proxy_name }}"
                digest = "${{ steps.images.outputs.proxy_digest }}"
                protocol_version = (Get-Content -Raw -LiteralPath "dist/release/release-manifest.json" |
                  ConvertFrom-Json).components.ingress_proxy.protocol_version
                optional = $true
              }
            }
          }
          $path = "dist/release/published-images.json"
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 -LiteralPath $path
          $lines = [Collections.Generic.List[string]]::new()
          $lines.AddRange([string[]](Get-Content -LiteralPath "dist/release/SHA256SUMS"))
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
          $lines.Add("$hash  published-images.json")
          [IO.File]::WriteAllLines("dist/release/SHA256SUMS", @($lines | Sort-Object), [Text.UTF8Encoding]::new($false))
          $imageNamespace = "ghcr.io/${{ github.repository_owner }}".ToLowerInvariant()
          ./scripts/release/verify.ps1 -ArtifactDir dist/release -ExpectedVersion $env:RELEASE_VERSION `
            -ExpectedCommit $env:GITHUB_SHA -RequireClean -RequirePublishedImages `
            -ExpectedImageNamespace $imageNamespace
      - name: Attest published image manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: dist/release/published-images.json
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $artifactDir = (Resolve-Path "dist/release").Path
          $assets = @(Get-ChildItem -LiteralPath $artifactDir -File | Sort-Object Name)
          $assetPaths = @($assets | ForEach-Object FullName)

          function Assert-RemoteRelease([string]$DownloadDir) {
            gh release download $env:RELEASE_VERSION --dir $DownloadDir
            if ($LASTEXITCODE -ne 0) { throw "release asset download failed" }
            $remote = @(Get-ChildItem -LiteralPath $DownloadDir -File | Sort-Object Name)
            $difference = @(Compare-Object @($assets.Name) @($remote.Name))
            if ($difference.Count -ne 0) { throw "published release has a different asset set: $($difference | Out-String)" }
            foreach ($asset in $assets) {
              $localHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset.FullName).Hash
              $remoteHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $DownloadDir $asset.Name)).Hash
              if ($localHash -ne $remoteHash) { throw "published asset differs: $($asset.Name)" }
            }
            $imageNamespace = "ghcr.io/${{ github.repository_owner }}".ToLowerInvariant()
            ./scripts/release/verify.ps1 -ArtifactDir $DownloadDir -ExpectedVersion $env:RELEASE_VERSION `
              -ExpectedCommit $env:GITHUB_SHA -RequireClean -RequirePublishedImages `
              -ExpectedImageNamespace $imageNamespace
          }

          $release = gh release view $env:RELEASE_VERSION --json isDraft,assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_VERSION --verify-tag --draft --title "Ardents $env:RELEASE_VERSION" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "draft release creation failed" }
            $releaseInfo = [pscustomobject]@{ isDraft = $true; assets = @() }
          } else {
            $releaseInfo = $release | ConvertFrom-Json
          }

          $verificationDir = Join-Path ([IO.Path]::GetTempPath()) "ardents-release-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $verificationDir | Out-Null
          try {
            if (-not $releaseInfo.isDraft) {
              Assert-RemoteRelease $verificationDir
              exit 0
            }
            $extraAssets = @($releaseInfo.assets.name | Where-Object { $_ -notin $assets.Name })
            if ($extraAssets.Count -ne 0) { throw "draft release contains unexpected assets: $($extraAssets -join ', ')" }
            gh release upload $env:RELEASE_VERSION $assetPaths --clobber
            if ($LASTEXITCODE -ne 0) { throw "draft release asset upload failed" }
            Assert-RemoteRelease $verificationDir
            gh release edit $env:RELEASE_VERSION --draft=false
            if ($LASTEXITCODE -ne 0) { throw "draft release publication failed" }
          } finally {
            Remove-Item -LiteralPath $verificationDir -Recurse -Force
          }
