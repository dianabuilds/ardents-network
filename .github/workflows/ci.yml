name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional vX.Y.Z release candidate version
        required: false
        type: string

permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Version publication is recoverable but not atomic across both OCI images.
  # Never cancel it between promotions; ordinary branch CI remains replaceable.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  windows-interface:
    name: Windows orchestration contract
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse supported PowerShell surfaces
        shell: pwsh
        run: |
          $files = @('ardents.ps1') + @(Get-ChildItem scripts,tests -Recurse -Filter '*.ps1' | ForEach-Object FullName)
          foreach ($file in $files) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$null, [ref]$errors)
            if ($errors.Count) { throw "$file contains PowerShell syntax errors: $($errors.Message -join '; ')" }
          }
          ./ardents.ps1 help

  static:
    name: Format, vet, and scenario catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned Application API generators
        shell: bash
        run: |
          set -euo pipefail
          protoc_version=33.4
          curl --fail --location --silent --show-error \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${protoc_version}/protoc-${protoc_version}-linux-x86_64.zip" \
            --output "$RUNNER_TEMP/protoc.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.9
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1
      - name: Canonical static gates
        shell: pwsh
        run: |
          ./scripts/generate-api.ps1 -Check
          ./tests/check-format.ps1
          go vet ./...
          New-Item -ItemType Directory -Force tests/.artifacts/reports/catalog | Out-Null
          go test ./tests/tooling/testcatalog ./tests/tooling/audittrace ./tests/tooling/archaccept -count=1
          go run ./tests/tooling/testcatalog ./tests/... | Tee-Object tests/.artifacts/reports/catalog/validation.json
          if ($LASTEXITCODE -ne 0) { throw "scenario catalog validation failed" }
          go run ./tests/tooling/audittrace
          ./tests/ci/entrypoint-contract-gate-test.ps1
          ./tests/ci/release-source-identity-gate.ps1
          ./tests/ci/release-materials-policy-gate.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-validation
          path: tests/.artifacts/reports/catalog
          retention-days: 30
          if-no-files-found: error

  critical-lifecycle:
    name: Critical diff, race, and lifecycle contracts
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AUDIT_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify audit traceability and critical-file diff coverage
        shell: pwsh
        run: |
          $base = $env:AUDIT_DIFF_BASE
          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
            $base = git rev-parse HEAD^
            if ($LASTEXITCODE -ne 0) { throw "critical-file diff base is unavailable" }
          }
          go run ./tests/tooling/audittrace -base $base
      - name: Run critical race and lifecycle contracts
        shell: pwsh
        run: >-
          go test -race
          ./internal/ingressproxy
          ./internal/network/waku
          ./internal/messaging
          ./internal/content
          ./internal/identity/access
          ./internal/daemon
          ./internal/workload/...
          ./internal/transfer
          ./internal/config
          -count=1

  fast:
    name: Fast Docker/Linux suite
    needs: [static, critical-lifecycle]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./ardents.ps1 test fast -RebuildContainer -CoverageProfile tests/.artifacts/coverage/fast.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-evidence
          path: |
            tests/.artifacts/coverage
            tests/.artifacts/resources
          retention-days: 30
          if-no-files-found: error

  tagged:
    name: ${{ matrix.suite }} Docker/Linux suite
    needs: [static, critical-lifecycle]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [integration, e2e]
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./ardents.ps1 test ${{ matrix.suite }} -ReportDir tests/.artifacts/reports/${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.suite }}-evidence
          path: |
            tests/.artifacts/reports/${{ matrix.suite }}
            tests/.artifacts/resources
          retention-days: 30
          if-no-files-found: error

  failure-contract:
    name: Deliberate failure evidence
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./tests/ci/verify-failure-evidence.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deliberate-failure-evidence
          path: |
            tests/.artifacts/reports/ci-deliberate-failure
            tests/.artifacts/resources
          retention-days: 30
          if-no-files-found: error

  security:
    name: Vulnerability reconciliation
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./tests/ci/security-gate.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-evidence
          path: tests/.artifacts/security
          retention-days: 30
          if-no-files-found: error

  deployment:
    name: Product-ready Docker cluster
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Canonical deployment gate
        shell: pwsh
        run: ./tests/ci/deployment-gate.ps1 -Build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-evidence
          path: tests/.artifacts/deployment
          retention-days: 30
          if-no-files-found: error

  native-install:
    name: Native systemd installation
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Native install, upgrade, rollback, backup, restore, and uninstall gate
        shell: pwsh
        run: ./tests/ci/native-install-gate.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-install-evidence
          path: tests/.artifacts/native-install
          retention-days: 30
          if-no-files-found: error

  multinode:
    name: Segmented multi-node topology
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./tests/ci/multihost-gate.ps1 -BuildMode Always -ReportDir tests/.artifacts/reports/multihost
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multihost-evidence
          path: tests/.artifacts/reports/multihost
          retention-days: 30
          if-no-files-found: error

  release-builds:
    name: Independent release build (${{ matrix.rebuild }})
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
    needs: [windows-interface, fast, tagged, failure-contract, security, deployment, native-install, multinode]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        rebuild: [a, b]
    env:
      RELEASE_VERSION: ${{ inputs.release_version || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Build in clean runner and disposable caches
        shell: pwsh
        run: ./ardents.ps1 package $env:RELEASE_VERSION -OutputDir dist/repro
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-repro-${{ matrix.rebuild }}
          path: dist/repro
          retention-days: 1
          if-no-files-found: error

  release-candidate:
    name: Reproducible release candidate
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
    needs: release-builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.release_version || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-repro-a
          path: dist/repro-a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-repro-b
          path: dist/repro-b
      - name: Compare and verify independent builds
        shell: pwsh
        run: |
          $difference = Compare-Object (Get-Content dist/repro-a/SHA256SUMS) (Get-Content dist/repro-b/SHA256SUMS)
          if ($difference) { throw "release artifacts are not reproducible: $($difference | Out-String)" }
          ./scripts/release/verify.ps1 -ArtifactDir dist/repro-a -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA -RequireClean
          ./tests/ci/release-metadata-gate.ps1 -ArtifactDir dist/repro-a -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA
          ./tests/ci/release-images-gate.ps1 -ArtifactDir dist/repro-a -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA
          docker run --rm --mount type=bind,source=${PWD}/dist/repro-a,target=/release,readonly --mount type=bind,source=${PWD},target=/workspace,readonly docker.io/library/debian:bookworm-slim@sha256:63a496b5d3b99214b39f5ed70eb71a61e590a77979c79cbee4faf991f8c0783e /bin/sh /workspace/scripts/release/smoke.sh /release $env:RELEASE_VERSION $env:GITHUB_SHA
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ardents-${{ env.RELEASE_VERSION }}
          path: dist/repro-a
          retention-days: 90
          if-no-files-found: error

  publish-release:
    name: Publish signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ardents-${{ github.ref_name }}
          path: dist/release
      - name: Verify downloaded release payload
        shell: pwsh
        run: ./scripts/release/verify.ps1 -ArtifactDir dist/release -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA -RequireClean
      - name: Attest release provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-checksums: dist/release/ARTIFACTS.sha256
      - name: Attest release SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-checksums: dist/release/ARTIFACTS.sha256
          sbom-path: dist/release/sbom.cdx.json
      - name: Load release images
        shell: pwsh
        run: |
          docker load --input "dist/release/ardents-$env:RELEASE_VERSION-linux-amd64.docker.tar"
          if ($LASTEXITCODE -ne 0) { throw "node release image load failed" }
          docker load --input "dist/release/ardents-ingress-proxy-$env:RELEASE_VERSION-linux-amd64.docker.tar"
          if ($LASTEXITCODE -ne 0) { throw "ingress proxy release image load failed" }
      - name: Generate release node image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ardents/node:${{ env.RELEASE_VERSION }}
          format: cyclonedx-json
          output-file: dist/image-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate release ingress proxy image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ardents/ingress-proxy:${{ env.RELEASE_VERSION }}
          format: cyclonedx-json
          output-file: dist/ingress-proxy-image-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Publish versioned release images
        id: images
        shell: pwsh
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:GHCR_TOKEN | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if ($LASTEXITCODE -ne 0) { throw "GHCR login failed" }
          $candidate = "$env:GITHUB_SHA-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $statePath = "dist/image-publication-state.json"
          $state = [ordered]@{
            schema_version = 1
            version = $env:RELEASE_VERSION
            commit = $env:GITHUB_SHA
            images = [ordered]@{
              node = [ordered]@{ status = "pending" }
              ingress_proxy = [ordered]@{ status = "pending" }
            }
          }
          function Save-PublicationState {
            $state | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 -LiteralPath $statePath
          }
          Save-PublicationState
          try {
            $node = ./scripts/release/publish-image.ps1 -Mode Prepare `
            -LocalImage "ardents/node:$env:RELEASE_VERSION" `
            -RemoteImage "ghcr.io/${{ github.repository_owner }}/ardents-node" -Version $env:RELEASE_VERSION `
            -CandidateIdentity $candidate | ConvertFrom-Json
            $state.images.node = [ordered]@{
              status = "prepared"; name = $node.name; digest = $node.digest; candidate_tag = $node.candidate_tag
            }
            Save-PublicationState

            $proxy = ./scripts/release/publish-image.ps1 -Mode Prepare `
            -LocalImage "ardents/ingress-proxy:$env:RELEASE_VERSION" `
            -RemoteImage "ghcr.io/${{ github.repository_owner }}/ardents-ingress-proxy" -Version $env:RELEASE_VERSION `
            -CandidateIdentity $candidate | ConvertFrom-Json
            $state.images.ingress_proxy = [ordered]@{
              status = "prepared"; name = $proxy.name; digest = $proxy.digest; candidate_tag = $proxy.candidate_tag
            }
            Save-PublicationState

            ./scripts/release/publish-image.ps1 -Mode Promote -RemoteImage $node.name `
              -Version $env:RELEASE_VERSION -ExpectedDigest $node.digest | Out-Null
            $state.images.node.status = "published"
            Save-PublicationState
            ./scripts/release/publish-image.ps1 -Mode Promote -RemoteImage $proxy.name `
              -Version $env:RELEASE_VERSION -ExpectedDigest $proxy.digest | Out-Null
            $state.images.ingress_proxy.status = "published"
            Save-PublicationState

            "node_name=$($node.name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "node_digest=$($node.digest)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "proxy_name=$($proxy.name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "proxy_digest=$($proxy.digest)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } finally {
            Save-PublicationState
          }
      - name: Attest published node image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ${{ steps.images.outputs.node_name }}
          subject-digest: ${{ steps.images.outputs.node_digest }}
          push-to-registry: true
      - name: Attest published node image SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ${{ steps.images.outputs.node_name }}
          subject-digest: ${{ steps.images.outputs.node_digest }}
          sbom-path: dist/image-sbom.cdx.json
          push-to-registry: true
      - name: Attest published ingress proxy image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ${{ steps.images.outputs.proxy_name }}
          subject-digest: ${{ steps.images.outputs.proxy_digest }}
          push-to-registry: true
      - name: Attest published ingress proxy image SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ${{ steps.images.outputs.proxy_name }}
          subject-digest: ${{ steps.images.outputs.proxy_digest }}
          sbom-path: dist/ingress-proxy-image-sbom.cdx.json
          push-to-registry: true
      - name: Remove GHCR write credential
        if: always()
        shell: pwsh
        run: docker logout ghcr.io
      - name: Preserve image publication recovery state
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-publication-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/image-publication-state.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Create published image manifest
        shell: pwsh
        run: |
          $manifest = [ordered]@{
            schema_version = 1
            version = $env:RELEASE_VERSION
            commit = $env:GITHUB_SHA
            images = [ordered]@{
              node = [ordered]@{
                name = "${{ steps.images.outputs.node_name }}"
                digest = "${{ steps.images.outputs.node_digest }}"
              }
              ingress_proxy = [ordered]@{
                name = "${{ steps.images.outputs.proxy_name }}"
                digest = "${{ steps.images.outputs.proxy_digest }}"
                protocol_version = (Get-Content -Raw -LiteralPath "dist/release/release-manifest.json" |
                  ConvertFrom-Json).components.ingress_proxy.protocol_version
                optional = $true
              }
            }
          }
          $path = "dist/release/published-images.json"
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 -LiteralPath $path
          $lines = [Collections.Generic.List[string]]::new()
          $lines.AddRange([string[]](Get-Content -LiteralPath "dist/release/SHA256SUMS"))
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
          $lines.Add("$hash  published-images.json")
          [IO.File]::WriteAllLines("dist/release/SHA256SUMS", @($lines | Sort-Object), [Text.UTF8Encoding]::new($false))
          $imageNamespace = "ghcr.io/${{ github.repository_owner }}".ToLowerInvariant()
          ./scripts/release/verify.ps1 -ArtifactDir dist/release -ExpectedVersion $env:RELEASE_VERSION `
            -ExpectedCommit $env:GITHUB_SHA -RequireClean -RequirePublishedImages `
            -ExpectedImageNamespace $imageNamespace
      - name: Attest published image manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: dist/release/published-images.json
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $artifactDir = (Resolve-Path "dist/release").Path
          $assets = @(Get-ChildItem -LiteralPath $artifactDir -File | Sort-Object Name)
          $assetPaths = @($assets | ForEach-Object FullName)

          function Assert-RemoteRelease([string]$DownloadDir) {
            gh release download $env:RELEASE_VERSION --dir $DownloadDir
            if ($LASTEXITCODE -ne 0) { throw "release asset download failed" }
            $remote = @(Get-ChildItem -LiteralPath $DownloadDir -File | Sort-Object Name)
            $difference = @(Compare-Object @($assets.Name) @($remote.Name))
            if ($difference.Count -ne 0) { throw "published release has a different asset set: $($difference | Out-String)" }
            foreach ($asset in $assets) {
              $localHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset.FullName).Hash
              $remoteHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $DownloadDir $asset.Name)).Hash
              if ($localHash -ne $remoteHash) { throw "published asset differs: $($asset.Name)" }
            }
            $imageNamespace = "ghcr.io/${{ github.repository_owner }}".ToLowerInvariant()
            ./scripts/release/verify.ps1 -ArtifactDir $DownloadDir -ExpectedVersion $env:RELEASE_VERSION `
              -ExpectedCommit $env:GITHUB_SHA -RequireClean -RequirePublishedImages `
              -ExpectedImageNamespace $imageNamespace
          }

          $release = gh release view $env:RELEASE_VERSION --json isDraft,assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_VERSION --verify-tag --draft --title "Ardents $env:RELEASE_VERSION" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "draft release creation failed" }
            $releaseInfo = [pscustomobject]@{ isDraft = $true; assets = @() }
          } else {
            $releaseInfo = $release | ConvertFrom-Json
          }

          $verificationDir = Join-Path ([IO.Path]::GetTempPath()) "ardents-release-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $verificationDir | Out-Null
          try {
            if (-not $releaseInfo.isDraft) {
              Assert-RemoteRelease $verificationDir
              exit 0
            }
            $extraAssets = @($releaseInfo.assets.name | Where-Object { $_ -notin $assets.Name })
            if ($extraAssets.Count -ne 0) { throw "draft release contains unexpected assets: $($extraAssets -join ', ')" }
            gh release upload $env:RELEASE_VERSION $assetPaths --clobber
            if ($LASTEXITCODE -ne 0) { throw "draft release asset upload failed" }
            Assert-RemoteRelease $verificationDir
            gh release edit $env:RELEASE_VERSION --draft=false
            if ($LASTEXITCODE -ne 0) { throw "draft release publication failed" }
          } finally {
            Remove-Item -LiteralPath $verificationDir -Recurse -Force
          }
