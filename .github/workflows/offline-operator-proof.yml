name: Native infrastructure operator workflows
on:
  push:
    branches: [codex/proof-offline-network-artifacts]
permissions:
  contents: read
jobs:
  systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ae65dfcddc0a78ee7e884430a1f1443385337907
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Build exact installed consumer and test
        shell: bash
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ae65dfcddc0a78ee7e884430a1f1443385337907
          git show -s --format='candidate=%H tree=%T'
          go build -trimpath -buildvcs=false -ldflags=-w -o "$RUNNER_TEMP/ardents" ./cmd/ardents-next
          go test -c -tags source_installed_native,forwarding_platform_native,join_platform_native,descriptor_platform_native -o "$RUNNER_TEMP/infrastructure.test" ./cmd/ardents-next
      - name: Run actual installed Source, Forwarding, JOIN and Descriptor
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID:$VERSION_ID:$(uname -m)" = ubuntu:24.04:x86_64
          test "$(systemctl --version | awk 'NR == 1 { print $2 }')" = 255
          test -r /sys/fs/cgroup/cgroup.controllers
          test "$(findmnt -T /var/lib -n -o FSTYPE)" = ext4
          ! getent passwd ardents-source
          ! getent passwd ardents-node
          cd cmd/ardents-next
          for role in Source ForwardingPlatform JoinPlatform DescriptorPlatform; do
            sudo -n env PATH="$PATH" GOTOOLCHAIN=local CGO_ENABLED=0 GOENV=off \
              GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" \
              ARDENTS_PREBUILT_NEXT="$RUNNER_TEMP/ardents" \
              "$RUNNER_TEMP/infrastructure.test" -test.run "^TestNative${role}InstalledLifecycle\$" -test.timeout=3m -test.v |
              tee "$RUNNER_TEMP/${role}.log"
            grep -q "^--- PASS: TestNative${role}InstalledLifecycle " "$RUNNER_TEMP/${role}.log"
          done
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ae65dfcddc0a78ee7e884430a1f1443385337907
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: true
      - name: Build the exact offline command, owner and native test profile
        shell: bash
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ae65dfcddc0a78ee7e884430a1f1443385337907
          git show -s --format='candidate=%H tree=%T'
          go build -trimpath -buildvcs=false -ldflags=-w -o "$RUNNER_TEMP/ardents" ./cmd/ardents-next
          go test -c -tags network_signing_native,network_preparation_native -o "$RUNNER_TEMP/offline-commands.test" ./cmd/ardents-next
          go test -c -tags network_signing_native,network_preparation_native -o "$RUNNER_TEMP/offline-owner.test" ./internal/node/provisioning
      - name: Verify original protected ext4 preparation and signatures
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID:$VERSION_ID:$(uname -m)" = ubuntu:24.04:x86_64
          test "$(findmnt -T / -n -o FSTYPE)" = ext4
          native=$(sudo -n mktemp -d /ardents-network-operator.XXXXXX)
          trap 'sudo -n rmdir "$native"' EXIT
          sudo -n env TMPDIR="$native" PATH="$PATH" GOTOOLCHAIN=local CGO_ENABLED=0 GOENV=off \
            GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" \
            "$RUNNER_TEMP/offline-owner.test" -test.run '^(TestNetworkSigning|TestPublicNetworkPreparationPortable)' -test.timeout=4m -test.v |
            tee "$RUNNER_TEMP/offline-owner.log"
          cd cmd/ardents-next
          sudo -n env TMPDIR="$native" PATH="$PATH" GOTOOLCHAIN=local CGO_ENABLED=0 GOENV=off \
            GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" ARDENTS_PREBUILT_NEXT="$RUNNER_TEMP/ardents" \
            "$RUNNER_TEMP/offline-commands.test" -test.run '^(TestNetworkSigning|TestNetworkPreparation|TestNodePreparePlan)' -test.timeout=6m -test.v |
            tee "$RUNNER_TEMP/offline-commands.log"
          grep -q -- '^--- PASS: TestNetworkSigningCommandsGenuineStateChain ' "$RUNNER_TEMP/offline-commands.log"
          grep -q -- '^--- PASS: TestNetworkSigningNodeCertificateCommand ' "$RUNNER_TEMP/offline-commands.log"
          grep -q -- '^--- PASS: TestNetworkSigningIndependentEpochOrdering ' "$RUNNER_TEMP/offline-owner.log"
