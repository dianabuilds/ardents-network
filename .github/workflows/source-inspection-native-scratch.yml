name: Temporary Source inspection native verification
on:
  push:
    branches: [codex/1046-node-inspection-retirement]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: false
      - name: Verify retained Source lifecycle and causal controls
        shell: bash
        run: |
          set -euo pipefail
          root=/root/ardents-source-inspection
          sudo mkdir -p "$root/ext4"
          cleanup() { sudo umount "$root/ext4" 2>/dev/null || true; }
          trap cleanup EXIT
          sudo truncate -s 3G "$root/ext4.img"
          sudo mkfs.ext4 -q -F "$root/ext4.img"
          sudo mount -t ext4 -o loop "$root/ext4.img" "$root/ext4"
          test "$(sudo findmnt -n -o FSTYPE -T "$root/ext4")" = ext4
          sudo mkdir -p "$root/ext4/tmp"
          mkdir -p "$RUNNER_TEMP/source-go-cache" "$RUNNER_TEMP/source-go-mod"
          export GOTOOLCHAIN=local GOCACHE="$RUNNER_TEMP/source-go-cache" GOMODCACHE="$RUNNER_TEMP/source-go-mod"
          go mod download
          export TMPDIR="$root/ext4/tmp" GOTMPDIR="$root/ext4/tmp"
          env_args=("PATH=$PATH" "GOTOOLCHAIN=$GOTOOLCHAIN" "GOCACHE=$GOCACHE" "GOMODCACHE=$GOMODCACHE" "TMPDIR=$TMPDIR" "GOTMPDIR=$GOTMPDIR")
          sudo env "${env_args[@]}" go test -race -tags network_signing_native ./internal/domain/network/duty ./internal/domain/network/state -run '^TestSourceInspectionNative' -count=1 -v -timeout=4m
          for item in 'duty:users:TestSourceInspectionNativeOriginalReadersAndClose' 'state:uses:TestSourceInspectionNativeCancellationJoinsOriginalClockReader'; do
            package=${item%%:*}; rest=${item#*:}; field=${rest%%:*}; testname=${rest#*:}
            mutation="$RUNNER_TEMP/mutant-$package"
            mkdir -p "$mutation"
            git archive HEAD | tar -x -C "$mutation"
            if [ "$package" = duty ]; then file="$mutation/internal/domain/network/duty/inspection_linux.go"; else file="$mutation/internal/domain/network/state/source_inspection_linux.go"; fi
            python3 - "$file" "$field" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1]); s = p.read_text()
          old = '\ts.' + sys.argv[2] + '.Wait()\n'
          assert s.count(old) == 1
          p.write_text(s.replace(old, ''))
          PY
            set +e
            (cd "$mutation" && sudo env "${env_args[@]}" go test -tags network_signing_native "./internal/domain/network/$package" -run "^${testname}$" -count=1 -v -timeout=3m) > "$RUNNER_TEMP/$package-mutant.log" 2>&1
            status=$?
            set -e
            cat "$RUNNER_TEMP/$package-mutant.log"
            if [ "$status" -eq 0 ] || ! grep -q -- "--- FAIL: $testname" "$RUNNER_TEMP/$package-mutant.log"; then
              echo "Original-reader join mutation was not detected by $testname" >&2
              exit 1
            fi
          done
