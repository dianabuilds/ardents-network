name: Temporary private Permission native verification
on:
  push:
    branches: [codex/1048-private-permission-fs]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: false
      - name: Real ext2 ext3 ext4 tmpfs and mount replacement
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/permission-filesystems"
          mkdir -p "$root"/{ext2,ext3,ext4,tmpfs}
          cleanup() {
            for m in tmpfs ext4 ext3 ext2; do sudo umount "$root/$m" 2>/dev/null || true; done
          }
          trap cleanup EXIT
          for fs in ext2 ext3 ext4; do
            truncate -s 128M "$root/$fs.img"
            "mkfs.$fs" -q -F "$root/$fs.img"
            sudo mount -t "$fs" -o loop "$root/$fs.img" "$root/$fs"
            findmnt -n -o TARGET,FSTYPE -T "$root/$fs"
          done
          sudo mount -t tmpfs -o size=64m tmpfs "$root/tmpfs"
          findmnt -n -o TARGET,FSTYPE -T "$root/tmpfs"
          export ARDENTS_TEST_EXT2="$root/ext2" ARDENTS_TEST_EXT3="$root/ext3" ARDENTS_TEST_EXT4="$root/ext4" ARDENTS_TEST_TMPFS="$root/tmpfs"
          export GOTOOLCHAIN=local GOCACHE="$RUNNER_TEMP/go-cache" GOMODCACHE="$RUNNER_TEMP/go-mod"
          mkdir -p "$GOCACHE" "$GOMODCACHE"
          go mod download
          python3 -c 'from pathlib import Path; p=Path("internal/domain/custody/private_permission_linux.go"); s=p.read_text(); a="if fs.Type == tmpfsFilesystem {"; assert s.count(a)==1; p.write_text(s.replace(a, "if fs.Type == tmpfsFilesystem || fs.Type == extFilesystem {"))'
          set +e
          sudo env "PATH=$PATH" "ARDENTS_TEST_EXT2=$ARDENTS_TEST_EXT2" "ARDENTS_TEST_EXT3=$ARDENTS_TEST_EXT3" "ARDENTS_TEST_EXT4=$ARDENTS_TEST_EXT4" "ARDENTS_TEST_TMPFS=$ARDENTS_TEST_TMPFS" "GOTOOLCHAIN=$GOTOOLCHAIN" "GOCACHE=$GOCACHE" "GOMODCACHE=$GOMODCACHE" go test -tags custody_private_permission_native ./internal/domain/custody -run '^TestPrivatePermissionMountedFilesystems/(ext2|ext3)$' -count=1 -v > "$RUNNER_TEMP/baseline.log" 2>&1
          baseline=$?
          set -e
          cat "$RUNNER_TEMP/baseline.log"
          git checkout -- internal/domain/custody/private_permission_linux.go
          if [ "$baseline" -eq 0 ] || ! grep -q -- '--- FAIL: TestPrivatePermissionMountedFilesystems/ext2' "$RUNNER_TEMP/baseline.log" || ! grep -q -- '--- FAIL: TestPrivatePermissionMountedFilesystems/ext3' "$RUNNER_TEMP/baseline.log"; then
            echo 'Baseline-equivalent control did not demonstrate both expected refusals failing' >&2
            exit 1
          fi
          sudo env "PATH=$PATH" "ARDENTS_TEST_EXT2=$ARDENTS_TEST_EXT2" "ARDENTS_TEST_EXT3=$ARDENTS_TEST_EXT3" "ARDENTS_TEST_EXT4=$ARDENTS_TEST_EXT4" "ARDENTS_TEST_TMPFS=$ARDENTS_TEST_TMPFS" "GOTOOLCHAIN=$GOTOOLCHAIN" "GOCACHE=$GOCACHE" "GOMODCACHE=$GOMODCACHE" make custody-permission-filesystems-check
