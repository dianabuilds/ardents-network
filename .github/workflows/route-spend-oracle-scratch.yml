name: Temporary Route spend oracle verification
on:
  push:
    branches: [codex/1056-route-spend-oracle]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          cache: false
      - name: Hold pending spend in isolated source copies
        shell: bash
        run: |
          set -euo pipefail
          export GOTOOLCHAIN=local GOCACHE="$RUNNER_TEMP/route-build" GOMODCACHE="$RUNNER_TEMP/route-mod"
          mkdir -p "$GOCACHE" "$GOMODCACHE"
          go mod download
          git fetch --depth=1 origin dev
          for variant in legacy fixed; do
            copy="$RUNNER_TEMP/route-$variant"
            mkdir -p "$copy"
            git archive HEAD | tar -x -C "$copy"
            if [ "$variant" = legacy ]; then
              git show FETCH_HEAD:tests/e2e/routeprocess/route_hello_linux_test.go > "$copy/tests/e2e/routeprocess/route_hello_linux_test.go"
            fi
            python3 - "$copy/internal/domain/admission/spending/spend_ledger.go" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1]); s = p.read_text()
          start = s.index('func appendClosedSpendRecord(')
          before, section = s[:start], s[start:]
          marker = '\tif err == nil {\n\t\t_, err = file.WriteAt([]byte{1}, start+closedSpendRecordSize-1)'
          assert section.count(marker) == 1
          section = section.replace(marker, '\tif err == nil { time.Sleep(750 * time.Millisecond) }\n' + marker, 1)
          p.write_text(before + section)
          PY
            set +e
            (cd "$copy" && go test -race ./tests/e2e/routeprocess -run '^TestRouteRejectsInvalidHelloBeforeSpend$' -count=1 -v -timeout=5m) > "$RUNNER_TEMP/$variant.log" 2>&1
            status=$?
            set -e
            cat "$RUNNER_TEMP/$variant.log"
            if [ "$variant" = legacy ]; then
              if [ "$status" -eq 0 ] || ! grep -q 'receiver shutdown changed spent rights' "$RUNNER_TEMP/$variant.log"; then
                echo 'Legacy oracle did not expose the deliberately held pending record' >&2
                exit 1
              fi
            elif [ "$status" -ne 0 ]; then
              echo 'Corrected oracle did not survive the deliberately held pending record' >&2
              exit 1
            fi
          done
