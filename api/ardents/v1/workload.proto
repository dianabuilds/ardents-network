syntax = "proto3";

package ardents.v1;

option go_package = "ardents/internal/localapi/protocol;ardentsv1";

import "api/ardents/v1/types.proto";
service WorkloadService {
  rpc RegisterWorkload(RegisterWorkloadRequest) returns (WorkloadCommandResponse);
  rpc StartWorkload(StartWorkloadRequest) returns (WorkloadCommandResponse);
  rpc StopWorkload(StopWorkloadRequest) returns (WorkloadCommandResponse);
  rpc RestartWorkload(RestartWorkloadRequest) returns (WorkloadCommandResponse);
  rpc GetWorkloadStatus(GetWorkloadStatusRequest) returns (WorkloadStatusSnapshot);
  rpc ListWorkloads(ListWorkloadsRequest) returns (ListWorkloadsResponse);
  rpc GetHostedService(GetHostedServiceRequest) returns (GetHostedServiceResponse);
  rpc ListHostedServices(ListHostedServicesRequest) returns (ListHostedServicesResponse);
  rpc GetServicePublicationStatus(GetServicePublicationStatusRequest) returns (ServicePublicationStatusResponse);
}