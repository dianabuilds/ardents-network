syntax = "proto3";

package ardents.v1;

option go_package = "ardents/internal/localapi/protocol;ardentsv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

message Error {
  string code = 1;
  string category = 2;
  string message = 3;
  string domain = 4;
  bool retryable = 5;
  string operation = 6;
  string reason = 7;
  google.protobuf.Struct details = 8;
}

message OperationStatus {
  string state = 1;
  string reason = 2;
  bool accepted = 3;
}

message CommandAckResponse {
  OperationStatus status = 1;
}

message EventEnvelope {
  int64 seq = 1;
  google.protobuf.Timestamp time = 2;
  string domain = 3;
  string type = 4;
  string resource = 5;
  google.protobuf.Struct payload = 6;
}

message NodeSnapshot {
  string name = 1;
  string state = 2;
  bool ready = 3;
  string reason = 4;
}

message BootSnapshot {
  bool joined = 1;
  string state = 2;
  string reason = 3;
  repeated string source = 4;
}

message PartSnapshot {
  string state = 1;
  string reason = 2;
}

message TransportSnapshot {
  reserved 7, 10;
  reserved "reduced_capabilities", "active_capabilities";

  string profile = 1;
  string health = 2;
  repeated string active_families = 3;
  repeated string suppressed_families = 4;
  string switch_reason = 5;
  bool switch_automatic = 6;
  string recovery_state = 8;
  string mode = 9;
  repeated string reduced_features = 11;
  repeated string active_features = 12;
}

message IdentitySnapshot {
  reserved 3;
  reserved "device";

  string state = 1;
  string principal = 2;
  string public_key = 4;
}

message DiscoverySnapshot {
  string state = 1;
  string reason = 2;
  int32 records = 3;
  string local_node = 4;
  int32 services = 5;
}

message TrustSnapshot {
  string state = 1;
  string outcome = 2;
  string reason = 3;
  bool valid = 4;
  bool trusted = 5;
  bool usable = 6;
}

message WorkloadStateSnapshot {
  string state = 1;
  int32 desired = 2;
  int32 active = 3;
}

message StoreSnapshot {
  int32 authority = 1;
  int32 cached = 2;
  int32 derived = 3;
  int32 pinned = 4;
}

message ReasonSnapshot {
  string code = 1;
  string domain = 2;
  string summary = 3;
  string detail = 4;
  string impact = 5;
  string recovery = 6;
  bool operator_action_required = 7;
  string resource = 8;
}

message SubsystemHealthSnapshot {
  string domain = 1;
  string state = 2;
  ReasonSnapshot reason = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message HealthSnapshot {
  string state = 1;
  ReasonSnapshot primary_reason = 2;
  repeated SubsystemHealthSnapshot subsystems = 3;
  google.protobuf.Timestamp updated_at = 4;
  bool operator_action_required = 5;
}

message OperationSnapshot {
  string id = 1;
  string kind = 2;
  string state = 3;
  string domain = 4;
  string resource = 5;
  string reason = 6;
  bool recoverable = 7;
  string recovery_action = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Timestamp finished_at = 11;
}

message DiagSnapshot {
  HealthSnapshot health = 1;
  repeated EventEnvelope recent_events = 2;
  repeated OperationSnapshot pending_operations = 3;
}

message Snapshot {
  NodeSnapshot node = 1;
  BootSnapshot boot = 2;
  IdentitySnapshot ident = 3;
  TrustSnapshot trust = 4;
  DiscoverySnapshot disco = 5;
  PartSnapshot trans = 6;
  PartSnapshot route = 7;
  PartSnapshot object = 8;
  PartSnapshot blob = 9;
  PartSnapshot policy = 10;
  WorkloadStateSnapshot workload = 11;
  StoreSnapshot store = 12;
  DiagSnapshot diag = 13;
  TransportSnapshot transport = 14;
}

message NodeFeaturesSnapshot {
  string version = 1;
  repeated string services = 2;
  map<string, bool> features = 3;
  string image_reference = 4;
}

message NodeDiscoveryFacts {
  string principal = 1;
  string public_key = 2;
  repeated string endpoints = 3;
}

message ServiceDiscoveryFacts {
  string service_id = 1;
  string service_type = 2;
  string node_principal = 3;
  string workload_id = 4;
  string mode = 5;
  string public_key = 6;
  repeated string endpoints = 7;
}

message DiscoveryRecord {
  reserved 1 to 14;
  reserved "id", "kind", "subject", "node", "device", "owner", "service", "mode", "public_key", "endpoints", "issued_at", "expires_at", "signature", "source";

  uint32 version = 15;
  oneof facts {
    NodeDiscoveryFacts node_facts = 16;
    ServiceDiscoveryFacts service_facts = 17;
  }
  google.protobuf.Timestamp issued_at_v1 = 18;
  google.protobuf.Timestamp expires_at_v1 = 19;
  string signature_v1 = 20;
  string source_v1 = 21;
}

message TransportTarget {
  string subject = 1;
  string service = 2;
  string endpoint = 3;
  string scheme = 4;
  string mode = 5;
  bool trusted = 6;
  bool usable = 7;
  int32 cost = 8;
  int32 privacy = 9;
  int32 reliability = 10;
}

message RouteSnapshot {
  string outcome = 1;
  string reason = 2;
  TransportTarget selected = 3;
  int32 candidates = 4;
  int32 usable = 5;
}

message DiscoveryResult {
  string outcome = 1;
  string source = 2;
  DiscoveryRecord record = 3;
  TrustSnapshot trust = 4;
  repeated TransportTarget candidates = 5;
  RouteSnapshot route = 6;
}

message ServiceResult {
  string service = 1;
  string outcome = 2;
  repeated DiscoveryResult matches = 3;
  RouteSnapshot route = 4;
}

message PublishedServiceSnapshot {
  string id = 1;
  string type = 2;
  string owner = 3;
  string mode = 4;
  bool published = 5;
  repeated string endpoints = 6;
  string reason = 7;
  repeated string probe_endpoints = 8;
}

message WorkloadSpecSnapshot {
  reserved 7;
  reserved "capabilities";
  string id = 1;
  string kind = 2;
  string owner = 3;
  string config = 4;
  string desired = 5;
  repeated PublishedServiceSnapshot services = 6;
  string policy_ref = 8;
  string restart_policy = 9;
  repeated string requirements = 10;
}

message WorkloadInstanceSnapshot {
  string workload_id = 1;
  int64 generation = 2;
  bool running = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  optional int32 exit_code = 6;
  string reason = 7;
}

message WorkloadStatusSnapshot {
  WorkloadSpecSnapshot spec = 1;
  string observed = 2;
  string reason = 3;
  google.protobuf.Timestamp last_transition_at = 4;
  bool needs_operator_action = 5;
  int32 restart_count = 6;
  repeated PublishedServiceSnapshot published_services = 7;
  WorkloadInstanceSnapshot instance = 8;
  bool observation_degraded = 9;
  google.protobuf.Timestamp observed_at = 10;
}

message RefSnapshot {
  string kind = 1;
  string id = 2;
}

message ObjectSnapshot {
  string id = 1;
  string type = 2;
  string owner = 3;
  google.protobuf.Struct body = 4;
  repeated RefSnapshot blob_refs = 5;
  google.protobuf.Timestamp created_at = 6;
}

message BlobSnapshot {
  reserved 1, 6;
  reserved "id", "cid";
  string reference = 14;
  string media_type = 2;
  int64 size = 3;
  bytes payload = 13;
  string hash = 4;
  google.protobuf.Timestamp created_at = 5;
  string cipher = 7;
  string key_id = 8;
  string state = 9;
  string retention = 10;
  bool encrypted = 11;
  google.protobuf.Timestamp expires_at = 12;
}

message ManifestSnapshot {
  string id = 1;
  string kind = 2;
  string owner = 3;
  repeated RefSnapshot refs = 4;
  string access = 5;
  string retention = 6;
  bool encrypted = 7;
  google.protobuf.Struct metadata = 8;
  google.protobuf.Timestamp created_at = 9;
}

message DataInventorySnapshot {
  int32 objects = 1;
  int32 manifests = 2;
  int32 blobs = 3;
  int32 local_blobs = 4;
  int32 remote_blobs = 5;
  int32 retained_temporary = 6;
  int32 relay_retained = 7;
  int32 pinned = 8;
  int32 expired = 9;
  int32 deleted = 10;
  int32 encrypted = 11;
  int32 available_for_resend = 12;
  int64 local_bytes = 13;
  int64 relay_bytes = 14;
}

message ReadinessCheckSnapshot {
  string name = 1;
  bool ready = 2;
  string reason = 3;
}

message ReadinessSnapshot {
  bool ready = 1;
  string reason = 2;
  repeated ReadinessCheckSnapshot checks = 3;
}

message NodeRuntimeSnapshot {
  NodeSnapshot node = 1;
  BootSnapshot boot = 2;
  IdentitySnapshot identity = 3;
  HealthSnapshot health = 4;
  ReadinessSnapshot readiness = 5;
}

message NetworkStatusSnapshot {
  reserved 7, 19;
  reserved "reduced_capabilities", "active_capabilities";

  string state = 1;
  string reason = 2;
  bool joined = 3;
  bool reachable = 4;
  string active_profile = 5;
  string active_mode = 6;
  google.protobuf.Timestamp last_transition_at = 8;
  string privacy_profile = 9;
  string privacy_state = 10;
  string privacy_switch_reason = 11;
  string privacy_recovery_state = 12;
  repeated string privacy_error_categories = 13;
  string node_profile = 14;
  string reachability_mode = 15;
  string reachability_state = 16;
  string reachability_reason = 17;
  google.protobuf.Timestamp reachability_observed_at = 18;
  string abuse_state = 20;
  string abuse_reason = 21;
  uint64 rate_limited_operations = 22;
  uint64 backpressured_operations = 23;
  uint64 oversized_messages = 24;
  int32 banned_providers = 25;
  repeated string reduced_features = 26;
  repeated string active_features = 27;
  bool store_enabled = 28;
  string store_state = 29;
  int32 store_messages = 30;
  int32 store_capacity_messages = 31;
  int64 store_capacity_bytes = 32;
  int64 store_file_bytes = 33;
  double store_usage_ratio = 34;
}

message PeerSnapshot {
  reserved 2;
  reserved "device_id";

  string node_id = 1;
  repeated string addresses = 3;
  TrustSnapshot trust = 4;
  string reachability = 5;
  string source = 6;
  google.protobuf.Timestamp last_seen_at = 7;
  string state = 8;
  string reason = 9;
}

message DiscoveryStatusSnapshot {
  string state = 1;
  string reason = 2;
  int32 local_records = 3;
  int32 remote_records = 4;
  int32 trusted_records = 5;
  int32 rejected_records = 6;
  int32 stale_records = 7;
  google.protobuf.Timestamp last_publish_at = 8;
  google.protobuf.Timestamp last_refresh_at = 9;
}

message LocalPresenceSnapshot {
  bool published = 1;
  string state = 2;
  string reason = 3;
  string record_id = 4;
  google.protobuf.Timestamp published_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  bool operator_action_required = 7;
}

message PublicationStatusSnapshot {
  string state = 1;
  string reason = 2;
  bool published = 3;
  google.protobuf.Timestamp published_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp withdrawn_at = 6;
  bool operator_action_required = 7;
}

message RouteCandidateSnapshot {
  string subject = 1;
  string service = 2;
  string endpoint = 3;
  string scheme = 4;
  string mode = 5;
  bool trusted = 6;
  bool usable = 7;
  int32 cost = 8;
  int32 privacy = 9;
  int32 reliability = 10;
  string state = 11;
  string reason = 12;
}

message ServiceEndpointSnapshot {
  string kind = 1;
  string address = 2;
  string protocol = 3;
  int32 port = 4;
  string exposure = 5;
  bool reachable = 6;
  string reason = 7;
}

message HostedServiceSnapshot {
  string id = 1;
  string type = 2;
  string owner = 3;
  string workload_id = 4;
  string visibility = 5;
  string desired_publication = 6;
  string runtime_backing = 7;
  string policy_ref = 8;
  repeated ServiceEndpointSnapshot endpoints = 9;
  string readiness = 10;
  bool ready = 11;
  bool exposure_eligible = 12;
  int64 generation = 13;
  google.protobuf.Timestamp last_probe_at = 14;
}

message HostedServiceStatusSnapshot {
  string service_id = 1;
  string state = 2;
  string reason = 3;
  bool published = 4;
  string runtime_backing = 5;
  PublicationStatusSnapshot publication = 6;
  google.protobuf.Timestamp last_transition_at = 7;
  bool operator_action_required = 8;
  bool ready = 9;
  bool exposure_eligible = 10;
  int64 generation = 11;
  google.protobuf.Timestamp last_probe_at = 12;
}

message BlobSourceSnapshot {
  reserved 1;
  reserved "blob_id";
  string content_reference = 9;
  string node_id = 2;
  string service_id = 3;
  TrustSnapshot trust = 4;
  bool usable = 5;
  string transport = 6;
  google.protobuf.Timestamp last_seen_at = 7;
  string reason = 8;
}

message TransferSnapshot {
  string id = 1;
  string kind = 2;
  string resource_id = 3;
  string direction = 4;
  string state = 5;
  int64 progress_bytes = 6;
  int64 total_bytes = 7;
  string peer = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Timestamp finished_at = 11;
  string reason = 12;
}

message FailureExplanationSnapshot {
  string scope = 1;
  string resource_id = 2;
  string state = 3;
  ReasonSnapshot reason = 4;
  string impact = 5;
  string recovery = 6;
  repeated string next_steps = 7;
}

message NodeStatusResponse {
  reserved 3;
  reserved "capabilities";

  OperationStatus status = 1;
  Snapshot snapshot = 2;
  NodeFeaturesSnapshot features = 4;
}

message NodeRuntimeResponse {
  OperationStatus status = 1;
  NodeRuntimeSnapshot runtime = 2;
}

message EffectiveConfigurationSnapshot {
  string api_version = 1;
  uint64 active_generation = 2;
  uint64 candidate_generation = 3;
  string fingerprint = 4;
  google.protobuf.Timestamp loaded_at = 5;
  google.protobuf.Struct effective = 6;
  repeated string pending_restart = 7;
  string last_reload_outcome = 8;
  string last_reload_reason = 9;
}

message ConfigurationReloadResult {
  string outcome = 1;
  uint64 active_generation = 2;
  uint64 candidate_generation = 3;
  repeated string restart_required = 4;
  repeated string immutable = 5;
  string reason = 6;
}

message EffectiveConfigurationResponse {
  OperationStatus status = 1;
  EffectiveConfigurationSnapshot configuration = 2;
}

message ReloadConfigurationResponse {
  OperationStatus status = 1;
  ConfigurationReloadResult result = 2;
  EffectiveConfigurationSnapshot configuration = 3;
}

message NodeFeaturesResponse {
  reserved 1;
  reserved "capabilities";

  NodeFeaturesSnapshot features = 2;
}

message NetworkStatusResponse {
  OperationStatus status = 1;
  NetworkStatusSnapshot network = 2;
}

message DiscoveryStatusResponse {
  OperationStatus status = 1;
  DiscoveryStatusSnapshot discovery = 2;
}

message LocalPresenceResponse {
  OperationStatus status = 1;
  LocalPresenceSnapshot presence = 2;
}

message RecordImportResponse {
  OperationStatus status = 1;
}

message WorkloadCommandResponse {
  OperationStatus status = 1;
  WorkloadStatusSnapshot workload = 2;
}

message ListRecordsResponse {
  OperationStatus status = 1;
  repeated DiscoveryRecord records = 2;
}

message ListPeersResponse {
  OperationStatus status = 1;
  repeated PeerSnapshot peers = 2;
}

message ListRouteCandidatesResponse {
  OperationStatus status = 1;
  repeated RouteCandidateSnapshot candidates = 2;
  RouteSnapshot route = 3;
}

message ListWorkloadsResponse {
  repeated WorkloadStatusSnapshot workloads = 1;
}

message GetHostedServiceResponse {
  OperationStatus status = 1;
  HostedServiceStatusSnapshot service = 2;
}

message ListHostedServicesResponse {
  repeated HostedServiceSnapshot services = 1;
}

message ServicePublicationStatusResponse {
  OperationStatus status = 1;
  PublicationStatusSnapshot publication = 2;
}

message ListObjectsResponse {
  repeated ObjectSnapshot objects = 1;
}

message ListBlobsResponse {
  repeated BlobSnapshot blobs = 1;
}

message ListBlobSourcesResponse {
  repeated BlobSourceSnapshot sources = 1;
}

message GetTransferResponse {
  OperationStatus status = 1;
  TransferSnapshot transfer = 2;
}

message ListTransfersResponse {
  repeated TransferSnapshot transfers = 1;
}

message ListManifestsResponse {
  repeated ManifestSnapshot manifests = 1;
}

message DiagnosticsSnapshotResponse {
  OperationStatus status = 1;
  DiagSnapshot diagnostics = 2;
}

message PendingOperationsResponse {
  OperationStatus status = 1;
  repeated OperationSnapshot operations = 2;
}

message HealthSummaryResponse {
  OperationStatus status = 1;
  HealthSnapshot health = 2;
}

message FailureExplanationResponse {
  OperationStatus status = 1;
  FailureExplanationSnapshot explanation = 2;
}

message ListEventsResponse {
  OperationStatus status = 1;
  repeated EventEnvelope events = 2;
  string next_cursor = 3;
}

message StartNodeRequest {
}

message StopNodeRequest {
}

message GetNodeStatusRequest {
}

message GetNodeFeaturesRequest {
}

message GetNodeRuntimeRequest {
}

message GetEffectiveConfigurationRequest {
}

message ReloadConfigurationRequest {
}

message StreamNodeEventsRequest {
}

message ResolveRecordRequest {
  string subject = 2;
  string kind = 3;
}

message ResolveServiceRequest {
  string service = 2;
}

message ListRecordsRequest {
}

message GetNetworkStatusRequest {
}

message GetDiscoveryStatusRequest {
}

message GetLocalPresenceRequest {
}

message ListPeersRequest {
}

message ListRouteCandidatesRequest {
  string resource = 2;
  string subject = 3;
  string kind = 4;
  string service = 5;
}

message ImportRecordRequest {
  DiscoveryRecord record = 2;
}

message RegisterWorkloadRequest {
  WorkloadSpecSnapshot spec = 2;
}

message StartWorkloadRequest {
  string id = 2;
}

message StopWorkloadRequest {
  string id = 2;
}

message RestartWorkloadRequest {
  string id = 2;
}

message GetWorkloadStatusRequest {
  string id = 2;
}

message ListWorkloadsRequest {
}

message GetHostedServiceRequest {
  string id = 2;
}

message ListHostedServicesRequest {
}

message GetServicePublicationStatusRequest {
  string id = 2;
}

message PublishObjectRequest {
  ObjectSnapshot object = 2;
}

message GetObjectRequest {
  string id = 2;
}

message ListObjectsRequest {
}

message PublishBlobRequest {
  BlobSnapshot blob = 2;
}

message GetBlobRequest {
  string id = 2;
}

message FetchBlobRequest {
  string id = 2;
}

message ListBlobsRequest {
}

message ListBlobSourcesRequest {
  string id = 2;
}

message GetTransferRequest {
  string id = 2;
}

message ListTransfersRequest {
}

message PublishManifestRequest {
  ManifestSnapshot manifest = 2;
}

message GetManifestRequest {
  string id = 2;
}

message ListManifestsRequest {
}

message RetainBlobRequest {
  string id = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message PinBlobRequest {
  string id = 2;
}

message DropBlobRequest {
  string id = 2;
}

message GetDataInventoryRequest {
}

message GetDiagnosticsRequest {
}

message GetPendingOperationsRequest {
}

message GetHealthSummaryRequest {
}

message ExplainFailureRequest {
  string scope = 2;
  string resource_id = 3;
}

message ListRecentEventsRequest {
  int32 limit = 2;
  string cursor = 3;
}
