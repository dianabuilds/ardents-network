syntax = "proto3";

package ardents.v1;

option go_package = "ardents/internal/localapi/protocol;ardentsv1";

import "api/ardents/v1/types.proto";
service ContentService {
  rpc PublishObject(PublishObjectRequest) returns (ObjectSnapshot);
  rpc GetObject(GetObjectRequest) returns (ObjectSnapshot);
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);
  rpc PublishBlob(PublishBlobRequest) returns (BlobSnapshot);
  rpc GetBlob(GetBlobRequest) returns (BlobSnapshot);
  rpc ListBlobs(ListBlobsRequest) returns (ListBlobsResponse);
  rpc PublishManifest(PublishManifestRequest) returns (ManifestSnapshot);
  rpc GetManifest(GetManifestRequest) returns (ManifestSnapshot);
  rpc ListManifests(ListManifestsRequest) returns (ListManifestsResponse);
  rpc GetDataInventory(GetDataInventoryRequest) returns (DataInventorySnapshot);
}