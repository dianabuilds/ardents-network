syntax = "proto3";

package ardents.v1;

option go_package = "ardents/internal/localapi/protocol;ardentsv1";

import "api/ardents/v1/types.proto";
service RetentionService {
  rpc RetainBlob(RetainBlobRequest) returns (BlobSnapshot);
  rpc PinBlob(PinBlobRequest) returns (BlobSnapshot);
  rpc DropBlob(DropBlobRequest) returns (BlobSnapshot);
}