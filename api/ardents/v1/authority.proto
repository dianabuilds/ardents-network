syntax = "proto3";

package ardents.v1;

option go_package = "ardents/internal/localapi/protocol;ardentsv1";

import "api/ardents/v1/types.proto";
import "api/ardents/v1/access.proto";
import "google/protobuf/timestamp.proto";

// AuthorityService is available only on the protected Operator Interface.
// The Application Interface deliberately has no equivalent service.
service AuthorityService {
  rpc CreateRealmAuthority(CreateRealmAuthorityRequest) returns (CreateRealmAuthorityResponse) {
    option (operator_access) = {
      action: "realm.authority.create"
      domain: "authority"
      resource_kind: "realm-authority-instance"
      mutating: true
    };
  }
  rpc InspectRealmAuthority(InspectRealmAuthorityRequest) returns (InspectRealmAuthorityResponse) {
    option (operator_access) = {
      action: "realm.channel.audit.read"
      domain: "authority"
      resource_kind: "realm"
    };
  }
  rpc VerifyRestoredAuthority(VerifyRestoredAuthorityRequest) returns (VerifyRestoredAuthorityResponse) {
    option (operator_access) = {
      action: "realm.channel.recovery.execute"
      domain: "authority"
      resource_kind: "realm"
      mutating: true
    };
  }
  rpc InspectChannel(InspectChannelRequest) returns (InspectChannelResponse) {
    option (operator_access) = {
      action: "realm.channel.audit.read"
      domain: "authority"
      resource_kind: "realm-channel"
    };
  }
  rpc IssueInitialGeneration(IssueInitialGenerationRequest) returns (IssueInitialGenerationResponse) {
    option (operator_access) = {
      action: "realm.channel.delivery.issue"
      domain: "authority"
      resource_kind: "realm-channel-delivery"
      mutating: true
    };
  }
  rpc AcknowledgeInitialGeneration(AcknowledgeInitialGenerationRequest) returns (AcknowledgeInitialGenerationResponse) {
    option (operator_access) = {
      action: "realm.channel.delivery.acknowledge"
      domain: "authority"
      resource_kind: "realm-channel-delivery"
      mutating: true
    };
  }
  rpc RotateChannel(RotateChannelRequest) returns (RotateChannelResponse) {
    option (operator_access) = {
      action: "realm.channel.generation.rotate"
      domain: "authority"
      resource_kind: "realm-channel"
      mutating: true
    };
  }
  rpc RenewChannelGrants(RenewChannelGrantsRequest) returns (RotateChannelResponse) {
    option (operator_access) = {
      action: "realm.channel.generation.rotate"
      domain: "authority"
      resource_kind: "realm-channel"
      mutating: true
    };
  }
  rpc CommitChannelActivation(CommitChannelActivationRequest) returns (CommitChannelActivationResponse) {
    option (operator_access) = {
      action: "realm.channel.activation.commit"
      domain: "authority"
      resource_kind: "realm-channel-operation"
      mutating: true
    };
  }
  rpc AcknowledgeChannelActivation(AcknowledgeChannelActivationRequest) returns (AcknowledgeChannelActivationResponse) {
    option (operator_access) = {
      action: "realm.channel.activation.acknowledge"
      domain: "authority"
      resource_kind: "realm-channel-delivery"
      mutating: true
    };
  }
  rpc ChangeChannelMembership(ChangeChannelMembershipRequest) returns (RotateChannelResponse) {
    option (operator_access) = {
      action: "realm.channel.membership.change"
      domain: "authority"
      resource_kind: "realm-channel"
      mutating: true
    };
  }
  rpc SubmitDeploymentFenceEvidence(SubmitDeploymentFenceEvidenceRequest) returns (SubmitDeploymentFenceEvidenceResponse) {
    option (operator_access) = {
      action: "realm.channel.membership.change"
      domain: "authority"
      resource_kind: "realm-channel"
      mutating: true
    };
  }
}

// ChannelDeliveryService is owned by the recipient member Node and is
// available only on its protected Operator Interface.
service ChannelDeliveryService {
  rpc PrepareGenerationDelivery(PrepareGenerationDeliveryRequest) returns (PrepareGenerationDeliveryResponse) {
    option (operator_access) = {
      action: "realm.channel.delivery.prepare"
      domain: "authority"
      resource_kind: "principal"
      mutating: true
    };
  }
  rpc InstallGenerationDelivery(InstallGenerationDeliveryRequest) returns (InstallGenerationDeliveryResponse) {
    option (operator_access) = {
      action: "realm.channel.delivery.install"
      domain: "authority"
      resource_kind: "realm-channel-delivery"
      mutating: true
    };
  }
  rpc ActivateGeneration(ActivateGenerationRequest) returns (ActivateGenerationResponse) {
    option (operator_access) = {
      action: "realm.channel.generation.activate"
      domain: "authority"
      resource_kind: "realm-channel-operation"
      mutating: true
    };
  }
  rpc AdoptAuthorityTransition(AdoptAuthorityTransitionRequest) returns (AuthorityTrustTransitionResponse) {
    option (operator_access) = {
      action: "realm.authority.rotate"
      domain: "authority"
      resource_kind: "realm"
      mutating: true
    };
  }
  rpc FinalizeAuthorityTransition(FinalizeAuthorityTransitionRequest) returns (AuthorityTrustTransitionResponse) {
    option (operator_access) = {
      action: "realm.authority.rotate"
      domain: "authority"
      resource_kind: "realm"
      mutating: true
    };
  }
}

message AdoptAuthorityTransitionRequest {
  uint32 version = 1;
  string realm_id = 2;
  bytes transition_json = 3;
}

message FinalizeAuthorityTransitionRequest {
  uint32 version = 1;
  string realm_id = 2;
  bytes transition_record_json = 3;
}

message AuthorityTrustTransitionResponse {
  OperationStatus status = 1;
}

message CreateRealmAuthorityRequest {
  uint32 version = 1;
  string request_id = 2;
  string realm_class = 3;
}

message InspectRealmAuthorityRequest {
  uint32 version = 1;
  string realm_id = 2;
}

message VerifyRestoredAuthorityRequest {
  uint32 version = 1;
  string realm_id = 2;
  uint64 authority_sequence = 3;
  string checkpoint_digest = 4;
}

message InspectChannelRequest {
  uint32 version = 1;
  string realm_id = 2;
  bytes channel_id = 3;
}

message ChannelStatusSnapshot {
  uint32 version = 1;
  string realm_id = 2;
  string channel_class = 3;
  uint32 current_generation = 4;
  uint32 member_count = 5;
  string readiness = 6;
  string reason = 7;
  google.protobuf.Timestamp grant_not_after = 8;
  google.protobuf.Timestamp renew_by = 9;
  uint32 pending_generation = 10;
}

message AuthorityStatusSnapshot {
  uint32 version = 1;
  uint32 schema_version = 2;
  string realm_id = 3;
  string realm_class = 4;
  uint64 authority_epoch = 5;
  uint64 authority_sequence = 6;
  string checkpoint_digest = 7;
  string phase = 8;
  string readiness = 9;
  string reason = 10;
  uint32 member_count = 11;
  uint32 channel_count = 12;
  uint32 pending_operation_count = 13;
  uint32 audit_outbox_depth = 14;
  uint32 current_generation = 15;
  google.protobuf.Timestamp operation_deadline = 16;
}

message CreateRealmAuthorityResponse {
  OperationStatus status = 1;
  AuthorityStatusSnapshot authority = 2;
  string operation_id = 3;
}

message InspectRealmAuthorityResponse {
  OperationStatus status = 1;
  AuthorityStatusSnapshot authority = 2;
}

message VerifyRestoredAuthorityResponse {
  OperationStatus status = 1;
  AuthorityStatusSnapshot authority = 2;
}

message InspectChannelResponse {
  OperationStatus status = 1;
  ChannelStatusSnapshot channel = 2;
}

message GenerationDeliveryAttestation {
  uint32 version = 1;
  string subject_principal = 2;
  bytes delivery_public_key = 3;
  google.protobuf.Timestamp not_before = 4;
  google.protobuf.Timestamp not_after = 5;
  bytes signature = 6;
  bytes identity_public_key = 7;
}

message GenerationDeliveryBinding {
  uint32 version = 1;
  string realm_id = 2;
  string authority_principal = 3;
  uint64 authority_epoch = 4;
  uint64 authority_sequence = 5;
  string delivery_id = 6;
  bytes channel_id = 7;
  string channel_class = 8;
  uint32 generation = 9;
  string recipient_principal = 10;
  google.protobuf.Timestamp expires_at = 11;
  string delivery_key_digest = 12;
  string operation_id = 13;
}

message SealedGenerationDelivery {
  GenerationDeliveryBinding binding = 1;
  bytes envelope = 2;
  string envelope_digest = 3;
}

message GenerationDeliveryReceipt {
  uint32 version = 1;
  string delivery_id = 2;
  string envelope_digest = 3;
  uint64 authority_sequence = 4;
  bytes channel_id = 5;
  uint32 generation = 6;
  string recipient_principal = 7;
  string phase = 8;
  google.protobuf.Timestamp created_at = 9;
  bytes mac = 10;
  string realm_id = 11;
  string authority_principal = 12;
  uint64 authority_epoch = 13;
  string operation_id = 14;
  string channel_class = 15;
  string delivery_key_digest = 16;
}

message IssueInitialGenerationRequest {
  uint32 version = 1;
  string request_id = 2;
  string realm_id = 3;
  string channel_class = 4;
  uint32 permissions = 5;
  GenerationDeliveryAttestation recipient_attestation = 6;
  uint64 valid_for_seconds = 7;
}

message IssueInitialGenerationResponse {
  OperationStatus status = 1;
  string realm_id = 2;
  string operation_id = 3;
  string delivery_id = 4;
  uint64 authority_sequence = 5;
  bytes channel_id = 6;
  uint32 generation = 7;
  SealedGenerationDelivery sealed = 8;
}

message AcknowledgeInitialGenerationRequest {
  uint32 version = 1;
  string realm_id = 2;
  GenerationDeliveryReceipt receipt = 3;
  string operation_id = 4;
}

message AcknowledgeInitialGenerationResponse {
  OperationStatus status = 1;
  string realm_id = 2;
  string delivery_id = 3;
  uint64 authority_sequence = 4;
  string phase = 5;
}

message PrepareGenerationDeliveryRequest {
  uint32 version = 1;
  string subject_principal = 2;
  uint64 valid_for_seconds = 3;
}

message PrepareGenerationDeliveryResponse {
  OperationStatus status = 1;
  GenerationDeliveryAttestation attestation = 2;
}

message InstallGenerationDeliveryRequest {
  uint32 version = 1;
  SealedGenerationDelivery sealed = 2;
}

message InstallGenerationDeliveryResponse {
  OperationStatus status = 1;
  GenerationDeliveryReceipt receipt = 2;
}

message GenerationActivation {
  uint32 version = 1;
  string realm_id = 2;
  string authority_principal = 3;
  uint64 authority_epoch = 4;
  uint64 authority_sequence = 5;
  string operation_id = 6;
  bytes channel_id = 7;
  string channel_class = 8;
  uint32 previous_generation = 9;
  uint32 generation = 10;
  google.protobuf.Timestamp effective_at = 11;
  google.protobuf.Timestamp drain_deadline = 12;
  string checkpoint_digest = 13;
  bytes signature = 14;
}

message RotationDelivery {
  string delivery_id = 1;
  string recipient_principal = 2;
  SealedGenerationDelivery sealed = 3;
}

message RotateChannelRequest {
  uint32 version = 1;
  string request_id = 2;
  string realm_id = 3;
  bytes channel_id = 4;
  repeated GenerationDeliveryAttestation recipient_attestations = 5;
  uint64 valid_for_seconds = 6;
  uint64 drain_for_seconds = 7;
}

message RenewChannelGrantsRequest {
  uint32 version = 1;
  string request_id = 2;
  string realm_id = 3;
  bytes channel_id = 4;
  repeated GenerationDeliveryAttestation recipient_attestations = 5;
  uint64 drain_for_seconds = 6;
}

message RotateChannelResponse {
  OperationStatus status = 1;
  string realm_id = 2;
  string operation_id = 3;
  uint64 authority_sequence = 4;
  bytes channel_id = 5;
  uint32 previous_generation = 6;
  uint32 pending_generation = 7;
  string phase = 8;
  repeated RotationDelivery deliveries = 9;
  string membership_change = 10;
  string target_principal = 11;
  uint64 membership_version = 12;
  string member_state = 13;
  string channel_class = 14;
  bool renewal = 15;
}

message ChangeChannelMembershipRequest {
  uint32 version = 1;
  string request_id = 2;
  string realm_id = 3;
  bytes channel_id = 4;
  string change = 5;
  string target_principal = 6;
  repeated GenerationDeliveryAttestation recipient_attestations = 7;
  uint64 valid_for_seconds = 8;
  uint64 drain_for_seconds = 9;
}

message DeploymentFenceControl {
  string kind = 1;
  string actor = 2;
  string receipt_digest = 3;
}

message DeploymentFenceEvidence {
  uint32 version = 1;
  string realm_id = 2;
  string operation_id = 3;
  string target_principal = 4;
  string manifest_digest = 5;
  string request_id = 6;
  string reason = 7;
  google.protobuf.Timestamp observed_at = 8;
  int64 clock_skew_seconds = 9;
  repeated DeploymentFenceControl controls = 10;
}

message SubmitDeploymentFenceEvidenceRequest {
  uint32 version = 1;
  string realm_id = 2;
  bytes channel_id = 3;
  string operation_id = 4;
  DeploymentFenceEvidence evidence = 5;
}

message SubmitDeploymentFenceEvidenceResponse {
  OperationStatus status = 1;
  string realm_id = 2;
  string operation_id = 3;
  uint64 authority_sequence = 4;
  string phase = 5;
  string target_principal = 6;
  string evidence_digest = 7;
}

message CommitChannelActivationRequest {
  uint32 version = 1;
  string realm_id = 2;
  string operation_id = 3;
}

message CommitChannelActivationResponse {
  OperationStatus status = 1;
  string realm_id = 2;
  string operation_id = 3;
  uint64 authority_sequence = 4;
  string phase = 5;
  GenerationActivation activation = 6;
}

message ActivateGenerationRequest {
  uint32 version = 1;
  GenerationActivation activation = 2;
}

message ActivateGenerationResponse {
  OperationStatus status = 1;
  GenerationDeliveryReceipt receipt = 2;
}

message AcknowledgeChannelActivationRequest {
  uint32 version = 1;
  string realm_id = 2;
  string operation_id = 3;
  bool approved_host = 4;
  GenerationDeliveryReceipt receipt = 5;
}

message AcknowledgeChannelActivationResponse {
  OperationStatus status = 1;
  string realm_id = 2;
  string operation_id = 3;
  uint64 authority_sequence = 4;
  string phase = 5;
  uint32 current_generation = 6;
  uint32 previous_generation = 7;
  google.protobuf.Timestamp drain_deadline = 8;
}
