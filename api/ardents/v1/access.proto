syntax = "proto3";

package ardents.v1;

option go_package = "ardents/internal/localapi/protocol;ardentsv1";

import "google/protobuf/descriptor.proto";

// OperatorAccess is the protocol-owned admission metadata consumed by the
// protected Operator Interface authorization interceptor.
message OperatorAccess {
  string action = 1;
  string domain = 2;
  string resource_kind = 3;
  bool mutating = 4;
}

extend google.protobuf.MethodOptions {
  OperatorAccess operator_access = 51000;
}
