syntax = "proto3";

package ardents.v1;

option go_package = "ardents/internal/localapi/protocol;ardentsv1";

import "api/ardents/v1/types.proto";
service TransferService {
  rpc FetchBlob(FetchBlobRequest) returns (BlobSnapshot);
  rpc ListBlobSources(ListBlobSourcesRequest) returns (ListBlobSourcesResponse);
  rpc GetTransfer(GetTransferRequest) returns (GetTransferResponse);
  rpc ListTransfers(ListTransfersRequest) returns (ListTransfersResponse);
}