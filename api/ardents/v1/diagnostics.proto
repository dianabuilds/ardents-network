syntax = "proto3";

package ardents.v1;

option go_package = "ardents/internal/localapi/protocol;ardentsv1";

import "api/ardents/v1/types.proto";
service DiagnosticsService {
  rpc GetDiagnostics(GetDiagnosticsRequest) returns (DiagnosticsSnapshotResponse);
  rpc GetPendingOperations(GetPendingOperationsRequest) returns (PendingOperationsResponse);
  rpc GetHealthSummary(GetHealthSummaryRequest) returns (HealthSummaryResponse);
  rpc ExplainFailure(ExplainFailureRequest) returns (FailureExplanationResponse);
  rpc ListRecentEvents(ListRecentEventsRequest) returns (ListEventsResponse);
}