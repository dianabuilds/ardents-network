syntax = "proto3";

package ardents.identity.v1;

import "google/protobuf/timestamp.proto";

option go_package = "ardents/internal/identity/protocol";

enum Interface {
  INTERFACE_UNSPECIFIED = 0;
  INTERFACE_OPERATOR = 1;
  INTERFACE_APPLICATION = 2;
}

enum CredentialPurpose {
  CREDENTIAL_PURPOSE_UNSPECIFIED = 0;
  CREDENTIAL_PURPOSE_AUTHENTICATE = 1;
}

enum ChallengePurpose {
  CHALLENGE_PURPOSE_UNSPECIFIED = 0;
  CHALLENGE_PURPOSE_SESSION = 1;
  CHALLENGE_PURPOSE_ENROLLMENT_PROOF = 2;
}

enum TransportProfile {
  TRANSPORT_PROFILE_UNSPECIFIED = 0;
  TRANSPORT_PROFILE_UNIX_LOCAL_V1 = 1;
}

message Audience {
  string node = 1;
  Interface interface = 2;
  uint32 protocol_major = 3;
}

message AuthenticationBinding {
  Audience audience = 1;
  TransportProfile transport_profile = 2;
  bytes peer_binding = 3;
}

// ChallengeFields is the complete deterministic protobuf signed under exactly
// one purpose-specific domain. It is not an opaque server-selected payload.
message ChallengeFields {
  uint32 version = 1;
  bytes id = 2;
  bytes nonce = 3;
  string principal = 4;
  AuthenticationBinding binding = 5;
  ChallengePurpose purpose = 6;
  google.protobuf.Timestamp issued_at = 7;
  google.protobuf.Timestamp expires_at = 8;
}

message ResourceRef {
  string node = 1;
  string owner = 2;
  string kind = 3;
  string canonical_id = 4;
}

message NodeScope {}
message PrincipalOwnedScope { string owner = 1; }
message ExactScope { ResourceRef resource = 1; }

message ResourceScope {
  oneof scope {
    NodeScope node = 1;
    PrincipalOwnedScope principal_owned = 2;
    ExactScope exact = 3;
  }
}

message KeyCredentialPayload {
  uint32 version = 1;
  string subject = 2;
  bytes root_public_key = 3;
  string device_id = 4;
  bytes device_public_key = 5;
  repeated CredentialPurpose purposes = 6;
  google.protobuf.Timestamp not_before = 7;
  google.protobuf.Timestamp not_after = 8;
}

message KeyCredential {
  string id = 1;
  KeyCredentialPayload payload = 2;
  bytes signature = 3;
}

message AccessGrantPayload {
  uint32 version = 1;
  string issuer = 2;
  string subject = 3;
  Audience audience = 4;
  repeated string actions = 5;
  ResourceScope scope = 6;
  google.protobuf.Timestamp not_before = 7;
  google.protobuf.Timestamp not_after = 8;
}

message AccessGrant {
  string id = 1;
  AccessGrantPayload payload = 2;
  bytes signature = 3;
}

message DelegationPayload {
  uint32 version = 1;
  string delegator = 2;
  string delegatee = 3;
  Audience audience = 4;
  repeated string actions = 5;
  ResourceScope scope = 6;
  google.protobuf.Timestamp not_before = 7;
  google.protobuf.Timestamp not_after = 8;
  KeyCredential credential = 9;
}

message Delegation {
  string id = 1;
  DelegationPayload payload = 2;
  bytes signature = 3;
}

message DeviceRevocationPayload {
  uint32 version = 1;
  string target_id = 2;
  string issuer = 3;
  Audience audience = 4;
  google.protobuf.Timestamp revoked_at = 5;
  string target_device_id = 6;
  string subject = 7;
}

message DeviceRevocation {
  string id = 1;
  DeviceRevocationPayload payload = 2;
  bytes signature = 3;
}

message AccessGrantRevocationPayload {
  uint32 version = 1;
  string target_id = 2;
  string issuer = 3;
  Audience audience = 4;
  google.protobuf.Timestamp revoked_at = 5;
}

message AccessGrantRevocation {
  string id = 1;
  AccessGrantRevocationPayload payload = 2;
  bytes signature = 3;
}

message DelegationRevocationPayload {
  uint32 version = 1;
  string target_id = 2;
  string issuer = 3;
  Audience audience = 4;
  google.protobuf.Timestamp revoked_at = 5;
  string delegator = 6;
  string delegatee = 7;
  KeyCredential credential = 8;
}

message DelegationRevocation {
  string id = 1;
  DelegationRevocationPayload payload = 2;
  bytes signature = 3;
}
