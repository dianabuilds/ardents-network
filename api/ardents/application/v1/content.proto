syntax = "proto3";

package ardents.application.v1;

option go_package = "ardents/sdk/go/protocol/applicationv1;applicationv1";

service ContentService {
  rpc Put(PutContentRequest) returns (PutContentResponse);
  rpc Get(GetContentRequest) returns (GetContentResponse);
}

message ContentReference {
  string kind = 1;
  string id = 2;
}

message PutContentRequest {
  bytes payload = 1;
  string media_type = 2;
}

message PutContentResponse {
  ContentReference reference = 1;
  int64 size = 2;
  string media_type = 3;
}

message GetContentRequest {
  ContentReference reference = 1;
}

message GetContentResponse {
  bytes payload = 1;
  int64 size = 2;
  string media_type = 3;
}
