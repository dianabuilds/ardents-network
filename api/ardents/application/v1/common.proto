syntax = "proto3";

package ardents.application.v1;

option go_package = "ardents/sdk/go/protocol/applicationv1;applicationv1";

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_FORBIDDEN = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_CONFLICT = 5;
  ERROR_CODE_UNAVAILABLE = 6;
  ERROR_CODE_INTEGRITY_FAILED = 7;
  ERROR_CODE_INTERNAL = 8;
  ERROR_CODE_RESOURCE_EXHAUSTED = 9;
}

message ApplicationError {
  ErrorCode code = 1;
  string operation = 2;
  string message = 3;
  bool retryable = 4;
  map<string, string> details = 5;
}
