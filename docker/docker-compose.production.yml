x-production-node: &production_node
  image: ${ARDENTS_IMAGE:?set ARDENTS_IMAGE to an immutable image reference}
  entrypoint: ["/bin/sh", "-ec"]
  command:
    - |
      install -d -m 0700 /run/ardents
      install -m 0600 /run/secrets/ardents-api-token /run/ardents/api-token
      install -m 0600 /run/secrets/capability-store-key /run/ardents/capability-store.key
      install -m 0600 /run/secrets/replay-key /run/ardents/replay.key
      install -d -m 0700 /run/ardents/docker-tls
      install -m 0600 /run/secrets/docker-ca /run/ardents/docker-tls/ca.pem
      install -m 0600 /run/secrets/docker-cert /run/ardents/docker-tls/cert.pem
      install -m 0600 /run/secrets/docker-key /run/ardents/docker-tls/key.pem
      exec /usr/local/bin/ardd
  environment: &production_environment
    ARDENTS_CONFIG_FILE: /run/config/ardents.json
    ARDENTS_API_TOKEN_FILE: /run/ardents/api-token
    DOCKER_HOST: ${ARDENTS_DOCKER_HOST:?TLS Docker workload endpoint is required}
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /run/ardents/docker-tls
  healthcheck:
    test: ["CMD", "ard", "--token-file", "/run/ardents/api-token", "node", "status"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 20s
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:mode=0700,size=64m
    - /run:mode=0755,size=16m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - ardents_private

services:
  seed:
    <<: *production_node
    configs:
      - source: seed_config
        target: /run/config/ardents.json
    secrets:
      - source: seed_api_token
        target: ardents-api-token
        mode: 0400
      - source: seed_capability_store_key
        target: capability-store-key
        mode: 0400
      - source: seed_replay_key
        target: replay-key
        mode: 0400
      - source: seed_docker_ca
        target: docker-ca
        mode: 0400
      - source: seed_docker_cert
        target: docker-cert
        mode: 0400
      - source: seed_docker_key
        target: docker-key
        mode: 0400
    volumes:
      - seed_data:/var/lib/ardents
    ports:
      - "${ARDENTS_SEED_TRANSPORT_PORT:-61001}:61001"

  peer:
    <<: *production_node
    depends_on:
      seed:
        condition: service_healthy
    configs:
      - source: peer_config
        target: /run/config/ardents.json
    secrets:
      - source: peer_api_token
        target: ardents-api-token
        mode: 0400
      - source: peer_capability_store_key
        target: capability-store-key
        mode: 0400
      - source: peer_replay_key
        target: replay-key
        mode: 0400
      - source: peer_docker_ca
        target: docker-ca
        mode: 0400
      - source: peer_docker_cert
        target: docker-cert
        mode: 0400
      - source: peer_docker_key
        target: docker-key
        mode: 0400
    volumes:
      - peer_data:/var/lib/ardents
    ports:
      - "${ARDENTS_PEER_TRANSPORT_PORT:-61002}:61002"

networks:
  ardents_private:
    driver: bridge

volumes:
  seed_data:
  peer_data:

secrets:
  seed_api_token:
    file: ${ARDENTS_SEED_API_TOKEN_FILE:?seed API token file is required}
  peer_api_token:
    file: ${ARDENTS_PEER_API_TOKEN_FILE:?peer API token file is required}
  seed_capability_store_key:
    file: ${ARDENTS_SEED_CAPABILITY_STORE_KEY_FILE:?seed capability-store key file is required}
  seed_replay_key:
    file: ${ARDENTS_SEED_REPLAY_KEY_FILE:?seed replay key file is required}
  peer_capability_store_key:
    file: ${ARDENTS_PEER_CAPABILITY_STORE_KEY_FILE:?peer capability-store key file is required}
  peer_replay_key:
    file: ${ARDENTS_PEER_REPLAY_KEY_FILE:?peer replay key file is required}
  seed_docker_ca:
    file: ${ARDENTS_SEED_DOCKER_CA_FILE:?seed Docker CA file is required}
  seed_docker_cert:
    file: ${ARDENTS_SEED_DOCKER_CERT_FILE:?seed Docker client certificate is required}
  seed_docker_key:
    file: ${ARDENTS_SEED_DOCKER_KEY_FILE:?seed Docker client key is required}
  peer_docker_ca:
    file: ${ARDENTS_PEER_DOCKER_CA_FILE:?peer Docker CA file is required}
  peer_docker_cert:
    file: ${ARDENTS_PEER_DOCKER_CERT_FILE:?peer Docker client certificate is required}
  peer_docker_key:
    file: ${ARDENTS_PEER_DOCKER_KEY_FILE:?peer Docker client key is required}

configs:
  seed_config:
    file: ${ARDENTS_SEED_CONFIG_FILE:?seed operator config file is required}
  peer_config:
    file: ${ARDENTS_PEER_CONFIG_FILE:?peer operator config file is required}
