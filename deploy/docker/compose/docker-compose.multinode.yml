x-node: &node
  image: ${ARDENTS_DOCKER_IMAGE:-ardents/node-local:dev}
  build:
    context: ../../..
    dockerfile: deploy/docker/images/node.Dockerfile
  entrypoint: ["/bin/sh", "-ec"]
  command:
    - |
      install -d -m 0700 /run/ardents
      install -d -m 0750 /var/lib/ardents-applications
      install -m 0600 /var/lib/ardents-secrets/channel-grant-store.key /run/ardents/channel-grant-store.key
      install -m 0600 /var/lib/ardents-secrets/replay.key /run/ardents/replay.key
      install -m 0600 /var/lib/ardents-secrets/operator.json /run/ardents/operator.json
      exec /usr/local/bin/ardentsd
  environment: &node_environment
    ARDENTS_CONFIG_FILE: /run/ardents/operator.json
    ARDENTS_WORKLOAD_EXECUTOR: docker
    DOCKER_HOST: unix:///run/ardents/workload-engine/docker.sock
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9090/readyz"]
    interval: 2s
    timeout: 2s
    retries: 30
    start_period: 5s
  restart: unless-stopped
  networks:
    - ardents

x-operator-cli: &operator_cli
  image: ${ARDENTS_DOCKER_IMAGE:-ardents/node-local:dev}
  build:
    context: ../../..
    dockerfile: deploy/docker/images/node.Dockerfile
  profiles: ["tools"]
  entrypoint: ["/usr/local/bin/ardentsctl"]
  network_mode: none
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]

services:
  realm-provisioner:
    image: ${ARDENTS_DOCKER_IMAGE:-ardents/node-local:dev}
    build:
      context: ../../..
      dockerfile: deploy/docker/images/node.Dockerfile
    profiles: ["provisioning"]
    entrypoint: ["/usr/local/bin/ardentsd", "init"]
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - realm_authority:/authority
      - seed_data:/nodes/seed
      - seed_secrets:/secrets/seed
      - peer2_data:/nodes/peer2
      - peer2_secrets:/secrets/peer2
      - peer3_data:/nodes/peer3
      - peer3_secrets:/secrets/peer3

  workload-engine:
    image: ${ARDENTS_WORKLOAD_ENGINE_IMAGE:-docker:29.6.1-dind}
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--host=unix:///run/workload-engine/docker.sock"]
    healthcheck:
      test: ["CMD", "docker", "-H", "unix:///run/workload-engine/docker.sock", "info"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    volumes:
      - workload_engine_data:/var/lib/docker
      - workload_engine_socket:/run/workload-engine
    networks:
      - ardents

  seed:
    <<: *node
    depends_on:
      workload-engine:
        condition: service_healthy
    environment:
      <<: *node_environment
    volumes:
      - seed_data:/var/lib/ardents
      - seed_secrets:/var/lib/ardents-secrets:ro
      - seed_runtime:/run/ardents
      - seed_application_runtime:/var/lib/ardents-applications
      - workload_engine_socket:/run/ardents/workload-engine
    ports:
      - "127.0.0.1:${ARDENTS_SEED_TRANSPORT_HOST_PORT:-61001}:61001"

  peer2:
    <<: *node
    depends_on:
      workload-engine:
        condition: service_healthy
      seed:
        condition: service_healthy
    environment:
      <<: *node_environment
    volumes:
      - peer2_data:/var/lib/ardents
      - peer2_secrets:/var/lib/ardents-secrets:ro
      - peer2_runtime:/run/ardents
      - peer2_application_runtime:/var/lib/ardents-applications
      - workload_engine_socket:/run/ardents/workload-engine
    ports:
      - "127.0.0.1:${ARDENTS_PEER2_TRANSPORT_HOST_PORT:-61002}:61002"

  peer3:
    <<: *node
    depends_on:
      workload-engine:
        condition: service_healthy
      seed:
        condition: service_healthy
    environment:
      <<: *node_environment
    volumes:
      - peer3_data:/var/lib/ardents
      - peer3_secrets:/var/lib/ardents-secrets:ro
      - peer3_runtime:/run/ardents
      - peer3_application_runtime:/var/lib/ardents-applications
      - workload_engine_socket:/run/ardents/workload-engine
    ports:
      - "127.0.0.1:${ARDENTS_PEER3_TRANSPORT_HOST_PORT:-61003}:61003"

  seed-operator:
    <<: *operator_cli
    volumes:
      - seed_runtime:/run/ardents
      - operator_identity:/operator-identity

  peer2-operator:
    <<: *operator_cli
    volumes:
      - peer2_runtime:/run/ardents
      - operator_identity:/operator-identity

  peer3-operator:
    <<: *operator_cli
    volumes:
      - peer3_runtime:/run/ardents
      - operator_identity:/operator-identity

networks:
  ardents:
    driver: bridge

volumes:
  realm_authority:
  workload_engine_data:
  workload_engine_socket:
  seed_data:
  seed_secrets:
  seed_runtime:
  seed_application_runtime:
  peer2_data:
  peer2_secrets:
  peer2_runtime:
  peer2_application_runtime:
  peer3_data:
  peer3_secrets:
  peer3_runtime:
  peer3_application_runtime:
  operator_identity:
