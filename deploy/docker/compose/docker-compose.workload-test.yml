services:
  engine:
    image: docker:29.6.1-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--host=tcp://0.0.0.0:2375", "--tls=false"]
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - engine-data:/var/lib/docker

  fixture:
    image: docker:29.6.1-cli
    depends_on:
      engine:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://engine:2375
    command:
      - /bin/sh
      - -ec
      - |
        docker pull busybox:1.37.0
        docker image inspect busybox:1.37.0 --format '{{index .RepoDigests 0}}' > /fixture/image.txt
        docker build -t ardents/ingress-proxy:test -f /workspace/deploy/docker/images/workload-ingress-proxy.Dockerfile /workspace
        docker image inspect ardents/ingress-proxy:test --format '{{.Id}}' > /fixture/proxy-image.txt
        touch /fixture/ready
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "test -s /fixture/image.txt && test -s /fixture/proxy-image.txt && test -f /fixture/ready"]
      interval: 1s
      timeout: 1s
      retries: 60
    volumes:
      - fixture:/fixture
      - ../../..:/workspace:ro

  tests:
    build:
      context: ../../..
      dockerfile: deploy/docker/images/test-runner.Dockerfile
    depends_on:
      fixture:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://engine:2375
      ARDENTS_TEST_IMAGE_FILE: /fixture/image.txt
      ARDENTS_TEST_PROXY_IMAGE_FILE: /fixture/proxy-image.txt
    entrypoint: ["go", "test"]
    command:
      - -tags=integration
      - -run
      - TestDockerExecutor
      - -count=1
      - -v
      - ./internal/workload/docker
    volumes:
      - ../../..:/workspace
      - fixture:/fixture:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

volumes:
  engine-data:
  fixture:
  go-mod-cache:
    external: true
    name: ardents-go-mod-cache
  go-build-cache:
    external: true
    name: ardents-go-build-cache
