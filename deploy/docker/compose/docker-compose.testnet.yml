x-node: &node
  image: ${ARDENTS_TESTNET_IMAGE:-ardents/node-testnet:dev}
  build:
    context: ../../..
    dockerfile: deploy/docker/images/node.Dockerfile
  entrypoint: ["/bin/sh", "-ec"]
  command:
    - |
      install -d -m 0700 /run/ardents
      install -d -m 0750 /var/lib/ardents-applications
      install -m 0600 /var/lib/ardents-secrets/channel-grant-store.key /run/ardents/channel-grant-store.key
      install -m 0600 /var/lib/ardents-secrets/replay.key /run/ardents/replay.key
      install -m 0600 /var/lib/ardents-secrets/operator.json /run/ardents/operator.json
      if [ -f /run/secrets/wss-ca ]; then
        cp /run/secrets/wss-ca /usr/local/share/ca-certificates/ardents-test-ca.crt
        update-ca-certificates >/dev/null
      fi
      exec /usr/local/bin/ardentsd
  environment: &node_environment
    ARDENTS_CONFIG_FILE: /run/ardents/operator.json
    ARDENTS_WORKLOAD_EXECUTOR: docker
    DOCKER_HOST: unix:///run/ardents/workload-engine/docker.sock
  depends_on:
    workload-engine:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9090/readyz"]
    interval: 2s
    timeout: 2s
    retries: 30
    start_period: 5s
  restart: unless-stopped

x-operator-cli: &operator_cli
  image: ${ARDENTS_TESTNET_IMAGE:-ardents/node-testnet:dev}
  build:
    context: ../../..
    dockerfile: deploy/docker/images/node.Dockerfile
  profiles: ["tools"]
  entrypoint: ["/usr/local/bin/ardentsctl"]
  network_mode: none
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]

services:
  realm-provisioner:
    image: ${ARDENTS_TESTNET_IMAGE:-ardents/node-testnet:dev}
    build:
      context: ../../..
      dockerfile: deploy/docker/images/node.Dockerfile
    profiles: ["provisioning"]
    entrypoint: ["/usr/local/bin/ardentsd", "init"]
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - realm_authority:/authority
      - seed_data:/nodes/seed
      - seed_secrets:/secrets/seed
      - bridge_data:/nodes/bridge
      - bridge_secrets:/secrets/bridge
      - a1_data:/nodes/a1
      - a1_secrets:/secrets/a1
      - a2_data:/nodes/a2
      - a2_secrets:/secrets/a2
      - b1_data:/nodes/b1
      - b1_secrets:/secrets/b1
      - b2_data:/nodes/b2
      - b2_secrets:/secrets/b2
      - recovery_data:/nodes/recovery
      - recovery_secrets:/secrets/recovery

  workload-engine:
    image: ${ARDENTS_WORKLOAD_ENGINE_IMAGE:-docker:29.6.1-dind}
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--host=unix:///run/workload-engine/docker.sock"]
    healthcheck:
      test: ["CMD", "docker", "-H", "unix:///run/workload-engine/docker.sock", "info"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    volumes:
      - workload_engine_data:/var/lib/docker
      - workload_engine_socket:/run/workload-engine
    networks:
      - zone_a

  seed:
    <<: *node
    environment:
      <<: *node_environment
    secrets:
      - source: wss_ca
        target: wss-ca
        mode: 0444
    volumes:
      - seed_data:/var/lib/ardents
      - seed_secrets:/var/lib/ardents-secrets:ro
      - seed_runtime:/run/ardents
      - seed_application_runtime:/var/lib/ardents-applications
      - workload_engine_socket:/run/ardents/workload-engine
    networks:
      zone_a:
        ipv4_address: 172.31.10.10
      zone_b:
        ipv4_address: 172.31.20.10

  bridge:
    <<: *node
    environment:
      <<: *node_environment
    secrets:
      - source: wss_ca
        target: wss-ca
        mode: 0444
      - source: bridge_cert
        target: wss-cert
        mode: 0444
      - source: bridge_key
        target: wss-key
        mode: 0400
    volumes:
      - bridge_data:/var/lib/ardents
      - bridge_secrets:/var/lib/ardents-secrets:ro
      - bridge_runtime:/run/ardents
      - bridge_application_runtime:/var/lib/ardents-applications
      - workload_engine_socket:/run/ardents/workload-engine
    networks:
      zone_a:
        ipv4_address: 172.31.10.20
      zone_b:
        ipv4_address: 172.31.20.20

  a1:
    <<: *node
    environment:
      <<: *node_environment
    secrets:
      - source: wss_ca
        target: wss-ca
        mode: 0444
    volumes:
      - a1_data:/var/lib/ardents
      - a1_secrets:/var/lib/ardents-secrets:ro
      - a1_runtime:/run/ardents
      - a1_application_runtime:/var/lib/ardents-applications
      - workload_engine_socket:/run/ardents/workload-engine
    networks:
      zone_a:
        ipv4_address: 172.31.10.11

  a2:
    <<: *node
    environment:
      <<: *node_environment
    secrets:
      - source: wss_ca
        target: wss-ca
        mode: 0444
    volumes:
      - a2_data:/var/lib/ardents
      - a2_secrets:/var/lib/ardents-secrets:ro
      - a2_runtime:/run/ardents
      - a2_application_runtime:/var/lib/ardents-applications
      - workload_engine_socket:/run/ardents/workload-engine
    networks:
      zone_a:
        ipv4_address: ${ARDENTS_A2_IP:-172.31.10.12}

  b1:
    <<: *node
    environment:
      <<: *node_environment
    secrets:
      - source: wss_ca
        target: wss-ca
        mode: 0444
    volumes:
      - b1_data:/var/lib/ardents
      - b1_secrets:/var/lib/ardents-secrets:ro
      - b1_runtime:/run/ardents
      - b1_application_runtime:/var/lib/ardents-applications
      - workload_engine_socket:/run/ardents/workload-engine
    networks:
      zone_b:
        ipv4_address: 172.31.20.11

  b2:
    <<: *node
    environment:
      <<: *node_environment
    secrets:
      - source: wss_ca
        target: wss-ca
        mode: 0444
      - source: b2_cert
        target: wss-cert
        mode: 0444
      - source: b2_key
        target: wss-key
        mode: 0400
    volumes:
      - b2_data:/var/lib/ardents
      - b2_secrets:/var/lib/ardents-secrets:ro
      - b2_runtime:/run/ardents
      - b2_application_runtime:/var/lib/ardents-applications
      - workload_engine_socket:/run/ardents/workload-engine
    networks:
      zone_b:
        ipv4_address: 172.31.20.12

  recovery:
    <<: *node
    environment:
      <<: *node_environment
    secrets:
      - source: wss_ca
        target: wss-ca
        mode: 0444
    volumes:
      - recovery_data:/var/lib/ardents
      - recovery_secrets:/var/lib/ardents-secrets:ro
      - recovery_runtime:/run/ardents
      - recovery_application_runtime:/var/lib/ardents-applications
      - workload_engine_socket:/run/ardents/workload-engine
    networks:
      zone_a:
        ipv4_address: 172.31.10.13

  seed-operator:
    <<: *operator_cli
    volumes:
      - seed_runtime:/run/ardents
      - operator_identity:/operator-identity

  bridge-operator:
    <<: *operator_cli
    volumes:
      - bridge_runtime:/run/ardents
      - operator_identity:/operator-identity

  a1-operator:
    <<: *operator_cli
    volumes:
      - a1_runtime:/run/ardents
      - operator_identity:/operator-identity

  a2-operator:
    <<: *operator_cli
    volumes:
      - a2_runtime:/run/ardents
      - operator_identity:/operator-identity

  b1-operator:
    <<: *operator_cli
    volumes:
      - b1_runtime:/run/ardents
      - operator_identity:/operator-identity

  b2-operator:
    <<: *operator_cli
    volumes:
      - b2_runtime:/run/ardents
      - operator_identity:/operator-identity

  recovery-operator:
    <<: *operator_cli
    volumes:
      - recovery_runtime:/run/ardents
      - operator_identity:/operator-identity

networks:
  zone_a:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.10.0/24
  zone_b:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.20.0/24

volumes:
  realm_authority:
  workload_engine_data:
  workload_engine_socket:
  operator_identity:
  seed_data:
  seed_secrets:
  seed_runtime:
  seed_application_runtime:
  bridge_data:
  bridge_secrets:
  bridge_runtime:
  bridge_application_runtime:
  a1_data:
  a1_secrets:
  a1_runtime:
  a1_application_runtime:
  a2_data:
  a2_secrets:
  a2_runtime:
  a2_application_runtime:
  b1_data:
  b1_secrets:
  b1_runtime:
  b1_application_runtime:
  b2_data:
  b2_secrets:
  b2_runtime:
  b2_application_runtime:
  recovery_data:
  recovery_secrets:
  recovery_runtime:
  recovery_application_runtime:

secrets:
  wss_ca:
    file: ${ARDENTS_WSS_CA_FILE:?WSS CA file is required}
  bridge_cert:
    file: ${ARDENTS_BRIDGE_CERT_FILE:?bridge certificate is required}
  bridge_key:
    file: ${ARDENTS_BRIDGE_KEY_FILE:?bridge key is required}
  b2_cert:
    file: ${ARDENTS_B2_CERT_FILE:?b2 certificate is required}
  b2_key:
    file: ${ARDENTS_B2_KEY_FILE:?b2 key is required}
