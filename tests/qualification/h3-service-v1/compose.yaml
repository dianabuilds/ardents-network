x-route-process: &route-process
  image: ${ARDENTS_SERVICE_IMAGE_TAG:?}
  pull_policy: never
  read_only: true
  restart: "no"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  user: "${ARDENTS_SERVICE_RUNTIME_USER:?}"
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=8m"]
  cpus: 0.5
  mem_limit: 128m
  pids_limit: 32

x-route: &route
  <<: *route-process
  networks: [route_net]

x-local: &local
  image: ${ARDENTS_SERVICE_IMAGE_TAG:?}
  pull_policy: never
  read_only: true
  restart: "no"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  user: "65532:65532"
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=8m"]
  cpus: 0.5
  mem_limit: 128m
  pids_limit: 32
  network_mode: none

x-build: &build
  build:
    context: ${ARDENTS_SERVICE_BUILD_CONTEXT:-../../..}
    dockerfile: tests/qualification/h3-service-v1/Dockerfile
    args: {ARDENTS_SOURCE_COMMIT: "${ARDENTS_SERVICE_SOURCE_COMMIT:?}"}

services:
  volume-init:
    <<: [*local, *build]
    profiles: [setup]
    user: "0:0"
    cap_add: [CHOWN, FOWNER]
    command: [/usr/local/bin/ardents-service-volume-init, "${ARDENTS_SERVICE_RUNTIME_USER:?}", /run/ardents/publisher-app, /run/ardents/publisher-route, /run/ardents/client-app, /run/ardents/client-route, /run/ardents/admin, /run/ardents/publication, /run/ardents/introduction-ack, /run/ardents/recovery-introduction-user, /run/ardents/recovery-introduction-service, /run/ardents/lifecycle]
    volumes:
      - publisher_app:/run/ardents/publisher-app
      - publisher_route:/run/ardents/publisher-route
      - client_app:/run/ardents/client-app
      - client_route:/run/ardents/client-route
      - administration:/run/ardents/admin
      - publication:/run/ardents/publication
      - introduction_ack:/run/ardents/introduction-ack
      - recovery_introduction_user:/run/ardents/recovery-introduction-user
      - recovery_introduction_service:/run/ardents/recovery-introduction-service
      - lifecycle:/run/ardents/lifecycle
  publisher-endpoint:
    <<: [*local, *build]
    command: [/usr/local/bin/ardents-service, run, /run/ardents/plan.json]
    volumes:
      - {type: bind, source: "${ARDENTS_SERVICE_GENERATION:?}/publisher.json", target: /run/ardents/plan.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_SERVICE_GENERATION:?}/credential.json", target: /run/ardents/service/credential.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_SERVICE_GENERATION:?}/instance.hex", target: /run/ardents/service/instance.hex, read_only: true, bind: {create_host_path: false}}
      - publisher_app:/run/ardents/publisher-app
      - publisher_route:/run/ardents/publisher-route
      - administration:/run/ardents/admin
      - publication:/run/ardents/publication
      - introduction_ack:/run/ardents/introduction-ack
      - lifecycle:/run/ardents/lifecycle
  publication-operator:
    <<: *local
    command: [/usr/local/bin/ardents-publish-app, publish, /run/ardents/admin/admin.sock]
    volumes: [administration:/run/ardents/admin]
  publisher-app:
    <<: *local
    command: [/usr/local/bin/ardents-stream-app, run, publisher, /run/ardents/publisher-app/app.sock, /run/ardents/workload/publisher.hex, /run/ardents/workload/client.hex, "${ARDENTS_PUBLISHER_SEND_BYTES:-65536}", "${ARDENTS_PUBLISHER_RECEIVE_BYTES:-65536}"]
    environment: {ARDENTS_STREAM_CHUNK_DELAY: "${ARDENTS_STREAM_CHUNK_DELAY:-}", ARDENTS_STREAM_PROGRESS: "${ARDENTS_STREAM_PROGRESS:-}", ARDENTS_STREAM_GATE_OFFSET: "${ARDENTS_STREAM_GATE_OFFSET:-}", ARDENTS_STREAM_GATE_OFFSETS: "${ARDENTS_STREAM_GATE_OFFSETS:-}", ARDENTS_STREAM_GATE_ROOT: "${ARDENTS_STREAM_GATE_ROOT:-}", ARDENTS_STREAM_LIFETIME: "${ARDENTS_STREAM_LIFETIME:-}", ARDENTS_STREAM_START_GATE: "${ARDENTS_STREAM_START_GATE:-}"}
    volumes:
      - publisher_app:/run/ardents/publisher-app
      - {type: bind, source: "${ARDENTS_SERVICE_GENERATION:?}/publisher-seed.hex", target: /run/ardents/workload/publisher.hex, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_SERVICE_GENERATION:?}/client-seed.hex", target: /run/ardents/workload/client.hex, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_RECOVERY_GATE_HOST:?}", target: /run/ardents/gate, bind: {create_host_path: false}}
  client-endpoint:
    <<: *local
    command: [/usr/local/bin/ardents-service, run, /run/ardents/plan.json]
    volumes:
      - {type: bind, source: "${ARDENTS_SERVICE_GENERATION:?}/client.json", target: /run/ardents/plan.json, read_only: true, bind: {create_host_path: false}}
      - client_app:/run/ardents/client-app
      - client_route:/run/ardents/client-route
      - publication:/run/ardents/publication:ro
  client-app:
    <<: *local
    command: [/usr/local/bin/ardents-stream-app, run, client, /run/ardents/client-app/app.sock, /run/ardents/workload/client.hex, /run/ardents/workload/publisher.hex, "${ARDENTS_CLIENT_SEND_BYTES:-65536}", "${ARDENTS_CLIENT_RECEIVE_BYTES:-65536}"]
    environment: {ARDENTS_STREAM_CHUNK_DELAY: "${ARDENTS_STREAM_CHUNK_DELAY:-}", ARDENTS_STREAM_PROGRESS: "${ARDENTS_STREAM_PROGRESS:-}", ARDENTS_STREAM_GATE_OFFSET: "${ARDENTS_STREAM_GATE_OFFSET:-}", ARDENTS_STREAM_GATE_OFFSETS: "${ARDENTS_STREAM_GATE_OFFSETS:-}", ARDENTS_STREAM_GATE_ROOT: "${ARDENTS_STREAM_GATE_ROOT:-}", ARDENTS_STREAM_LIFETIME: "${ARDENTS_STREAM_LIFETIME:-}", ARDENTS_STREAM_START_GATE: "${ARDENTS_STREAM_START_GATE:-}"}
    volumes:
      - client_app:/run/ardents/client-app
      - {type: bind, source: "${ARDENTS_SERVICE_GENERATION:?}/client-seed.hex", target: /run/ardents/workload/client.hex, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_SERVICE_GENERATION:?}/publisher-seed.hex", target: /run/ardents/workload/publisher.hex, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_RECOVERY_GATE_HOST:?}", target: /run/ardents/gate, bind: {create_host_path: false}}
  hostile-sibling:
    <<: *local
    command: [/usr/local/bin/ardents-publish-app, publish, /run/ardents/not-granted/app.sock]
  negative-suite:
    <<: *local
    profiles: [negative]
    command: [/usr/local/bin/ardents-service-negative]

  direct-client-anchor:
    <<: *route
    profiles: [s43-direct]
    command: [/usr/local/bin/ardents-qualify, carrier-fault, wait]
    networks: {route_net: {ipv4_address: 172.31.20.10}}
  direct-publisher-anchor:
    <<: *route
    profiles: [s43-direct]
    command: [/usr/local/bin/ardents-qualify, carrier-fault, wait]
    networks: {route_net: {ipv4_address: 172.31.20.16}}
  direct-client:
    <<: *local
    profiles: [s43-direct]
    network_mode: service:direct-client-anchor
    command: [/usr/local/bin/ardents-stream-app, direct, connect, "${ARDENTS_DIRECT_CLIENT_FLOW:-send}", 172.31.20.16:4700, /run/ardents/direct-seed.hex, "268435456"]
    environment: {ARDENTS_STREAM_START_GATE: "1", ARDENTS_STREAM_GATE_ROOT: /run/ardents/gate}
    volumes:
      - {type: bind, source: "${ARDENTS_SERVICE_GENERATION:?}/${ARDENTS_DIRECT_SEED_NAME:-client-seed.hex}", target: /run/ardents/direct-seed.hex, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_RECOVERY_GATE_HOST:?}", target: /run/ardents/gate, bind: {create_host_path: false}}
  direct-publisher:
    <<: *local
    profiles: [s43-direct]
    network_mode: service:direct-publisher-anchor
    command: [/usr/local/bin/ardents-stream-app, direct, listen, "${ARDENTS_DIRECT_PUBLISHER_FLOW:-receive}", 0.0.0.0:4700, /run/ardents/direct-seed.hex, "268435456"]
    environment: {ARDENTS_STREAM_START_GATE: "1", ARDENTS_STREAM_GATE_ROOT: /run/ardents/gate}
    volumes:
      - {type: bind, source: "${ARDENTS_SERVICE_GENERATION:?}/${ARDENTS_DIRECT_SEED_NAME:-client-seed.hex}", target: /run/ardents/direct-seed.hex, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_RECOVERY_GATE_HOST:?}", target: /run/ardents/gate, bind: {create_host_path: false}}
  direct-shape-client:
    image: ${ARDENTS_S43_TOOL_IMAGE:-invalid}
    profiles: [s43-direct]
    pull_policy: never
    read_only: true
    restart: "no"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    user: "0:0"
    network_mode: service:direct-client-anchor
    cpus: 0.25
    mem_limit: 32m
    pids_limit: 16
    command: [native-tool-role, /config/config.json, /evidence, /capture]
    volumes:
      - {type: bind, source: "${ARDENTS_S43_SHAPER_ROOT:-.}/client/config", target: /config, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_S43_SHAPER_ROOT:-.}/client/evidence", target: /evidence, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_S43_SHAPER_ROOT:-.}/client/capture", target: /capture, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_S43_SHAPER_ROOT:-.}/client/control", target: /control, bind: {create_host_path: false}}
  direct-shape-publisher:
    <<: *local
    image: ${ARDENTS_S43_TOOL_IMAGE:-invalid}
    profiles: [s43-direct]
    pull_policy: never
    cap_add: [NET_ADMIN]
    user: "0:0"
    network_mode: service:direct-publisher-anchor
    cpus: 0.25
    mem_limit: 32m
    pids_limit: 16
    command: [native-tool-role, /config/config.json, /evidence, /capture]
    volumes:
      - {type: bind, source: "${ARDENTS_S43_SHAPER_ROOT:-.}/publisher/config", target: /config, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_S43_SHAPER_ROOT:-.}/publisher/evidence", target: /evidence, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_S43_SHAPER_ROOT:-.}/publisher/capture", target: /capture, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_S43_SHAPER_ROOT:-.}/publisher/control", target: /control, bind: {create_host_path: false}}

  publisher:
    <<: *route
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plan.json]
    volumes:
      - {type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/plans/publisher.json", target: /run/ardents/plan.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/secrets/publisher", target: /run/ardents/secrets, read_only: true, bind: {create_host_path: false}}
      - publisher_route:/run/ardents/publisher-route
      - recovery_introduction_service:/run/ardents/recovery-introduction-service
    networks: {route_net: {ipv4_address: 172.31.20.16}}
  responder:
    <<: *route
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plan.json]
    volumes: [{type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/plans/responder.json", target: /run/ardents/plan.json, read_only: true, bind: {create_host_path: false}}, {type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/secrets/responder", target: /run/ardents/secrets, read_only: true, bind: {create_host_path: false}}]
    networks: {route_net: {ipv4_address: 172.31.20.14}, carrier_net: {ipv4_address: 172.31.21.14}}
  carrier-fault:
    image: ${ARDENTS_SERVICE_IMAGE_TAG:?}
    pull_policy: never
    read_only: true
    restart: "no"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    user: "0:0"
    network_mode: service:rendezvous
    cpus: 0.25
    mem_limit: 32m
    pids_limit: 16
    command: [/usr/local/bin/ardents-qualify, carrier-fault, wait]
  candidate-shape-client:
    image: ${ARDENTS_S43_TOOL_IMAGE:-invalid}
    profiles: [s43-candidate]
    pull_policy: never
    read_only: true
    restart: "no"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    user: "0:0"
    network_mode: service:client
    cpus: 0.25
    mem_limit: 32m
    pids_limit: 16
    command: [native-tool-role, /config/config.json, /evidence, /capture]
    volumes:
      - {type: bind, source: "${ARDENTS_S43_SHAPER_ROOT:-.}/client/config", target: /config, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_S43_SHAPER_ROOT:-.}/client/evidence", target: /evidence, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_S43_SHAPER_ROOT:-.}/client/capture", target: /capture, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_S43_SHAPER_ROOT:-.}/client/control", target: /control, bind: {create_host_path: false}}
  candidate-shape-publisher:
    image: ${ARDENTS_S43_TOOL_IMAGE:-invalid}
    profiles: [s43-candidate]
    pull_policy: never
    read_only: true
    restart: "no"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    user: "0:0"
    network_mode: service:publisher
    cpus: 0.25
    mem_limit: 32m
    pids_limit: 16
    command: [native-tool-role, /config/config.json, /evidence, /capture]
    volumes:
      - {type: bind, source: "${ARDENTS_S43_SHAPER_ROOT:-.}/publisher/config", target: /config, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_S43_SHAPER_ROOT:-.}/publisher/evidence", target: /evidence, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_S43_SHAPER_ROOT:-.}/publisher/capture", target: /capture, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_S43_SHAPER_ROOT:-.}/publisher/control", target: /control, bind: {create_host_path: false}}
  rendezvous:
    <<: *route
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plan.json]
    volumes: [{type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/plans/rendezvous.json", target: /run/ardents/plan.json, read_only: true, bind: {create_host_path: false}}, {type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/secrets/rendezvous", target: /run/ardents/secrets, read_only: true, bind: {create_host_path: false}}]
    networks: {route_net: {ipv4_address: 172.31.20.13}, carrier_net: {ipv4_address: 172.31.21.13}}
  introduction:
    <<: *route
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plan.json]
    volumes: [{type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/plans/introduction.json", target: /run/ardents/plan.json, read_only: true, bind: {create_host_path: false}}, {type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/secrets/introduction", target: /run/ardents/secrets, read_only: true, bind: {create_host_path: false}}, introduction_ack:/run/ardents/introduction-ack]
    networks: {route_net: {ipv4_address: 172.31.20.12}}
  initiator:
    <<: *route
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plan.json]
    volumes: [{type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/plans/initiator.json", target: /run/ardents/plan.json, read_only: true, bind: {create_host_path: false}}, {type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/secrets/initiator", target: /run/ardents/secrets, read_only: true, bind: {create_host_path: false}}]
    networks: {route_net: {ipv4_address: 172.31.20.11}}
  initiator-2:
    <<: *route
    profiles: [s42]
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plan.json]
    volumes: [{type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/plans/initiator-2.json", target: /run/ardents/plan.json, read_only: true, bind: {create_host_path: false}}, {type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/secrets/initiator-2", target: /run/ardents/secrets, read_only: true, bind: {create_host_path: false}}]
    networks: {route_net: {ipv4_address: 172.31.20.21}}
  initiator-3:
    <<: *route
    profiles: [s42]
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plan.json]
    volumes: [{type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/plans/initiator-3.json", target: /run/ardents/plan.json, read_only: true, bind: {create_host_path: false}}, {type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/secrets/initiator-3", target: /run/ardents/secrets, read_only: true, bind: {create_host_path: false}}]
    networks: {route_net: {ipv4_address: 172.31.20.31}}
  introduction-2:
    <<: *route
    profiles: [s42]
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plan.json]
    volumes: [{type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/plans/introduction-2.json", target: /run/ardents/plan.json, read_only: true, bind: {create_host_path: false}}, {type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/secrets/introduction-2", target: /run/ardents/secrets, read_only: true, bind: {create_host_path: false}}]
    networks: {route_net: {ipv4_address: 172.31.20.22}}
  introduction-3:
    <<: *route
    profiles: [s42]
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plan.json]
    volumes: [{type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/plans/introduction-3.json", target: /run/ardents/plan.json, read_only: true, bind: {create_host_path: false}}, {type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/secrets/introduction-3", target: /run/ardents/secrets, read_only: true, bind: {create_host_path: false}}, recovery_introduction_user:/run/ardents/recovery-introduction-user, recovery_introduction_service:/run/ardents/recovery-introduction-service]
    networks: {route_net: {ipv4_address: 172.31.20.32}}
  rendezvous-2:
    <<: *route
    profiles: [s42]
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plan.json]
    volumes: [{type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/plans/rendezvous-2.json", target: /run/ardents/plan.json, read_only: true, bind: {create_host_path: false}}, {type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/secrets/rendezvous-2", target: /run/ardents/secrets, read_only: true, bind: {create_host_path: false}}]
    networks: {route_net: {ipv4_address: 172.31.20.23}}
  rendezvous-3:
    <<: *route
    profiles: [s42]
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plan.json]
    volumes: [{type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/plans/rendezvous-3.json", target: /run/ardents/plan.json, read_only: true, bind: {create_host_path: false}}, {type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/secrets/rendezvous-3", target: /run/ardents/secrets, read_only: true, bind: {create_host_path: false}}]
    networks: {route_net: {ipv4_address: 172.31.20.33}}
  responder-2:
    <<: *route
    profiles: [s42]
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plan.json]
    volumes: [{type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/plans/responder-2.json", target: /run/ardents/plan.json, read_only: true, bind: {create_host_path: false}}, {type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/secrets/responder-2", target: /run/ardents/secrets, read_only: true, bind: {create_host_path: false}}]
    networks: {route_net: {ipv4_address: 172.31.20.24}}
  responder-3:
    <<: *route
    profiles: [s42]
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plan.json]
    volumes: [{type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/plans/responder-3.json", target: /run/ardents/plan.json, read_only: true, bind: {create_host_path: false}}, {type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/secrets/responder-3", target: /run/ardents/secrets, read_only: true, bind: {create_host_path: false}}]
    networks: {route_net: {ipv4_address: 172.31.20.34}}
  client:
    <<: *route
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plan.json]
    volumes:
      - {type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/plans/client.json", target: /run/ardents/plan.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/secrets/client", target: /run/ardents/secrets, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${ARDENTS_SERVICE_ROUTE_ROOT:?}/state", target: /run/ardents/state, bind: {create_host_path: false}}
      - client_route:/run/ardents/client-route
      - recovery_introduction_user:/run/ardents/recovery-introduction-user
    networks: {route_net: {ipv4_address: 172.31.20.10}}
  verifier:
    <<: *local
    profiles: [verify]
    command: [/usr/local/bin/ardents-service-qualify, /run/ardents/evidence.json]
    volumes: [{type: bind, source: "${ARDENTS_SERVICE_EVIDENCE_FILE:?}", target: /run/ardents/evidence.json, read_only: true, bind: {create_host_path: false}}]
