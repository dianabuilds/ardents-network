    <<: *local
    profiles: [recovery-verify]
    command: [/usr/local/bin/ardents-recovery-qualify, /run/ardents/evidence.json]
    volumes: [{type: bind, source: "${ARDENTS_RECOVERY_EVIDENCE_FILE:?}", target: /run/ardents/evidence.json, read_only: true, bind: {create_host_path: false}}]

networks:
  route_net:
    internal: true
    ipam: {config: [{subnet: 172.31.20.0/24}]}
  carrier_net:
    internal: true
    ipam: {config: [{subnet: 172.31.21.0/24}]}

volumes:
  publisher_app: {}
  publisher_route: {}
  client_app: {}
  client_route: {}
  administration: {}
  publication: {}
  introduction_ack: {}
  recovery_introduction_user: {}
  recovery_introduction_service: {}
  lifecycle: {}
