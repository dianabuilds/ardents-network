    command: [/usr/local/bin/network-live.test, -test.count=1, -test.v, -test.run, "^TestBlockedEntryRole$"]
    volumes: ["${ARDENTS_BLOCKED_ROOT:?}/sync/bridge:/run/evidence"]

  probe:
    <<: *product
    command: [/usr/local/bin/network-live.test, -test.count=1, -test.v, -test.run, "^TestBlockedEntryRole$"]
    environment: {ARDENTS_BLOCKED_ROLE: probe, ARDENTS_BLOCKED_PROBE_PROFILE: "${ARDENTS_BLOCKED_PROBE_PROFILE:-C5}", ARDENTS_DNS_SYNC: /run/evidence}
