x-product: &product
  image: ${ARDENTS_BLOCKED_IMAGE:?}
  pull_policy: never
  read_only: true
  restart: "no"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  user: "65532:65532"
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=65532,gid=65532", "/run/secure:rw,nosuid,nodev,size=8m,mode=0700,uid=65532,gid=65532"]
  cpus: 2.0
  mem_limit: 512m
  pids_limit: 128
  ulimits: {nofile: {soft: 256, hard: 256}}
  environment: {GOMAXPROCS: "2", GOMEMLIMIT: "384MiB", GOGC: "100"}

x-observer: &observer
  image: ${ARDENTS_BLOCKED_IMAGE:?}
  pull_policy: never
  read_only: true
  restart: "no"
  cap_drop: [ALL]
  cap_add: [NET_RAW]
  security_opt: [no-new-privileges:true]
  # Privileged test observers are isolated from maintained product processes.
  user: "0:0"
  pids_limit: 16
  cpus: 0.25
  mem_limit: 48m
  ulimits: {nofile: {soft: 32, hard: 32}}
  environment: {ARDENTS_DNS_OBSERVER: "1"}
  command: [/usr/local/bin/camouflage.test, -test.run, "^$"]

services:
  endpoint:
    <<: *product
    build:
      context: ../..
      dockerfile: ${ARDENTS_BLOCKED_DOCKERFILE:-tests/live/blocked-entry.Dockerfile}
    command: [/usr/local/bin/network-live.test, -test.count=1, -test.v, -test.run, "^TestBlockedEntryRole$"]
    environment: {ARDENTS_BLOCKED_ROLE: endpoint, ARDENTS_BLOCKED_PROFILE: "${ARDENTS_BLOCKED_PROFILE:?}", ARDENTS_BLOCKED_EXPECT_DRAIN: "${ARDENTS_BLOCKED_EXPECT_DRAIN:-0}", ARDENTS_BLOCKED_OBSERVE_ONLY: "${ARDENTS_BLOCKED_OBSERVE_ONLY:-0}", ARDENTS_BLOCKED_ENDPOINT_ADDRESS: "${ARDENTS_BLOCKED_ENDPOINT_ADDRESS:-203.0.113.7}", ARDENTS_DNS_SYNC: /run/evidence, ARDENTS_STREAM_LIFETIME: 5m}
    volumes:
      - ${ARDENTS_BLOCKED_ROOT:?}/input/endpoint:/run/input:ro
      - ${ARDENTS_BLOCKED_ROOT:?}/sync/endpoint:/run/evidence
      - ${ARDENTS_BLOCKED_ROOT:?}/state/endpoint:/run/state
      - ${ARDENTS_WEBTUNNEL_CLIENT:?}:/candidate/webtunnel-client:ro
      - client_route:/run/ardents/client-route
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=65532,gid=65532", "/run/secure:rw,nosuid,nodev,size=8m,mode=0700,uid=65532,gid=65532"]
    networks:
      entry_net: {ipv4_address: 203.0.113.7}
      route_net: {ipv4_address: 172.31.20.7}
  endpoint-observer:
    <<: *observer
    network_mode: service:endpoint
    environment: {ARDENTS_DNS_OBSERVER: "1", ARDENTS_DNS_SYNC: /run/evidence}
    volumes: ["${ARDENTS_BLOCKED_ROOT:?}/sync/endpoint:/run/evidence"]
  endpoint-control:
    <<: *observer
    network_mode: service:endpoint
    environment: {ARDENTS_BLOCKED_ROLE: control-sender, ARDENTS_BLOCKED_CONTROL_ROLE: endpoint, ARDENTS_BLOCKED_PROFILE: "${ARDENTS_BLOCKED_PROFILE:?}", ARDENTS_BLOCKED_ENDPOINT_ADDRESS: "${ARDENTS_BLOCKED_ENDPOINT_ADDRESS:-203.0.113.7}", ARDENTS_DNS_SYNC: /run/evidence}
    command: [/usr/local/bin/network-live.test, -test.count=1, -test.v, -test.run, "^TestBlockedEntryRole$"]
    volumes: ["${ARDENTS_BLOCKED_ROOT:?}/sync/endpoint:/run/evidence"]
  endpoint-resource-collector:
    <<: *observer
    cap_add: []
    user: "65532:65532"
    network_mode: none
    pid: service:endpoint
    environment: {ARDENTS_BLOCKED_ROLE: resource-collector, ARDENTS_DNS_SYNC: /run/evidence, ARDENTS_BLOCKED_TIMELINE_MONOTONIC_ANCHOR_MILLIS: "${ARDENTS_BLOCKED_TIMELINE_MONOTONIC_ANCHOR_MILLIS:?}"}
    command: [/usr/local/bin/network-live.test, -test.count=1, -test.v, -test.run, "^TestBlockedEntryRole$"]
    volumes: ["${ARDENTS_BLOCKED_ROOT:?}/sync/endpoint:/run/evidence"]
  endpoint-carrier-collector:
    <<: *observer
    cap_add: []
    network_mode: service:endpoint
    environment: {ARDENTS_BLOCKED_ROLE: carrier-collector, ARDENTS_DNS_SYNC: /run/evidence, ARDENTS_BLOCKED_TIMELINE_MONOTONIC_ANCHOR_MILLIS: "${ARDENTS_BLOCKED_TIMELINE_MONOTONIC_ANCHOR_MILLIS:?}"}
    command: [/usr/local/bin/network-live.test, -test.count=1, -test.v, -test.run, "^TestBlockedEntryRole$"]
    volumes: ["${ARDENTS_BLOCKED_ROOT:?}/sync/endpoint:/run/evidence"]
  policy:
    <<: *observer
    cap_add: [NET_ADMIN]
    network_mode: service:endpoint
    environment: {ARDENTS_BLOCKED_ROLE: policy, ARDENTS_BLOCKED_POLICY_TARGETS: "172.31.20.11", ARDENTS_DNS_SYNC: /run/evidence}
    command: [/usr/local/bin/network-live.test, -test.count=1, -test.v, -test.run, "^TestBlockedEntryRole$"]
    volumes: ["${ARDENTS_BLOCKED_ROOT:?}/sync/endpoint:/run/evidence"]

  bridge:
    <<: [*product]
    cpus: ${ARDENTS_BRIDGE_CPUS:-1.6}
    mem_limit: ${ARDENTS_BRIDGE_MEMORY_LIMIT:-1280m}
    mem_reservation: ${ARDENTS_BRIDGE_MEMORY_RESERVATION:-1152m}
    pids_limit: ${ARDENTS_BRIDGE_PIDS:-512}
    ulimits: {nofile: {soft: 4096, hard: 4096}}
    command: [/usr/local/bin/network-live.test, -test.count=1, -test.v, -test.run, "^TestBlockedEntryRole$"]
    environment: {ARDENTS_BLOCKED_ROLE: bridge, ARDENTS_BLOCKED_PROFILE: "${ARDENTS_BLOCKED_PROFILE:?}", ARDENTS_BLOCKED_EXPECT_DRAIN: "${ARDENTS_BLOCKED_EXPECT_DRAIN:-0}", ARDENTS_BLOCKED_OBSERVE_ONLY: "${ARDENTS_BLOCKED_OBSERVE_ONLY:-0}", ARDENTS_BLOCKED_ENDPOINT_ADDRESSES: "${ARDENTS_BLOCKED_ENDPOINT_ADDRESSES:-203.0.113.7}", ARDENTS_DNS_SYNC: /run/evidence, GOMAXPROCS: "${ARDENTS_BRIDGE_GOMAXPROCS:-2}", GOMEMLIMIT: "${ARDENTS_BRIDGE_GOMEMLIMIT:-768MiB}"}
    volumes:
      - ${ARDENTS_BLOCKED_ROOT:?}/input/bridge:/run/input:ro
      - ${ARDENTS_BLOCKED_ROOT:?}/sync/bridge:/run/evidence
      - ${ARDENTS_BLOCKED_ROOT:?}/state/bridge:/run/state
      - ${ARDENTS_WEBTUNNEL_SERVER:?}:/candidate/webtunnel-server:ro
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=65532,gid=65532", "/run/secure:rw,nosuid,nodev,size=8m,mode=0700,uid=65532,gid=65532"]
    networks:
      entry_net: {ipv4_address: 203.0.113.8}
      route_net: {ipv4_address: 172.31.20.8}
  bridge-observer:
    <<: *observer
    network_mode: service:bridge
    environment: {ARDENTS_DNS_OBSERVER: "1", ARDENTS_DNS_SYNC: /run/evidence}
    volumes: ["${ARDENTS_BLOCKED_ROOT:?}/sync/bridge:/run/evidence"]
  bridge-control:
    <<: *observer
    network_mode: service:bridge
    environment: {ARDENTS_BLOCKED_ROLE: control-sender, ARDENTS_BLOCKED_CONTROL_ROLE: bridge, ARDENTS_BLOCKED_PROFILE: "${ARDENTS_BLOCKED_PROFILE:?}", ARDENTS_BLOCKED_ENDPOINT_ADDRESSES: "${ARDENTS_BLOCKED_ENDPOINT_ADDRESSES:-203.0.113.7}", ARDENTS_DNS_SYNC: /run/evidence}
    command: [/usr/local/bin/network-live.test, -test.count=1, -test.v, -test.run, "^TestBlockedEntryRole$"]
    volumes: ["${ARDENTS_BLOCKED_ROOT:?}/sync/bridge:/run/evidence"]
  bridge-resource-collector:
