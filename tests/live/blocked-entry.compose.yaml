    command: [/usr/local/bin/ardents-stream-app, direct-connect, "203.0.113.71:4700", /run/input/own.hex, "${ARDENTS_FINAL_DIRECT_BYTES:-268435456}"]
    environment: {ARDENTS_STREAM_LIFETIME: 3m, ARDENTS_STREAM_MEASURE_DURATION: 60s, ARDENTS_STREAM_START_FILE: /run/evidence/direct.start}
    volumes: ["${ARDENTS_BLOCKED_ROOT:?}/input/client-app:/run/input:ro", "${ARDENTS_BLOCKED_ROOT:?}/sync/direct:/run/evidence"]
