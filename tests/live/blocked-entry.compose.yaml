    command: [/usr/local/bin/ardents-stream-app, direct-listen, ":4700", /run/input/own.hex, "${ARDENTS_FINAL_DIRECT_BYTES:-268435456}"]
    environment: {ARDENTS_STREAM_LIFETIME: 3m, ARDENTS_STREAM_MEASURE_DURATION: 60s}
    volumes: ["${ARDENTS_BLOCKED_ROOT:?}/input/client-app:/run/input:ro"]
    networks: {entry_net: {ipv4_address: 203.0.113.71}}
  direct-publisher-sender:
    <<: *product
    command: [/usr/local/bin/ardents-stream-app, direct-connect, "203.0.113.70:4700", /run/input/own.hex, "${ARDENTS_FINAL_DIRECT_BYTES:-268435456}"]
    environment: {ARDENTS_STREAM_LIFETIME: 3m, ARDENTS_STREAM_MEASURE_DURATION: 60s, ARDENTS_STREAM_START_FILE: /run/evidence/direct.start}
