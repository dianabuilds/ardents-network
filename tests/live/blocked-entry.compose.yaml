      - ${ARDENTS_BLOCKED_ROOT:?}/sync/probe:/run/evidence
      - ${ARDENTS_WEBTUNNEL_CLIENT:?}:/candidate/webtunnel-client:ro
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=65532,gid=65532", "/run/secure:rw,nosuid,nodev,size=8m,mode=0700,uid=65532,gid=65532", "/run/state:rw,nosuid,nodev,size=16m,mode=0700,uid=65532,gid=65532"]
