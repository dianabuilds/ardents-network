x-route: &route
  image: ${ARDENTS_LIVE_IMAGE:?}
  pull_policy: never
  read_only: true
  restart: "no"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  user: "0:0"
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=8m"]
  cpus: 1.0
  mem_limit: 512m
  pids_limit: 256
  ulimits: {nofile: {soft: 512, hard: 512}}
  environment: {GOMAXPROCS: "1", GOMEMLIMIT: "320MiB", GOGC: "100"}
  networks: [route_net]

x-local: &local
  image: ${ARDENTS_LIVE_IMAGE:?}
  pull_policy: never
  read_only: true
  restart: "no"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  user: "0:0"
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=8m"]
  cpus: 0.5
  mem_limit: 128m
  pids_limit: 32
  network_mode: none

x-build: &build
  build:
    context: ../..
    dockerfile: tests/live/network.Dockerfile

services:
  publisher:
    <<: [*route, *build]
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plans/publisher.json]
    volumes:
      - ${ARDENTS_LIVE_ROOT:?}/plans:/run/ardents/plans:ro
      - ${ARDENTS_LIVE_ROOT:?}/secrets:/run/ardents/secrets:ro
      - publisher_route:/run/ardents/publisher-route
    networks: {route_net: {ipv4_address: 172.31.20.16}}
  responder:
    <<: *route
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plans/responder.json]
    volumes:
      - ${ARDENTS_LIVE_ROOT:?}/plans:/run/ardents/plans:ro
      - ${ARDENTS_LIVE_ROOT:?}/secrets:/run/ardents/secrets:ro
    networks: {route_net: {ipv4_address: 172.31.20.14}}
  rendezvous:
    <<: *route
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plans/rendezvous.json]
    volumes:
      - ${ARDENTS_LIVE_ROOT:?}/plans:/run/ardents/plans:ro
      - ${ARDENTS_LIVE_ROOT:?}/secrets:/run/ardents/secrets:ro
    networks: {route_net: {ipv4_address: 172.31.20.13}}
  introduction:
    <<: *route
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plans/introduction.json]
    volumes:
      - ${ARDENTS_LIVE_ROOT:?}/plans:/run/ardents/plans:ro
      - ${ARDENTS_LIVE_ROOT:?}/secrets:/run/ardents/secrets:ro
      - introduction_ack:/run/ardents/introduction-ack
    networks: {route_net: {ipv4_address: 172.31.20.12}}
  initiator:
    <<: *route
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plans/initiator.json]
    volumes:
      - ${ARDENTS_LIVE_ROOT:?}/plans:/run/ardents/plans:ro
      - ${ARDENTS_LIVE_ROOT:?}/secrets:/run/ardents/secrets:ro
    networks: {route_net: {ipv4_address: 172.31.20.11}}
  client:
    <<: *route
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plans/client.json]
    volumes:
      - ${ARDENTS_LIVE_ROOT:?}/plans:/run/ardents/plans:ro
      - ${ARDENTS_LIVE_ROOT:?}/secrets:/run/ardents/secrets:ro
      - ${ARDENTS_LIVE_ROOT:?}/state:/run/ardents/state
      - client_route:/run/ardents/client-route
    networks: {route_net: {ipv4_address: 172.31.20.10}}
  capacity-client:
    <<: *route
    command: [/usr/local/bin/ardents-route, run, /run/ardents/plans/client.json]
    volumes:
      - ${ARDENTS_LIVE_ROOT:?}/plans:/run/ardents/plans:ro
      - ${ARDENTS_LIVE_ROOT:?}/secrets:/run/ardents/secrets:ro
    networks: [route_net]
  publisher-service:
    <<: *local
    command: [/usr/local/bin/ardents-service, run, /run/ardents/input/service-publisher.json]
    volumes:
      - ${ARDENTS_LIVE_ROOT:?}:/run/ardents/input:ro
      - publisher_app:/run/ardents/publisher-app
      - publisher_route:/run/ardents/publisher-route
      - administration:/run/ardents/admin
      - publication:/run/ardents/publication
      - introduction_ack:/run/ardents/introduction-ack
      - lifecycle:/run/ardents/lifecycle
  client-service:
    <<: *local
    command: [/usr/local/bin/ardents-service, run, /run/ardents/input/service-client.json]
    volumes:
      - ${ARDENTS_LIVE_ROOT:?}:/run/ardents/input:ro
      - client_app:/run/ardents/client-app
      - client_route:/run/ardents/client-route
      - publication:/run/ardents/publication:ro
  publication-operator:
    <<: *local
    command: [/usr/local/bin/ardents-publish-app, publish, /run/ardents/admin/admin.sock]
    volumes: [administration:/run/ardents/admin]
  publisher-app:
    <<: *local
    command: [/usr/local/bin/ardents-stream-app, run, publisher, /run/ardents/publisher-app/app.sock, /run/ardents/input/publisher-seed.hex, /run/ardents/input/client-seed.hex, "${ARDENTS_LIVE_PUBLISHER_SEND_BYTES:-0}", "${ARDENTS_LIVE_PUBLISHER_RECEIVE_BYTES:-201326592}"]
    environment: {ARDENTS_STREAM_LIFETIME: "30m", ARDENTS_STREAM_PROGRESS: "1", ARDENTS_STREAM_CHUNK_DELAY: "${ARDENTS_LIVE_CHUNK_DELAY:-}"}
    volumes:
      - ${ARDENTS_LIVE_ROOT:?}:/run/ardents/input:ro
      - publisher_app:/run/ardents/publisher-app
  client-app:
    <<: *local
    command: [/usr/local/bin/ardents-stream-app, run, client, /run/ardents/client-app/app.sock, /run/ardents/input/client-seed.hex, /run/ardents/input/publisher-seed.hex, "${ARDENTS_LIVE_CLIENT_SEND_BYTES:-201326592}", "${ARDENTS_LIVE_CLIENT_RECEIVE_BYTES:-0}"]
    environment: {ARDENTS_STREAM_LIFETIME: "30m", ARDENTS_STREAM_PROGRESS: "1", ARDENTS_STREAM_CHUNK_DELAY: "${ARDENTS_LIVE_CHUNK_DELAY:-}"}
    volumes:
      - ${ARDENTS_LIVE_ROOT:?}:/run/ardents/input:ro
      - client_app:/run/ardents/client-app
  direct-receiver:
    <<: *route
    command: [/usr/local/bin/ardents-stream-app, direct-listen, ":4700", /run/ardents/input/client-seed.hex, "${ARDENTS_LIVE_DIRECT_BYTES:-4194304}"]
    environment: {ARDENTS_STREAM_LIFETIME: "20m", ARDENTS_STREAM_MEASURE_DURATION: "60s"}
    volumes: ["${ARDENTS_LIVE_ROOT:?}:/run/ardents/input:ro"]
    networks: {route_net: {ipv4_address: 172.31.20.22}}
  direct-sender:
    <<: *route
    command: [/usr/local/bin/ardents-stream-app, direct-connect, "172.31.20.22:4700", /run/ardents/input/client-seed.hex, "${ARDENTS_LIVE_DIRECT_BYTES:-4194304}"]
    environment: {ARDENTS_STREAM_LIFETIME: "20m", ARDENTS_STREAM_MEASURE_DURATION: "60s", ARDENTS_STREAM_START_FILE: "/run/ardents/input/direct.start"}
    volumes: ["${ARDENTS_LIVE_ROOT:?}:/run/ardents/input:ro"]
    networks: {route_net: {ipv4_address: 172.31.20.21}}
networks:
  route_net:
    internal: true
    ipam: {config: [{subnet: 172.31.20.0/24}]}

volumes:
  publisher_app: {}
  publisher_route: {}
  client_app: {}
  client_route: {}
  administration: {}
  publication: {}
  introduction_ack: {}
  lifecycle: {}
