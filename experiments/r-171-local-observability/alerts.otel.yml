groups:
  - name: synthetic-source-observation
    rules:
      - alert: FixtureQueuePressure
        expr: diagnostic_fixture_queue_items > 10
        for: 6s
        labels:
          severity: warning
          scope: synthetic_fixture
        annotations:
          summary: Synthetic fixture queue exceeds ten items
      - alert: FixtureObservationUnavailable
        expr: up{job="fixture"} == 0
        for: 6s
        labels:
          severity: warning
          scope: synthetic_fixture
        annotations:
          summary: Fixture metrics scrape failed; no Node health conclusion
      - alert: CollectorObservationUnavailable
        expr: up{job="collector"} == 0
        for: 6s
        labels:
          severity: warning
          scope: collector
        annotations:
          summary: Collector scrape failed; log delivery requires separate evidence
      - alert: LogStoragePressure
        expr: increase(loki_ingester_wal_disk_full_failures_total{job="logbackend"}[30s]) > 0
        for: 6s
        labels:
          severity: warning
          scope: log_storage
        annotations:
          summary: Loki WAL disk failure observed; accepted logs may lack durable storage
      - alert: CollectorLogDeliveryBacklog
        expr: sum(otelcol_exporter_queue_size{job="collector",exporter="otlp_http/fixture",data_type="logs"}) > 0
        for: 6s
        labels:
          severity: warning
          scope: log_delivery
        annotations:
          summary: Collector serialized-byte queue has remained nonempty; delivery requires separate evidence
      - alert: CollectorLogRecordsLost
        expr: sum(otelcol_exporter_send_failed_log_records{job="collector",exporter="otlp_http/fixture"}) > 0
        labels: {severity: warning, scope: log_history}
        annotations:
          summary: "Коллектор сообщил окончательно неотправленные записи в текущей сессии"
          description: "Пустая очередь и восстановление доставки не возвращают потерянные записи. Счётчик относится к сессии коллектора; его отсутствие не доказывает полную историю."

      - alert: CollectorLogEnqueueRejected
        expr: sum(otelcol_exporter_enqueue_failed_log_records{job="collector"}) > 0
        labels: {severity: warning, scope: log_delivery}
        annotations:
          summary: "Коллектор отказал в постановке записей в очередь в текущей сессии"
          description: "Повторная доставка может восстановить записи; отказ очереди сам по себе не доказывает окончательную потерю. Проверьте исходный поток и историю доставки."