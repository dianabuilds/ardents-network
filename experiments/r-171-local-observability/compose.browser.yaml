services:
  browser-tunnel:
    image: ${R171_HELPER_IMAGE:?}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.1
    pids_limit: 64
    networks: [probe]
    entrypoint: [python3, -c, "import time; time.sleep(600)"]
    logging:
      driver: local
      options:
        max-size: "2m"
        max-file: "2"
