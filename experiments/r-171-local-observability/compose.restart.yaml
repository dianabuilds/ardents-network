# Bounded RAM state survives backend-container restart while the anchor holds mounts.
# This does not provide Docker-daemon/host reboot persistence.
services:
  state-anchor:
    image: ${R171_HELPER_IMAGE:?explicit installed helper required}
    entrypoint: [sleep, "600"]
    restart: "no"
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    pids_limit: 4
    shm_size: 1m
    mem_limit: 16m
    cpus: 0.01
    labels:
      ardents.research: R171-pipeline
    logging:
      driver: local
      options: {max-size: "2m", max-file: "2", compress: "false"}
    volumes:
      - prometheus-state:/state/prometheus:ro
      - alertmanager-state:/state/alertmanager:ro
      - loki-state:/state/loki:ro
      - alloy-state:/state/alloy:ro
      - grafana-state:/state/grafana:ro
  prometheus:
    depends_on: [state-anchor]
    tmpfs: !override []
    volumes: [prometheus-state:/state]
  alertmanager:
    depends_on: [state-anchor]
    tmpfs: !override []
    volumes: [alertmanager-state:/state]
  loki:
    depends_on: [state-anchor]
    tmpfs: !override []
    volumes: [loki-state:/state]
  alloy:
    depends_on: [state-anchor]
    tmpfs: !override []
    volumes: [alloy-state:/state]
  grafana:
    depends_on: [state-anchor]
    tmpfs: !override ["/tmp:rw,nosuid,nodev,noexec,size=33554432,uid=10001,gid=10001,mode=0700"]
    volumes: [grafana-state:/state]
volumes:
  prometheus-state:
    driver: local
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=536870912,uid=10001,gid=10001,mode=0700"}
  alertmanager-state:
    driver: local
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=33554432,uid=10001,gid=10001,mode=0700"}
  loki-state:
    driver: local
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=536870912,uid=10001,gid=10001,mode=0700"}
  alloy-state:
    driver: local
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=67108864,uid=10001,gid=10001,mode=0700"}
  grafana-state:
    driver: local
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=134217728,uid=10001,gid=10001,mode=0700"}