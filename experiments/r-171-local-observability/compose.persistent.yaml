# Explicit persistent research profile; use after compose.restart.yaml.
# Named volumes survive backend replacement; retention is not a disk quota.
services:
  state-anchor:
    profiles: [volatile-only]
  state-initialize:
    image: ${R171_HELPER_IMAGE:?}
    entrypoint: [python3, -B, /probe/initialize-state.py]
    user: "0:0"
    restart: "no"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 16
    shm_size: 1m
    logging:
      driver: local
      options: {max-size: "2m", max-file: "2", compress: "false"}
    volumes:
      - ${R171_SOURCE}:/probe:ro
      - prometheus-state:/state/prometheus
      - alertmanager-state:/state/alertmanager
      - loki-state:/state/loki
      - alloy-state:/state/alloy
      - grafana-state:/state/grafana
  prometheus:
    depends_on: !override
      state-initialize:
        condition: service_completed_successfully
  alertmanager:
    depends_on: !override
      state-initialize:
        condition: service_completed_successfully
  loki:
    depends_on: !override
      state-initialize:
        condition: service_completed_successfully
  alloy:
    depends_on: !override
      state-initialize:
        condition: service_completed_successfully
  grafana:
    depends_on: !override
      state-initialize:
        condition: service_completed_successfully
volumes:
  prometheus-state:
    driver_opts: !reset {}
  alertmanager-state:
    driver_opts: !reset {}
  loki-state:
    driver_opts: !reset {}
  alloy-state:
    driver_opts: !reset {}
  grafana-state:
    driver_opts: !reset {}
