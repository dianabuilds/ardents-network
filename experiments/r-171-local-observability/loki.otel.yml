auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  http_tls_config:
    cert_file: /certs/server.crt
    key_file: /certs/server.key
    client_auth_type: RequireAndVerifyClientCert
    client_ca_file: /certs/ca.crt
common:
  path_prefix: /state
  instance_addr: 127.0.0.1
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: '2026-01-01'
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
storage_config:
  filesystem:
    directory: /state/chunks
limits_config:
  allow_structured_metadata: true
  discover_service_name: []
  max_structured_metadata_size: 16384
  max_structured_metadata_entries_count: 16
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes: [job]
        - action: drop
          regex: '.*'
    scope_attributes:
      - action: drop
        regex: '.*'
    log_attributes:
      - action: structured_metadata
        attributes: [at, level, scope, event, sequence]
      - action: drop
        regex: '.*'
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 2
  max_line_size: 16384
  max_global_streams_per_user: 8
  max_query_series: 64
  max_entries_limit_per_query: 1000
  split_queries_by_interval: 15m
analytics:
  reporting_enabled: false
ingester:
  wal:
    dir: /state/wal
