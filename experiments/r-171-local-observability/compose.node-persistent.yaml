# Explicit persistent real-source engineering preview; apply last.
services:
  state-initialize:
    entrypoint: !override [python3, -B, /probe/initialize-state.py, --journal]
    volumes:
      - fixture:/state/journal
  fixture:
    depends_on:
      state-initialize:
        condition: service_completed_successfully
    entrypoint: !override [python3, -B, /probe/probe-node-resource.py, --preview-seconds, "3600", --persistent-journal]
  prometheus:
    command: !override [--config.file=/probe/prometheus.node.yml, --web.config.file=/certs/web.yml, --storage.tsdb.path=/state, --storage.tsdb.retention.time=72h, --storage.tsdb.retention.size=1GB]
  loki:
    command: !override [-config.file=/probe/loki.otel.yml, -compactor.retention-enabled=true, -compactor.working-directory=/state/compactor, -compactor.delete-request-store=filesystem, -compactor.deletion-mode=disabled, -store.retention=72h, -compactor.retention-delete-worker-count=2]
  alertmanager:
    command: !override [--config.file=/probe/alertmanager.yml, --web.config.file=/certs/web.yml, --storage.path=/state, --cluster.listen-address=, --data.retention=72h]
volumes:
  fixture:
    driver_opts: !reset {}
