x-common: &common
  restart: "no"
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 32
  shm_size: 1m
  networks: [probe]
  labels:
    ardents.research: R171-pipeline
  logging:
    driver: local
    options:
      max-size: "2m"
      max-file: "2"
      compress: "false"
services:
  fixture:
    <<: *common
    image: ${R171_HELPER_IMAGE:?explicit installed helper required}
    mem_limit: 64m
    cpus: 0.25
    entrypoint: [python3, /probe/fixture.py]
    volumes:
      - ${R171_SOURCE:?}:/probe:ro
      - fixture:/fixture
  prometheus:
    <<: *common
    image: ${R171_PROMETHEUS_IMAGE:?}
    mem_limit: 768m
    cpus: 0.75
    command: ["--config.file=/probe/prometheus.yml", "--web.config.file=/certs/web.yml", "--storage.tsdb.path=/state", "--storage.tsdb.retention.time=1h", "--storage.tsdb.retention.size=128MB"]
    tmpfs: ["/state:rw,nosuid,nodev,noexec,size=536870912,uid=10001,gid=10001,mode=0700"]
    volumes:
      - ${R171_SOURCE}:/probe:ro
      - ${R171_PRIVATE:?}/prometheus:/certs:ro
  alertmanager:
    <<: *common
    image: ${R171_ALERTMANAGER_IMAGE:?}
    mem_limit: 128m
    cpus: 0.25
    command: ["--config.file=/probe/alertmanager.yml", "--web.config.file=/certs/web.yml", "--storage.path=/state", "--cluster.listen-address=", "--data.retention=1h"]
    tmpfs: ["/state:rw,nosuid,nodev,noexec,size=33554432,uid=10001,gid=10001,mode=0700"]
    volumes:
      - ${R171_SOURCE}:/probe:ro
      - ${R171_PRIVATE}/alertmanager:/certs:ro
  loki:
    <<: *common
    image: ${R171_LOKI_IMAGE:?}
    mem_limit: 768m
    cpus: 0.75
    command: ["-config.file=/probe/loki.yml"]
    tmpfs: ["/state:rw,nosuid,nodev,noexec,size=536870912,uid=10001,gid=10001,mode=0700"]
    volumes:
      - ${R171_SOURCE}:/probe:ro
      - ${R171_PRIVATE}/loki:/certs:ro
  alloy:
    <<: *common
    image: ${R171_ALLOY_IMAGE:?}
    mem_limit: 512m
    cpus: 0.5
    command: [run, "--disable-reporting", "--server.http.disable-support-bundle", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/state", /probe/config.alloy]
    tmpfs: ["/state:rw,nosuid,nodev,noexec,size=67108864,uid=10001,gid=10001,mode=0700"]
    volumes:
      - ${R171_SOURCE}:/probe:ro
      - ${R171_PRIVATE}/alloy:/certs:ro
      - fixture:/fixture:ro
  grafana:
    <<: *common
    pids_limit: 96
    image: ${R171_GRAFANA_IMAGE:?}
    mem_limit: 512m
    cpus: 0.5
    tmpfs: ["/state:rw,nosuid,nodev,noexec,size=134217728,uid=10001,gid=10001,mode=0700", "/tmp:rw,nosuid,nodev,noexec,size=33554432,uid=10001,gid=10001,mode=0700"]
    environment:
      GF_PATHS_DATA: /state
      GF_PATHS_LOGS: /state/logs
      GF_PATHS_PLUGINS: /state/plugins
      GF_PATHS_BUNDLED_PLUGINS: /usr/share/grafana/data/plugins-bundled
      GF_PATHS_PROVISIONING: /private/provisioning
      GF_SECURITY_ADMIN_USER: probe
      GF_SECURITY_ADMIN_PASSWORD__FILE: /private/password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_PLUGINS_DISABLE_PLUGINS: elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,mssql,mysql,opentsdb,stackdriver,tempo,zipkin,cloudwatch,grafana-azure-monitor-datasource
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    volumes:
      - ${R171_PRIVATE}/grafana:/private:ro

networks:
  probe:
    internal: true
volumes:
  fixture:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=16777216,uid=10001,gid=10001,mode=0700"