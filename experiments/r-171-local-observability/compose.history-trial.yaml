# Isolated synthetic trial: not a replacement for Prometheus Node rules.
# Pass R171_ALERT_HISTORY_TRIAL=1 to private preparation explicitly.
services:
  grafana:
    environment:
      GF_UNIFIED_ALERTING_STATE_HISTORY_ENABLED: "true"
      GF_UNIFIED_ALERTING_STATE_HISTORY_BACKEND: annotations
      GF_UNIFIED_ALERTING_STATE_HISTORY_ANNOTATIONS_MAX_AGE: 3d
      GF_UNIFIED_ALERTING_STATE_HISTORY_ANNOTATIONS_MAX_ANNOTATIONS_TO_KEEP: "10000"
      GF_ANNOTATIONS_API_MAX_AGE: 3d
      GF_ANNOTATIONS_API_MAX_ANNOTATIONS_TO_KEEP: "1000"
      GF_UNIFIED_ALERTING_MIN_INTERVAL: 10s
