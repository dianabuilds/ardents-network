# Explicit finite real-source preview, not maintained backend admission.
services:
  fixture:
    image: ${R171_HELPER_IMAGE:?}
    mem_limit: 512m
    cpus: 0.25
    pids_limit: 64
    entrypoint: !override [python3, -B, /probe/probe-node-resource.py, --preview-seconds, "3600"]
    working_dir: /probe
    stop_grace_period: 20s
    tmpfs: ["/tmp:rw,nosuid,nodev,exec,size=67108864,uid=10001,gid=10001,mode=0700"]
    networks:
      probe:
        aliases: [node]
    volumes: !override
      - ${R171_SOURCE}:/probe:ro
      - ${R171_REPO:?}/tests/qualification/stream-network-two-host:/qualification:ro
      - ${R171_NODE_BINARIES:?}:/binaries:ro
      - ${R171_PRIVATE}/source-reports:/reports
      - fixture:/events
      - node-certs:/metrics-certs:ro
  prometheus:
    command: !override [--config.file=/probe/prometheus.node.yml, --web.config.file=/certs/web.yml, --storage.tsdb.path=/state, --storage.tsdb.retention.time=1h, --storage.tsdb.retention.size=128MB]
  alloy:
    command: !override [--config, /probe/otel.node.yml]
  browser-tunnel:
    user: "10002:10002"
    volumes: [node-certs:/metrics-anchor:ro]
    entrypoint: !override [python3, -c, "import signal,sys,time; signal.signal(signal.SIGTERM,lambda *_:sys.exit(0)); time.sleep(3700)"]
volumes:
  node-certs:
    driver: local

    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1048576,uid=10001,gid=10001,mode=0700"
