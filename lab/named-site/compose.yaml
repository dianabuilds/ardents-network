x-role: &role
  image: ${GATEC_REFERENCE_IMAGE:?}
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]
  cpus: "0.50"
  mem_limit: 256m
  pids_limit: 32

x-application: &application
  <<: *role
  mem_limit: 512m
  network_mode: none

services:
  http-client:
    <<: *application
    user: "65532:65532"
    command: ["role", "--role", "http-client", "--socket", "/client/app.sock", "--nonce", "${GATEC_NONCE:?}", "--evidence-dir", "/evidence"]
    volumes:
      - {type: bind, source: "${GATEC_CLIENT_DIR:?}", target: /client, bind: {create_host_path: false}}
      - {type: bind, source: "${GATEC_EVIDENCE_DIR:?}/http-client", target: /evidence, bind: {create_host_path: false}}
  http-application:
    <<: *application
    user: "65534:65534"
    command: ["role", "--role", "http-application", "--socket", "/service/app.sock", "--nonce", "${GATEC_NONCE:?}", "--evidence-dir", "/evidence"]
    volumes:
      - {type: bind, source: "${GATEC_SERVICE_DIR:?}", target: /service, bind: {create_host_path: false}}
      - {type: bind, source: "${GATEC_EVIDENCE_DIR:?}/http-application", target: /evidence, bind: {create_host_path: false}}
  client-endpoint:
    <<: *role
    user: "65533:65533"
    command: ["role", "--role", "client-endpoint", "--config", "/config/client.json", "--evidence-dir", "/evidence"]
    networks: [client-relay]
    volumes:
      - {type: bind, source: "${GATEC_CLIENT_CONFIG_DIR:?}", target: /config, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${GATEC_CLIENT_DIR:?}", target: /client, bind: {create_host_path: false}}
      - {type: bind, source: "${GATEC_ROUTE_DIR:?}", target: /route, bind: {create_host_path: false}}
      - {type: bind, source: "${GATEC_GATEWAY_DIR:?}", target: /gateway, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${GATEC_EVIDENCE_DIR:?}/client-endpoint", target: /evidence, bind: {create_host_path: false}}
  administration:
    <<: *role
    user: "65535:65535"
    network_mode: none
    command: ["role", "--role", "administration", "--socket", "/authority/admin.sock", "--config", "/config/administration.json", "--evidence-dir", "/evidence"]
    volumes:
      - {type: bind, source: "${GATEC_ADMIN_CONFIG_DIR:?}", target: /config, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${GATEC_ADMIN_DIR:?}", target: /authority, bind: {create_host_path: false}}
      - {type: bind, source: "${GATEC_EVIDENCE_DIR:?}/administration", target: /evidence, bind: {create_host_path: false}}
  authority:
    <<: *role
    user: "65536:65536"
    network_mode: none
    command: ["role", "--role", "authority", "--socket", "/admin/admin.sock", "--gateway-socket", "/gateway-authority/gateway.sock", "--config", "/config/authority.json", "--evidence-dir", "/evidence"]
    volumes:
      - {type: bind, source: "${GATEC_AUTHORITY_CONFIG_DIR:?}", target: /config, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${GATEC_ADMIN_DIR:?}", target: /admin, bind: {create_host_path: false}}
      - {type: bind, source: "${GATEC_GATEWAY_AUTHORITY_DIR:?}", target: /gateway-authority, bind: {create_host_path: false}}
      - {type: bind, source: "${GATEC_EVIDENCE_DIR:?}/authority", target: /evidence, bind: {create_host_path: false}}
  relay:
    <<: *role
    user: "65537:65537"
    command: ["role", "--role", "resolution-relay", "--evidence-dir", "/evidence"]
    networks: [client-relay, relay-gateway]
    volumes: [{type: bind, source: "${GATEC_EVIDENCE_DIR:?}/relay", target: /evidence, bind: {create_host_path: false}}]
  gateway:
    <<: *role
    user: "65538:65538"
    command: ["role", "--role", "resolution-gateway", "--config", "/config/client.json", "--socket", "/gateway/key-config.bin", "--evidence-dir", "/evidence"]
    networks: [relay-gateway]
    volumes:
      - {type: bind, source: "${GATEC_CLIENT_CONFIG_DIR:?}", target: /config, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${GATEC_GATEWAY_AUTHORITY_DIR:?}", target: /authority, bind: {create_host_path: false}}
      - {type: bind, source: "${GATEC_GATEWAY_DIR:?}", target: /gateway, bind: {create_host_path: false}}
      - {type: bind, source: "${GATEC_EVIDENCE_DIR:?}/gateway", target: /evidence, bind: {create_host_path: false}}

networks:
  client-relay: {internal: true}
  relay-gateway: {internal: true}
